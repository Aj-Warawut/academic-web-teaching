<!DOCTYPE html>
<!-- บทเรียนโต้ตอบ · ทักษะสายไอทีสู่โลกการทำงาน (สำหรับ ปวส.) · สร้างจาก ResearchLab interactive lesson template -->
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทักษะสายไอทีสู่โลกการทำงาน · อ.ดร.วราวุฒิ นาคบุญนำ</title>
<style>
:root{
  --navy:#141D3F;--blue:#2F5BD0;--teal:#2FA392;--amber:#E9A72C;--gold2:#F4C150;--purple:#8A56D6;--red:#C0392B;--green:#2E7D5B;
  --ink:#1B2A3A;--mute:#5C6B7A;--line:#DCE3EC;--tint:#EEF3FB;--bg:#F5F7FC;--panel:#fff;--sidebar:#141D3F;--shadow:0 6px 22px rgba(17,34,51,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Sarabun','Segoe UI',Tahoma,'Leelawadee UI',sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;display:flex;min-height:100vh;overflow:hidden}
#sidebar{width:300px;flex:0 0 300px;background:var(--sidebar);color:#E8EEF7;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
#sidebar .brand{padding:22px 22px 16px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer}
#sidebar .brand .kick{font-size:11px;letter-spacing:2px;color:var(--amber);font-weight:700}
#sidebar .brand h1{font-size:18px;color:#fff;margin-top:6px;line-height:1.35}
#sidebar .brand .sub{font-size:12px;color:#9DB0D6;margin-top:6px}
.nav-group{padding:14px 22px 4px;font-size:11px;letter-spacing:1px;color:#7E92BD;font-weight:700;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 22px;cursor:pointer;font-size:14.5px;color:#CBD6EC;border-left:3px solid transparent;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.10);color:#fff;border-left-color:var(--amber);font-weight:600}
.nav-item .dot{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.nav-item.active .dot{background:var(--amber);color:var(--navy)}
#sidebar .foot{padding:14px 22px;font-size:11px;color:#7E92BD;border-top:1px solid rgba(255,255,255,.1)}
#main{flex:1;height:100vh;overflow-y:auto;position:relative;scroll-behavior:smooth}
#progress{position:sticky;top:0;z-index:20;height:4px;background:var(--line)}
#progress .bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0;transition:.3s}
.wrap{max-width:940px;margin:0 auto;padding:38px 46px 120px}
section.page{display:none;animation:fade .35s ease}section.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--teal);text-transform:uppercase}
h2.title{font-size:29px;color:var(--navy);margin:6px 0 4px;line-height:1.3}
.lead{font-size:16px;color:var(--mute);margin-bottom:22px}
p{margin:0 0 14px}h3{font-size:20px;color:var(--blue);margin:26px 0 12px}
.grid{display:grid;gap:16px}.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:1fr 1fr 1fr}.grid.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.card h4{font-size:16px;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:9px}
.card p{font-size:14.5px;color:var(--ink);margin:0}
.num{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num.t{background:var(--teal)}.num.a{background:var(--amber)}.num.p{background:var(--purple)}
ul.clean{list-style:none;margin:0 0 14px}ul.clean li{position:relative;padding:6px 0 6px 26px;font-size:15px}
ul.clean li::before{content:"";position:absolute;left:4px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.callout{border-radius:12px;padding:14px 18px;margin:16px 0;font-size:14.5px;border-left:5px solid}
.callout.tip{background:#FBEFD8;border-color:var(--amber)}.callout.info{background:var(--tint);border-color:var(--blue)}.callout.ok{background:#E9F5EF;border-color:var(--green)}
.callout b{color:var(--navy)}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:38px 34px;margin-bottom:8px}
.hero .kick{color:var(--amber);font-weight:700;letter-spacing:2px;font-size:13px}
.hero h2{font-size:32px;margin:10px 0;line-height:1.25}.hero p{color:#CADCFC;font-size:16px;margin:0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{background:rgba(255,255,255,.14);padding:6px 14px;border-radius:20px;font-size:13px}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0}
.statc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);min-width:150px}
.statc .n{font-size:30px;font-weight:800;color:var(--blue)}.statc .l{font-size:13px;color:var(--mute)}
.srcline{font-size:12.5px;color:var(--mute)}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:10px 0}
.stg{border-radius:12px;padding:14px 10px;color:#fff;text-align:center}.stg b{font-size:15px;display:block}.stg span{font-size:12px;opacity:.95}
@media(max-width:760px){.stages{grid-template-columns:1fr 1fr}}
.navbtns{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 20px;cursor:pointer;font-size:14.5px;font-family:inherit;color:var(--blue);font-weight:600;transition:.15s;display:flex;align-items:center;gap:8px}
.btn:hover{background:var(--blue);color:#fff}.btn.primary{background:var(--blue);color:#fff}.btn:disabled{opacity:.35;cursor:default}
#toolbar{position:fixed;top:12px;right:14px;z-index:60;display:flex;gap:6px;align-items:center}
#toolbar button,#toolbar a{background:rgba(20,29,63,.92);color:#fff;border:none;border-radius:9px;height:38px;padding:0 12px;font-size:13.5px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);transition:.15s;text-decoration:none}
#toolbar button:hover,#toolbar a:hover{background:var(--blue)}#toolbar button.on{background:var(--amber);color:var(--navy)}
#toolbar .home{background:linear-gradient(135deg,#F4C150,#E9A72C);color:#111A3A;font-weight:800}
#toolbar .az{width:38px;justify-content:center;padding:0;font-weight:700}
#menuToggle{display:none}#backdrop{display:none}
body.projector #sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s}
body.projector #sidebar.open{transform:none}
body.projector #backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
body.projector #menuToggle{display:flex}
body.projector .wrap{max-width:1180px;padding:70px 60px 120px}
@media(max-width:820px){
  body{overflow:auto}
  #sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s}#sidebar.open{transform:none}
  #backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  #menuToggle{display:flex;position:fixed;top:12px;left:12px;z-index:30;background:var(--navy);color:#fff;border:none;border-radius:10px;width:44px;height:44px;font-size:20px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .wrap{padding:64px 20px 100px}.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}h2.title{font-size:23px}
}
/* interactive widgets */
.expset{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.exp{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--mute);cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.exp:hover{border-color:var(--blue);color:var(--blue)}
.exp.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.exp-detail{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);margin-top:4px;font-size:14.5px;min-height:56px}
.exp-detail h4{color:var(--blue);font-size:17px;margin-bottom:4px}
.exp-detail .ex{font-size:13px;color:var(--mute);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.builder{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.builder label{font-size:12.5px;font-weight:700;color:var(--mute);display:block;margin:8px 0 3px}
.builder input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:14.5px}
.builder input:focus{outline:2px solid #cfe0ff;border-color:var(--blue)}
.story-out{margin-top:14px;background:var(--tint);border-left:5px solid var(--blue);border-radius:10px;padding:14px 16px;font-size:15.5px;color:var(--navy)}
.story-out b{color:var(--blue)}
.tset{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.tbtn:hover{border-color:var(--blue)}
.tres{margin-top:8px;border-radius:10px;padding:13px 16px;font-size:14.5px;min-height:52px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;margin-right:6px}
.tag.hw{background:#E1EBFF;color:#2748A0}.tag.sw{background:#EAF6EF;color:#2E7D46}.tag.net{background:#FBEFD3;color:#9A6B0C}
.quiz{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.quiz .q{font-weight:700;color:var(--navy);margin-bottom:10px}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:8px;font-family:inherit;font-size:14.5px;cursor:pointer;transition:.12s}
.qopt:hover{border-color:var(--blue)}
.qopt.ok{background:#E9F5EF;border-color:var(--green);color:var(--green);font-weight:700}
.qopt.no{background:#FDECEC;border-color:var(--red);color:var(--red)}
.qfb{font-size:13.5px;margin-top:6px;display:none}.qfb.show{display:block}
.checklist{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px;cursor:pointer;border-bottom:1px dashed var(--line)}
.checklist label:last-child{border-bottom:none}
.checklist input{margin-top:4px;transform:scale(1.2)}
.planner{display:grid;grid-template-columns:1fr;gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--teal)}
.pcard h4{color:var(--teal);font-size:15px;margin-bottom:6px}
.pcard textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:inherit;font-size:14px;resize:vertical;min-height:60px}
@media print{#sidebar,#toolbar,#menuToggle,.navbtns{display:none!important}#main{height:auto;overflow:visible}.wrap{max-width:100%}section.page{display:block!important;page-break-after:always}}

.figimg{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);display:block;margin:6px 0}
.fig{margin:16px 0}.fig figcaption{font-size:12.5px;color:var(--mute);margin-top:6px;text-align:center}
.hero-banner{margin-bottom:16px}
.selfblock{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.selfblock h3{margin:0 0 10px}
.selfblock .figimg{max-width:560px;margin:0 auto 12px}
.selfrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.selfrow>span{font-size:14.5px;font-weight:600;color:var(--navy)}
.rate{display:flex;gap:6px}
.rate button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-family:inherit;font-size:13px;cursor:pointer;transition:.12s}
.rate button:hover{border-color:var(--blue)}
.rate button.s2{background:#E9F5EF;border-color:var(--green);color:var(--green);font-weight:700}
.rate button.s1{background:#FBEFD8;border-color:var(--amber);color:#9A6B0C;font-weight:700}
.rate button.s0{background:#FDECEC;border-color:var(--red);color:var(--red);font-weight:700}
.kmap{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:18px 20px;margin-top:8px}
.kmap h3{color:#fff;margin:0 0 12px}
.kbar{margin-bottom:12px}
.kbar .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.kbar .track{height:12px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.kbar .fill{height:100%;background:linear-gradient(90deg,#F4C150,#E9A72C);width:0;transition:.4s}
.kmap .msg{margin-top:8px;font-size:14px;background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px}
@media print{.rate button{border:1px solid #999}}
</style>
</head>

  <div class="hero"><div class="kick">บรรยายพิเศษ · 3 ชั่วโมง</div>
    <h2>ทักษะสายไอทีสู่โลกการทำงานจริง</h2>
    <p>สำหรับนักศึกษา ปวส. ปี 2 สายคอมพิวเตอร์และสารสนเทศ ที่กำลังจะก้าวสู่การทำงาน</p>
    <div class="pills"><span class="pill">Business Analysis</span><span class="pill">Hardware</span><span class="pill">Software</span><span class="pill">Upskill / Reskill</span></div>
    <p style="margin-top:14px;font-size:12.5px;color:#9DB0D6">โดย อ.ดร.วราวุฒิ นาคบุญนำ</p></div>
  <h3>เส้นเรื่องของวันนี้</h3>
  <p>งานไอทียุคนี้ <b>ไม่ใช่แค่คนเก่งเครื่อง</b> แต่คือ <b>คนที่เชื่อมเทคโนโลยีกับธุรกิจ และไม่หยุดเรียนรู้</b> วันนี้เราจะเดินไปด้วยกัน 4 เรื่อง เพื่อให้พร้อมทำงานจริงและเติบโตต่อไปได้</p>
  <div class="grid c4">
    <div class="card"><h4><span class="num">1</span>คิดแบบธุรกิจ</h4><p>Business Analysis เข้าใจว่าองค์กรต้องการอะไร</p></div>
    <div class="card"><h4><span class="num t">2</span>เข้าใจเครื่อง</h4><p>Hardware ระบบ เครือข่าย คลาวด์ และการแก้ปัญหา</p></div>
    <div class="card"><h4><span class="num a">3</span>เข้าใจซอฟต์แวร์</h4><p>Software ระบบธุรกิจ ฐานข้อมูล และ AI ช่วยเขียนโค้ด</p></div>
    <div class="card"><h4><span class="num p">4</span>พัฒนาตัวเอง</h4><p>Upskill และ Reskill เพื่ออยู่รอดและเติบโตในยุค AI</p></div>
  </div>

{ id:"hook", group:"บทนำ", nav:"AI มาแล้ว เราเหลืออะไร?", icon:"2", html:`
  <div class="eyebrow">ตั้งคำถามก่อนเริ่ม</div><h2 class="title">"AI เขียนโค้ดได้แล้ว...แล้วเราจะเหลืออะไร?"</h2>
  <p class="lead">คำถามที่หลายคนกลัว แต่คำตอบคือโอกาส ถ้าเรารู้ว่าจะยืนตรงไหน</p>
  <div class="callout info"><b>ความจริงปี 2026:</b> AI ไม่ได้มาแทนคนไอทีทั้งหมด แต่มาแทนคนที่ทำงานซ้ำ ๆ โดยไม่คิด และไปเพิ่มคุณค่าให้คนที่ใช้ AI เป็นและเข้าใจปัญหาจริง</p></div>
  <div class="grid c3">
    <div class="card"><h4>สิ่งที่ AI ทำแทนได้</h4><p>งานซ้ำ ๆ เขียนโค้ดพื้นฐาน ค้นข้อมูล ร่างเอกสาร คำนวณ</p></div>
    <div class="card"><h4>สิ่งที่ยังต้องใช้คน</h4><p>เข้าใจปัญหาจริงของธุรกิจ ตัดสินใจ สื่อสาร ตรวจจับที่ AI ผิด รับผิดชอบผลงาน</p></div>
    <div class="card"><h4>คนที่ได้เปรียบ</h4><p>คนที่ใช้ AI เป็นผู้ช่วย มีทักษะพื้นฐานแน่น และเรียนรู้ตลอดเวลา</p></div>
  </div>
  <div class="callout tip"><b>เป้าหมายวันนี้:</b> ทำให้ทุกคนเห็นว่าจะวางตัวเองตรงไหนในโลกงานไอที เพื่อไม่ถูกแทน แต่กลายเป็นคนที่องค์กรขาดไม่ได้</div>

  <div class="quiz"><div class="q">2. Firewall มีไว้เพื่ออะไร</div><button class="qopt" onclick="quizPick(this,false,'การเก็บไฟล์เป็นหน้าที่ของ Storage')">เก็บไฟล์งานขององค์กร</button><button class="qopt" onclick="quizPick(this,true,'ถูกต้อง Firewall ป้องกันการเข้าถึงเครือข่ายจากภัยภายนอก')">ป้องกันการบุกรุกเครือข่ายจากภายนอก</button><button class="qopt" onclick="quizPick(this,false,'การเร่งเว็บเป็นงานของ CDN/แคช')">เร่งความเร็วอินเทอร์เน็ต</button><div class="qfb"></div></div>
  <div class="quiz"><div class="q">3. ฐานข้อมูล (Database) ใช้ทำอะไร</div><button class="qopt" onclick="quizPick(this,true,'ใช่ ฐานข้อมูลจัดเก็บและค้นข้อมูลอย่างเป็นระบบ')">จัดเก็บและค้นข้อมูลอย่างเป็นระบบ</button><button class="qopt" onclick="quizPick(this,false,'การตัดต่อวิดีโอใช้โปรแกรมตัดต่อ')">ตัดต่อวิดีโอ</button><button class="qopt" onclick="quizPick(this,false,'การออกแบบกราฟิกใช้โปรแกรมออกแบบ')">ออกแบบกราฟิก</button><div class="qfb"></div></div>
  <div class="quiz"><div class="q">4. Generative AI คืออะไร</div><button class="qopt" onclick="quizPick(this,false,'นั่นคืออุปกรณ์เก็บข้อมูล')">ฮาร์ดแวร์สำหรับเก็บข้อมูล</button><button class="qopt" onclick="quizPick(this,true,'ถูกต้อง Generative AI สร้างเนื้อหาใหม่ เช่น ข้อความ รูปภาพ โค้ด')">AI ที่สร้างเนื้อหาใหม่ เช่น ข้อความ รูป โค้ด</button><button class="qopt" onclick="quizPick(this,false,'ระบบไฟฟ้าสำรองคือ UPS')">ระบบไฟฟ้าสำรอง</button><div class="qfb"></div></div>

  <div class="grid c2">
    <div class="card"><h4>ปัญหาที่พบบ่อย</h4><p>ช่าง/โปรแกรมเมอร์ทำตามที่สั่งเป๊ะ แต่ "ไม่ตรงที่ธุรกิจต้องการจริง" เพราะไม่เข้าใจปัญหาเบื้องหลัง ทำให้เสียเวลาและเสียงาน</p></div>
    <div class="card"><h4>ทางออก</h4><p>ฝึกฟังปัญหา ตั้งคำถามให้ลึก แล้วแปลงเป็นความต้องการที่ชัดเจนก่อนลงมือทำ นี่คือหัวใจของ BA</p></div>
  </div>
  <h3>ทักษะแกนของ BA (ฝึกได้ทุกคน)</h3>
  <ul class="clean">
    <li><b>ฟังปัญหาให้เป็น</b> จับให้ได้ว่าลูกค้าหรือผู้ใช้ติดขัดตรงไหน</li>
    <li><b>ถาม 5 Why</b> ถามว่าทำไมซ้ำ ๆ จนเจอต้นตอที่แท้จริง</li>
    <li><b>เขียน Requirement</b> บันทึกความต้องการให้ชัดเจน ไม่กำกวม</li>
    <li><b>วาด Process Flow หรือผังงาน</b> เห็นภาพขั้นตอนก่อนและหลัง</li>
    <li><b>คิดแบบใช้ข้อมูล</b> ตัดสินใจด้วยตัวเลข ไม่ใช่ความรู้สึก</li>
  </ul>
  <div class="callout ok"><b>สำหรับ ปวส.:</b> คนที่ทำงานเทคนิคได้ + เข้าใจธุรกิจ = คุยกับลูกค้ารู้เรื่อง โตเป็นหัวหน้าทีม/นักวิเคราะห์ระบบได้เร็ว เงินเดือนต่างกันมาก</div>
`},
{ id:"ba2", group:"1 · Business Analysis", nav:"ลองทำ: สร้าง User Story", icon:"4", html:`
  <div class="eyebrow">Interactive · ลงมือทำ</div><h2 class="title">เครื่องมือ BA ที่ใช้จริง คือ User Story</h2>
  <p class="lead">แปลง "ความต้องการ" เป็นประโยคที่ทีมพัฒนาเข้าใจตรงกัน ด้วยสูตรง่าย ๆ</p>
  <div class="callout info"><b>สูตร User Story:</b> "ในฐานะ <b>[ใคร]</b> ฉันต้องการ <b>[ทำอะไร]</b> เพื่อ <b>[ได้ประโยชน์อะไร]</b>"</div>
  <div class="builder">
    <label>ในฐานะ (ผู้ใช้คือใคร)</label><input id="us-role" oninput="buildStory()" placeholder="เช่น ลูกค้าร้านกาแฟ">
    <label>ฉันต้องการ (อยากทำอะไร)</label><input id="us-want" oninput="buildStory()" placeholder="เช่น สะสมแต้มผ่านแอป">
    <label>เพื่อ (ได้ประโยชน์อะไร)</label><input id="us-why" oninput="buildStory()" placeholder="เช่น แลกกาแฟฟรีและได้ส่วนลด">
    <div class="story-out" id="us-out">พิมพ์ในช่องด้านบน แล้ว User Story จะปรากฏที่นี่…</div>
  </div>
  <div class="callout tip"><b>กิจกรรมในห้อง:</b> จับคู่ถอดโจทย์ "ร้านกาแฟอยากได้ระบบสมาชิกสะสมแต้ม" แล้วเขียน User Story 2 ถึง 3 ข้อ แล้ววาด flow สั้น ๆ ว่าลูกค้าสมัคร แล้วสะสมแต้ม และแลกรางวัลอย่างไร</div>
`},
{ id:"hw", group:"2 · Hardware", nav:"เข้าใจเครื่องในโลกงานจริง", icon:"5", html:`
  <div class="eyebrow">Hardware</div><h2 class="title">Hardware ไม่ใช่แค่ประกอบคอม</h2>
  <p class="lead">คนไอทีที่ทำงานจริงต้องเห็น "ทั้งระบบ" ไม่ใช่แค่ตัวเครื่อง</p>
  <div class="grid c2">
    <div class="card"><h4>ระบบนิเวศที่ต้องเข้าใจ</h4><p>เครื่องผู้ใช้ (Client), เซิร์ฟเวอร์ (Server), เครือข่าย (Router/Switch/WiFi), ที่เก็บข้อมูล (Storage)</p></div>
    <div class="card"><h4>คลาวด์ หรือ On-premise</h4><p>ระบบอยู่บนคลาวด์ (เช่าใช้ ยืดหยุ่น) หรือติดตั้งในองค์กรเอง (ควบคุมเอง) ควรรู้ข้อดีข้อเสียเพื่อแนะนำได้</p></div>
    <div class="card"><h4>เทรนด์ IoT และ Edge</h4><p>อุปกรณ์เชื่อมต่ออินเทอร์เน็ต เซนเซอร์ในโรงงานหรือร้านค้า งานสายนี้กำลังเติบโต</p></div>
    <div class="card"><h4>ทักษะทองคำ</h4><p><b>Troubleshooting อย่างเป็นระบบ</b> แยกให้ออกว่าปัญหาอยู่ที่ฮาร์ดแวร์ ซอฟต์แวร์ หรือเครือข่าย</p></div>
  </div>
  <div class="callout ok"><b>เส้นทางอาชีพสาย Hardware:</b> IT Support, Field Service, Network Technician, ผู้ดูแลระบบ (System Admin), งานติดตั้งดูแล IoT</div>
`},

{ id:"sw", group:"3 · Software", nav:"เข้าใจซอฟต์แวร์ & การพัฒนา", icon:"7", html:`
  <div class="eyebrow">Software</div><h2 class="title">Software จากผู้ใช้สู่ผู้สร้าง</h2>

/* engine */
const nav=document.getElementById('nav'),content=document.getElementById('content');
let cur=0,lastGroup=null;
S.forEach((s,i)=>{
  if(s.group!==lastGroup){lastGroup=s.group;const g=document.createElement('div');g.className='nav-group';g.textContent=s.group;nav.appendChild(g);}
  const it=document.createElement('div');it.className='nav-item';it.dataset.i=i;it.innerHTML='<span class="dot">'+s.icon+'</span><span>'+s.nav+'</span>';it.onclick=()=>go(i);nav.appendChild(it);
  const sec=document.createElement('section');sec.className='page';sec.id='pg-'+i;sec.innerHTML=s.html;
  const bn=document.createElement('div');bn.className='navbtns';bn.innerHTML='<button class="btn" data-prev>ก่อนหน้า</button><button class="btn primary" data-next>ถัดไป</button>';
  sec.appendChild(bn);content.appendChild(sec);
});
function go(i){if(i<0||i>=S.length)return;cur=i;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('pg-'+i).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',+n.dataset.i===i));
  document.querySelector('#progress .bar').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('main').scrollTo({top:0,behavior:'auto'});
  const nn=document.querySelector('#pg-'+i+' [data-next]'),pp=document.querySelector('#pg-'+i+' [data-prev]');
  pp.disabled=(i===0);nn.disabled=(i===S.length-1);nn.textContent=(i===S.length-1)?'จบบทเรียน':'ถัดไป';
  closeMenu();}
content.addEventListener('click',e=>{
  if(e.target.closest('[data-next]'))go(cur+1);
  if(e.target.closest('[data-prev]'))go(cur-1);
  const ex=e.target.closest('.exp');if(ex)exShow(ex);
});
function exShow(ex){const st=ex.closest('.expset').dataset.set,k=ex.dataset.k;const d=EXPL[st]&&EXPL[st][k];if(!d)return;
  ex.closest('.expset').querySelectorAll('.exp').forEach(x=>x.classList.toggle('on',x===ex));
  const el=document.getElementById('det-'+st);if(!el)return;
  el.innerHTML='<h4>'+d.n+'</h4><p style="margin:0">'+d.d+'</p>'+(d.ex?'<div class="ex"><b>ความต้องการในตลาด:</b> '+d.ex+'</div>':'');}
/* user story builder */
function buildStory(){const r=val('us-role'),w=val('us-want'),y=val('us-why');const o=document.getElementById('us-out');
  if(!r&&!w&&!y){o.innerHTML='พิมพ์ในช่องด้านบน แล้ว User Story จะปรากฏที่นี่…';return;}
  o.innerHTML='ในฐานะ <b>'+(r||'____')+'</b> ฉันต้องการ <b>'+(w||'____')+'</b> เพื่อ <b>'+(y||'____')+'</b>';}
function val(id){return (document.getElementById(id).value||'').trim();}
/* troubleshooting classifier */
function tshoot(btn,type){document.querySelectorAll('.tset .tbtn').forEach(b=>b.style.borderColor='');btn.style.borderColor='var(--blue)';
  const map={hw:['hw','ฮาร์ดแวร์ (Hardware)','เริ่มตรวจที่ตัวเครื่อง: สายไฟ/อะแดปเตอร์ · แรม/ฮาร์ดดิสก์ · ระบบระบายความร้อน (ฝุ่น/พัดลม) · ลองถอด-ประกอบอุปกรณ์ทีละชิ้น'],
    sw:['sw','ซอฟต์แวร์ (Software)','เริ่มตรวจที่โปรแกรม/ระบบปฏิบัติการ: ปิด-เปิดโปรแกรม · อัปเดต/ถอนติดตั้ง · ตรวจไฟล์เสีย · ย้อนเวอร์ชันหลังอัปเดตที่มีปัญหา'],
    net:['net','เครือข่าย (Network)','เริ่มตรวจที่การเชื่อมต่อ: สาย LAN/สัญญาณ WiFi · รีสตาร์ต Router · ทดสอบ ping · ดูว่าปัญหาเกิดทุกเครื่องหรือเครื่องเดียว']};
  const [cls,name,tip]=map[type];const el=document.getElementById('tres');
  el.style.borderLeftColor=cls==='hw'?'var(--blue)':cls==='sw'?'var(--green)':'var(--amber)';
  el.innerHTML='<span class="tag '+cls+'">'+name+'</span><b>ควรเริ่มตรวจที่ชั้นนี้</b><br>'+tip;}
/* ai checklist */
function chkCount(){const boxes=document.querySelectorAll('#aicheck input');const n=[...boxes].filter(b=>b.checked).length;
  const m=document.getElementById('chkmsg');
  if(n===boxes.length){m.className='callout ok';m.innerHTML='<b>เยี่ยมมาก ตรวจครบทุกข้อ</b> พร้อมนำโค้ดจาก AI ไปใช้อย่างมืออาชีพแล้ว';}
  else{m.className='callout tip';m.innerHTML='<b>ติ๊กแล้ว '+n+'/'+boxes.length+' ข้อ</b> ยิ่งตรวจครบ ยิ่งลดความเสี่ยงและดูเป็นมืออาชีพ';}}
/* quiz */
function quizPick(btn,ok,explain){const q=btn.closest('.quiz');if(q.dataset.done)return;q.dataset.done='1';
  q.querySelectorAll('.qopt').forEach(o=>o.style.pointerEvents='none');
  btn.classList.add(ok?'ok':'no');
  if(!ok){q.querySelectorAll('.qopt').forEach(o=>{if(o.getAttribute('onclick').includes('true'))o.classList.add('ok');});}
  const fb=q.querySelector('.qfb');fb.className='qfb show';fb.style.color=ok?'var(--green)':'var(--red)';fb.innerHTML=(ok?'ถูกต้อง: ':'ยังไม่ใช่: ')+explain;}
function rate(btn,val){const row=btn.closest('.selfrow');row.dataset.w=val;row.querySelectorAll('.rate button').forEach(b=>b.className='');btn.classList.add('s'+val);updateKmap();}
function updateKmap(){const doms={hw:'ฮาร์ดแวร์',sw:'ซอฟต์แวร์',ai:'AI'};let weak=null,weakv=101,allDone=true,totalAns=0,totalRows=0;let h='<h3>แผนที่ความรู้ของฉัน</h3>';
  for(const d in doms){const rs=document.querySelectorAll('.selfblock[data-dom="'+d+'"] .selfrow');let sum=0,ans=0;const max=rs.length*2;
    rs.forEach(r=>{if(r.dataset.w!==''&&r.dataset.w!==undefined){sum+=+r.dataset.w;ans++;}});
    totalAns+=ans;totalRows+=rs.length;if(ans<rs.length)allDone=false;
    const pct=max?Math.round(sum/max*100):0;
    h+='<div class="kbar"><div class="lab"><span>'+doms[d]+'</span><span>'+pct+'%</span></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>';
    if(pct<weakv){weakv=pct;weak=doms[d];}}
  let msg;
  if(allDone) msg='ด้านที่ควรโฟกัสมากที่สุดวันนี้ คือ <b>'+weak+'</b> ลองตั้งใจช่วงนั้นเป็นพิเศษ';
  else msg='ตอบแล้ว '+totalAns+'/'+totalRows+' ข้อ ตอบให้ครบทุกด้านเพื่อดูว่าควรโฟกัสตรงไหน';
  h+='<div class="msg">'+msg+'</div>';
  const el=document.getElementById('kmap');if(el)el.innerHTML=h;}
/* toolbar / nav mechanics */
const sb=document.getElementById('sidebar'),bd=document.getElementById('backdrop');
document.getElementById('menuToggle').onclick=()=>{sb.classList.add('open');bd.classList.add('show');};
bd.onclick=closeMenu;function closeMenu(){sb.classList.remove('open');bd.classList.remove('show');}
let zoom=1;const zc=document.getElementById('content');function applyZoom(){zc.style.zoom=zoom;}
document.getElementById('fsz-up').onclick=()=>{zoom=Math.min(2,+(zoom+0.1).toFixed(2));applyZoom();};
document.getElementById('fsz-down').onclick=()=>{zoom=Math.max(0.7,+(zoom-0.1).toFixed(2));applyZoom();};
document.getElementById('fs-btn').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}};
const projBtn=document.getElementById('proj-btn');
projBtn.onclick=()=>{const on=document.body.classList.toggle('projector');projBtn.classList.toggle('on',on);if(on){if(zoom<1.2){zoom=1.2;applyZoom();}}else{zoom=1;applyZoom();closeMenu();}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
go(0);
</script>
