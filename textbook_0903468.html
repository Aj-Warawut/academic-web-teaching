{ id:"ch5", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 5 · Overview</div><h2 class="title">องค์กร วัฒนธรรม และการบริหารทีมโครงการ</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2.5 ชั่วโมง</b> · 12 หน้าจอสอน</div>
  <p class="lead">โครงการดำเนินอยู่ในบริบทขององค์กรที่มีโครงสร้างและวัฒนธรรมเฉพาะ และความสำเร็จขึ้นกับการทำงานเป็นทีมอย่างมาก</p>
  <div class="callout info"><b>แกนของบท:</b> เข้าใจว่าโครงสร้าง+วัฒนธรรมองค์กรมีผลต่ออำนาจของผู้จัดการโครงการอย่างไร และจะสร้าง/นำทีมให้ผ่านความขัดแย้งไปสู่ทีมที่ทำงานได้จริงอย่างไร</div>
  <h3>วัตถุประสงค์การเรียนรู้ประจำบท</h3>
  <ul class="clean">
    <li>อธิบายอิทธิพลของโครงสร้างองค์กร (รวม Matrix ย่อย) ต่ออำนาจของผู้จัดการโครงการได้</li>
    <li>อธิบายผลของวัฒนธรรมและระเบียบองค์กรต่อการดำเนินโครงการได้</li>
    <li>อธิบายพัฒนาการของทีม (Tuckman) และเลือกภาวะผู้นำตามสถานการณ์ได้</li>
    <li>ประยุกต์ทฤษฎีแรงจูงใจ (Maslow, Herzberg, X/Y) ในการบริหารทีมได้</li>
    <li>เลือกแนวทางจัดการความขัดแย้ง (Thomas–Kilmann) ให้เหมาะกับสถานการณ์ได้</li>
  </ul>
  <div class="callout info"><b>เครื่องมือในบทนี้ (กดเล่นได้):</b> แถบวัดอำนาจ PM · Tuckman 5 ขั้น · ภาวะผู้นำตามสถานการณ์ · ตาราง RACI · พีระมิด Maslow · กริดจัดการความขัดแย้ง Thomas–Kilmann</div>
  <div class="chapopen" data-open="5"></div>
`},
{ id:"c5-org", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"5.1 โครงสร้างองค์กร", icon:"2", html:`
  <div class="eyebrow">5.2 · Organization Structure</div><h2 class="title">โครงสร้างองค์กรและอำนาจของผู้จัดการโครงการ</h2>
  <p class="lead">โครงสร้างองค์กรกำหนดว่าผู้จัดการโครงการมี "อำนาจ" และ "เข้าถึงทรัพยากร" ได้แค่ไหน — กดที่แถบเพื่อดูรายละเอียดแต่ละแบบ</p>
  <div class="authscale" id="authScale"></div>
  <div class="wfdetail" id="authDetail"></div>
  <h3 style="margin-top:22px">Matrix มี 3 ระดับย่อย</h3>
  <div class="grid c3">
    <div class="card"><h4>Weak Matrix</h4><p>ใกล้ Functional — PM เป็นเหมือน "ผู้ประสานงาน" อำนาจน้อย</p></div>
    <div class="card"><h4>Balanced Matrix</h4><p>PM กับผู้จัดการสายงานแบ่งอำนาจกัน ต้องเจรจาต่อรอง</p></div>
    <div class="card"><h4>Strong Matrix</h4><p>ใกล้ Projectized — PM มีอำนาจมาก คุมทรัพยากรได้มากขึ้น</p></div>
  </div>
  <div class="callout tip"><b>ข้อควรระวังใน Matrix:</b> สมาชิกมี "เจ้านาย 2 คน" (PM + หัวหน้าสายงาน) ต้องสื่อสารและจัดลำดับความสำคัญให้ชัด ไม่งั้นเกิดความสับสนและแย่งทรัพยากร</div>
  <div class="callout dig"><span class="tag">ชวนคิด</span>โครงงานนิสิตในชั้นเรียนคล้ายโครงสร้างแบบไหนมากที่สุด? (คำใบ้: หัวหน้ากลุ่มคุมทีมเต็มตัว = Strong/Projectized · สมาชิกยังแบ่งเวลากับวิชาอื่น = Weak Matrix)</div>
`},
{ id:"c5-culture", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"5.2 วัฒนธรรมองค์กร", icon:"3", html:`
  <div class="eyebrow">5.3 · Culture</div><h2 class="title">วัฒนธรรมและระเบียบองค์กร</h2>
  <div class="callout info"><b>วัฒนธรรม ค่านิยม และระเบียบ</b> มีผลต่อวิธีทำงาน การตัดสินใจ และการสื่อสารภายในโครงการ</div>
  <div class="grid c2">
    <div class="card"><h4 style="color:var(--green)">เปิดกว้างต่อการทดลอง</h4><p>เอื้อต่อโครงการนวัตกรรม กล้าลองสิ่งใหม่ ยอมรับความผิดพลาดเพื่อเรียนรู้</p></div>
    <div class="card"><h4 style="color:var(--red)">เน้นกฎระเบียบเข้มงวด</h4><p>ควบคุมได้ดีแต่ปรับตัวช้า อาจเป็นอุปสรรคต่อนวัตกรรม</p></div>
  </div>
  <div class="callout tip"><b>บทบาทของ PM:</b> เข้าใจและปรับแนวทางการทำงานให้สอดคล้องกับวัฒนธรรมองค์กร เพื่อให้โครงการได้รับการสนับสนุน</div>
`},
{ id:"c5-tuckman", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"5.3 พัฒนาการทีม (Tuckman)", icon:"4", html:`
  <div class="eyebrow">5.4 · Team Development</div><h2 class="title">ขั้นพัฒนาการของทีม (Tuckman)</h2>
  <p class="lead">ทีมมักพัฒนาผ่าน 5 ขั้น (Tuckman เพิ่ม Adjourning ภายหลัง) — กดแต่ละขั้นเพื่อดูลักษณะและสิ่งที่ผู้นำควรทำ</p>
  <div class="wfmap" id="tmMap">
    <button class="wfnode" data-t="0"><span class="wfcirc">1</span><span class="wflbl">Forming</span></button><span class="wfarrow">→</span>
    <button class="wfnode" data-t="1"><span class="wfcirc">2</span><span class="wflbl">Storming</span></button><span class="wfarrow">→</span>
    <button class="wfnode" data-t="2"><span class="wfcirc">3</span><span class="wflbl">Norming</span></button><span class="wfarrow">→</span>
    <button class="wfnode" data-t="3"><span class="wfcirc">4</span><span class="wflbl">Performing</span></button><span class="wfarrow">→</span>
    <button class="wfnode" data-t="4"><span class="wfcirc">5</span><span class="wflbl">Adjourning</span></button>
  </div>
  <div class="wfdetail" id="tmDetail"></div>
  <div class="callout warn" style="margin-top:16px"><b>จุดวัดฝีมือผู้นำ = ขั้น Storming:</b> ความเห็นต่าง/ความขัดแย้งเป็นเรื่องปกติ ผู้นำที่ดีช่วยทีมข้ามขั้นนี้ไปสู่ Norming ได้เร็ว</div>
  <div class="callout tip"><b>ไม่ได้เป็นเส้นตรงเสมอ:</b> เมื่อมีสมาชิกใหม่หรือเป้าหมายเปลี่ยน ทีมอาจถอยกลับไป Storming ได้ — เป็นเรื่องปกติ ไม่ใช่ความล้มเหลว</div>
  <div class="callout info"><b>รากฐานทฤษฎีเพิ่มเติม:</b> แบบจำลองนี้เสนอโดย B. W. Tuckman (1965) และเพิ่มขั้น Adjourning ใน Tuckman &amp; Jensen (1977) · ด้านวัฒนธรรมองค์กร E. Schein อธิบายว่าวัฒนธรรมมี 3 ระดับ ได้แก่ สิ่งที่สังเกตได้ (Artifacts) · ค่านิยมที่ยึดถือ (Espoused Values) · และสมมติฐานพื้นฐานที่ฝังลึก (Basic Assumptions) · ส่วนบทบาทในทีม R. M. Belbin จำแนกบทบาททีม 9 แบบ (เช่น ผู้ประสาน ผู้ลงมือ ผู้คิดสร้างสรรค์) ที่ต่างจาก "ตำแหน่งงาน"</div>
`},
{ id:"c5-situational", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"5.3.1 ภาวะผู้นำตามสถานการณ์", icon:"5", html:`
  <div class="eyebrow">5.4.1 · Situational Leadership</div><h2 class="title">ภาวะผู้นำตามสถานการณ์ (จับคู่กับพัฒนาการทีม)</h2>
  <p class="lead">ผู้นำที่ดีไม่ได้ใช้สไตล์เดียวตลอด แต่ปรับตามความพร้อมของทีม — สไตล์ผู้นำจึงควรเปลี่ยนไปตามขั้น Tuckman</p>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">ขั้นทีม</th><th style="background:var(--blue)">สไตล์ผู้นำ</th><th style="background:var(--teal)">ทำอย่างไร</th></tr></thead>
    <tbody>
      <tr><td>Forming</td><td>S1 · สั่งการ (Directing)</td><td>บอกชัดว่าใครทำอะไร ตั้งเป้าหมาย/กติกา</td></tr>
      <tr><td>Storming</td><td>S2 · ชี้แนะ (Coaching)</td><td>อธิบายเหตุผล ไกล่เกลี่ย ฟังความเห็นต่าง</td></tr>
      <tr><td>Norming</td><td>S3 · สนับสนุน (Supporting)</td><td>ให้ทีมร่วมตัดสินใจ เสริมกำลังใจ</td></tr>
      <tr><td>Performing</td><td>S4 · มอบหมาย (Delegating)</td><td>ให้อิสระ มอบอำนาจ ติดตามแบบเบา ๆ</td></tr>
    </tbody>
  </table></div>
  <div class="grid c2">
    <div class="card"><h4>ทีมยังใหม่ → นำมาก</h4><p>ช่วงแรกทีมต้องการทิศทางชัด ผู้นำจึง "สั่งการ/ชี้แนะ" มากกว่า</p></div>
    <div class="card"><h4>ทีมโตแล้ว → ปล่อยมาก</h4><p>เมื่อทีมเก่งและไว้ใจกัน ผู้นำถอยมา "สนับสนุน/มอบหมาย" ให้ทีมโตต่อ</p></div>
  </div>
  <div class="callout act"><span class="tag">อภิปราย</span><b>(7 นาที)</b> กลุ่มของท่านอยู่ขั้นไหน? หัวหน้ากลุ่มควรใช้สไตล์ผู้นำแบบใดตอนนี้ และมีอะไรที่ทำมาก/น้อยเกินไปหรือไม่</div>
`},
{ id:"c5-raci", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"5.4 บทบาททีม (RACI)", icon:"6", html:`
  <div class="eyebrow">5.4 · RACI</div><h2 class="title">กำหนดบทบาทหน้าที่ด้วย RACI</h2>
  <p class="lead">RACI ช่วยให้ทุกคนรู้ว่า "ใครทำ ใครรับผิดชอบ ใครให้คำปรึกษา ใครแค่รับรู้" ในแต่ละงาน — กดที่ช่องเพื่อสลับค่า</p>
  <div class="vizwrap"><table class="raci" id="raciTab"></table></div>
  <div class="raci-legend">
    <span><i style="background:var(--blue)">R</i> Responsible — ผู้ลงมือทำ</span>
    <span><i style="background:var(--red)">A</i> Accountable — ผู้รับผิดชอบสุดท้าย</span>
    <span><i style="background:var(--teal)">C</i> Consulted — ผู้ให้คำปรึกษา</span>
    <span><i style="background:var(--amber)">I</i> Informed — ผู้รับทราบ</span>
  </div>
  <div class="callout tip" style="margin-top:14px"><b>กฎง่าย ๆ:</b> แต่ละงานควรมี <b>A เพียงคนเดียว</b> (ไม่งั้นจะเกี่ยงกัน) และมี R อย่างน้อยหนึ่งคน</div>
  <div class="callout act"><span class="tag">ลงมือ</span><b>(8 นาที)</b> ให้กลุ่มปรับ RACI ข้างบนให้ตรงกับงานจริงของโครงงานตัวเอง แล้วตรวจว่าทุกงานมี A คนเดียวครบไหม</div>
`},
{ id:"c5-motiv", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"5.5 แรงจูงใจ (Maslow)", icon:"7", html:`
  <div class="eyebrow">5.5 · Motivation</div><h2 class="title">การสร้างแรงจูงใจในทีม</h2>
  <p class="lead">เข้าใจว่าสมาชิก "ต้องการอะไร" จึงจะจูงใจได้ถูกจุด — กดที่ชั้นพีระมิด Maslow เพื่อดูว่าจูงใจอย่างไรในแต่ละระดับ</p>
  <div class="maslow" id="maslow"></div>
  <div class="wfdetail" id="maslowDetail"></div>
  <h3 style="margin-top:22px">ทฤษฎีแรงจูงใจอื่นที่ใช้บ่อย</h3>
  <div class="grid c2">
    <div class="card"><h4>Herzberg — สองปัจจัย</h4><p><b>ปัจจัยค้ำจุน</b> (เงินเดือน สภาพแวดล้อม) ป้องกันความไม่พอใจ · <b>ปัจจัยจูงใจ</b> (ความสำเร็จ การยอมรับ ความก้าวหน้า) สร้างความพอใจจริง</p></div>
    <div class="card"><h4>McGregor — Theory X / Y</h4><p><b>X:</b> คนขี้เกียจ ต้องคุมเข้ม · <b>Y:</b> คนอยากทำงานดี ให้อิสระแล้วโต — ผู้นำที่มองแบบ Y มักได้ทีมที่สร้างสรรค์กว่า</p></div>
  </div>
  <div class="callout ok"><b>รักษาขวัญกำลังใจทีม (ใช้ได้จริง):</b> สื่อสารชัดเจน · มอบหมายงานตรงความถนัด · ให้การยอมรับต่อหน้าทีม · เปิดโอกาสให้เรียนรู้สิ่งใหม่</div>
`},
{ id:"c5-conflict", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"5.6 จัดการความขัดแย้ง", icon:"8", html:`
  <div class="eyebrow">5.6 · Conflict Management</div><h2 class="title">การจัดการความขัดแย้ง (Thomas–Kilmann)</h2>
  <p class="lead">ความขัดแย้งเป็นเรื่องปกติของทีม แนวทางจัดการมี 5 แบบ วางบนแกน "ความกล้าแสดงออก (ยึดเป้าหมายตน)" × "ความร่วมมือ (ใส่ใจอีกฝ่าย)" — กดที่จุดเพื่อดูว่าใช้เมื่อไร</p>
  <div class="pimapwrap">
    <div class="pimap" id="tkMap">
      <div class="quad q-tl">แข่งขัน</div><div class="quad q-tr">ร่วมมือ</div>
      <div class="quad q-bl">หลีกเลี่ยง</div><div class="quad q-br">ปรองดอง</div>
      <div class="midv"></div><div class="midh"></div>
      <div class="axx">ความร่วมมือ (ใส่ใจอีกฝ่าย) →</div><div class="axy">ความกล้าแสดงออก (ยึดเป้าหมายตน) →</div>
    </div>
  </div>
  <div class="wfdetail" id="tkDetail"></div>
  <div class="callout tip"><b>ไม่มีแบบไหน "ดีที่สุด" เสมอ:</b> เรื่องใหญ่ที่ต้องได้ทั้งงานและใจ → ร่วมมือ · เรื่องเล็กเร่งด่วน → ประนีประนอม · เรื่องที่เราผิด/ไม่สำคัญ → ปรองดอง · เรื่องด่วนที่ต้องเด็ดขาด → แข่งขัน</div>
`},
{ id:"c5-case", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: ทีมโครงงาน 5 คน ข้ามขั้น Storming</h2>
  <div class="callout info">ทีมแบ่งบทบาท: หัวหน้าโครงการ · ฝ่ายข้อมูล/วิเคราะห์ · ฝ่ายออกแบบ · ฝ่ายการเงิน · ฝ่ายนำเสนอ</div>
  <div class="grid c2">
    <div class="card"><h4>Forming → Storming</h4><p>ช่วงแรกทีมยังไม่ลงตัว เกิดความเห็นต่างเรื่องแนวคิด</p></div>
    <div class="card"><h4>Norming → Performing</h4><p>หัวหน้าจัดประชุมหาข้อตกลง จัดทำ Team Charter จนทีมทำงานลื่นไหลและส่งงานตามกำหนด</p></div>
  </div>
  <div class="callout tip"><b>บทเรียน:</b> การจัดประชุมหาข้อตกลง + Team Charter คือเครื่องมือพาทีมข้าม Storming ไปสู่ Performing</div>
  <div class="callout act"><span class="tag">อภิปราย</span><b>(7 นาที)</b> กลุ่มของท่านตอนนี้อยู่ขั้นไหนของ Tuckman? มีความขัดแย้งอะไรที่ยังค้าง และจะใช้แนวทางไหนคลี่คลาย</div>
`},
{ id:"c5-sum", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 5</h2>
  <ul class="clean">
    <li><b>โครงสร้างองค์กร</b> (Functional → Matrix ย่อย → Projectized) กำหนดอำนาจของ PM</li>
    <li><b>วัฒนธรรมองค์กร</b> ที่เปิดกว้างเอื้อต่อโครงการนวัตกรรม</li>
    <li><b>Tuckman 5 ขั้น</b> + <b>ภาวะผู้นำตามสถานการณ์</b> (สั่งการ→ชี้แนะ→สนับสนุน→มอบหมาย)</li>
    <li><b>แรงจูงใจ</b> (Maslow/Herzberg/X-Y) · <b>RACI</b> · จัดการความขัดแย้ง <b>Thomas–Kilmann 5 แบบ</b></li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>โครงสร้างองค์กรแต่ละแบบมีผลต่ออำนาจของผู้จัดการโครงการอย่างไร</li>
    <li>วัฒนธรรมองค์กรมีผลต่อโครงการนวัตกรรมอย่างไร</li>
    <li>อธิบายขั้นพัฒนาการของทีมตามแนวคิด Tuckman พร้อมยกตัวอย่าง</li>
    <li>ทฤษฎีแรงจูงใจใดบ้างที่นำมาใช้บริหารทีมได้ และอย่างไร</li>
    <li>ยกตัวอย่างแนวทางการจัดการความขัดแย้งในทีม 3 แบบ</li>
    <li>กำหนดบทบาทหน้าที่และข้อตกลงการทำงานของทีมโครงงานท่าน</li>
    <li>หากทีมเกิดความขัดแย้งในขั้น Storming ท่านจะจัดการอย่างไร</li>
    <li>Team Charter มีประโยชน์ต่อทีมโครงงานอย่างไร</li>
  </ol>
`},
{ id:"c5-gloss", part:"", group:"บทที่ 5 · องค์กร วัฒนธรรม และทีมโครงการ", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 5</h2>
  <div class="gdef">
    <div class="gitem"><b>Matrix Organization</b><span>โครงสร้างองค์กรแบบผสมระหว่างหน้าที่และโครงการ</span></div>
    <div class="gitem"><b>วัฒนธรรมองค์กร</b><span>ค่านิยมและแนวปฏิบัติร่วมที่มีผลต่อการทำงาน</span></div>
    <div class="gitem"><b>Tuckman Model</b><span>พัฒนาการของทีม 5 ขั้น: Forming, Storming, Norming, Performing, Adjourning</span></div>
    <div class="gitem"><b>Situational Leadership</b><span>ปรับสไตล์ผู้นำตามความพร้อมของทีม: สั่งการ ชี้แนะ สนับสนุน มอบหมาย</span></div>
    <div class="gitem"><b>Maslow / Herzberg / Theory X-Y</b><span>ทฤษฎีแรงจูงใจที่ใช้เข้าใจและกระตุ้นสมาชิกทีม</span></div>
    <div class="gitem"><b>RACI</b><span>เครื่องมือกำหนดบทบาท: Responsible, Accountable, Consulted, Informed</span></div>
    <div class="gitem"><b>Team Charter</b><span>ข้อตกลงการทำงานและบทบาทหน้าที่ของทีม</span></div>
    <div class="gitem"><b>Thomas–Kilmann</b><span>5 แนวทางจัดการความขัดแย้ง: แข่งขัน ร่วมมือ ประนีประนอม หลีกเลี่ยง ปรองดอง</span></div>
  </div>
  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management.</i> · PMI. <i>PMBOK Guide.</i></div>
`},
/* ===== บทที่ 6 ===== */
{ id:"ch6", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 6 · Overview</div><h2 class="title">การจัดทำใบอนุมัติโครงการ (Project Charter)</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2–2.5 ชั่วโมง</b> · 9 หน้าจอสอน</div>
  <p class="lead">เอกสารที่ "เปิดตัวโครงการอย่างเป็นทางการ" และกำหนดกรอบร่วมของทุกฝ่าย เป็นรากฐานของการวางแผน</p>
  <div class="callout info"><b>ทำไมสำคัญ:</b> Charter ที่ดีลดความเข้าใจคลาดเคลื่อนตั้งแต่เริ่มต้น และมอบอำนาจให้ผู้จัดการโครงการใช้ทรัพยากรได้อย่างเป็นทางการ</div>
  <h3>วัตถุประสงค์การเรียนรู้ประจำบท</h3>
  <ul class="clean">
    <li>อธิบายความหมายและความสำคัญของ Project Charter ได้</li>
    <li>ระบุองค์ประกอบของ Project Charter ได้ครบถ้วน</li>
    <li>กำหนดวัตถุประสงค์ตามหลัก SMART และเกณฑ์ความสำเร็จได้</li>
    <li>อธิบายแนวทางการเขียนและการอนุมัติ Charter ที่ดีได้</li>
    <li>จัดทำ Project Charter ของโครงงานกลุ่มได้</li>
  </ul>
  <div class="chapopen" data-open="6"></div>
`},
{ id:"c6-what", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"6.1 Charter คืออะไร", icon:"2", html:`
  <div class="eyebrow">6.2 · What is a Charter</div><h2 class="title">ความหมายและความสำคัญของ Project Charter</h2>
  <div class="callout info"><b>นิยาม:</b> เอกสารที่ออกโดย <b>ผู้สนับสนุนโครงการ (Sponsor)</b> เพื่ออนุมัติให้โครงการเริ่มอย่างเป็นทางการ และมอบอำนาจให้ผู้จัดการโครงการใช้ทรัพยากร</div>
  <div class="grid c2">
    <div class="card"><h4>จุดอ้างอิงร่วม</h4><p>ทำให้ทุกฝ่ายเข้าใจตรงกันเรื่องวัตถุประสงค์ ขอบเขต และความคาดหวัง</p></div>
    <div class="card"><h4>มอบอำนาจ</h4><p>ให้ผู้จัดการโครงการมีอำนาจและทรัพยากรรองรับการทำงาน</p></div>
  </div>
  <div class="callout dig"><span class="tag">เชื่อมโยง</span>บท 2 บอกว่า Charter คือผลงานส่งมอบของเฟส "ริเริ่ม" — บทนี้ลงลึกว่าจะเขียนอย่างไรให้ดี</div>
`},
{ id:"c6-parts", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"6.2 องค์ประกอบ Charter", icon:"3", html:`
  <div class="eyebrow">6.3 · Components</div><h2 class="title">องค์ประกอบของ Project Charter</h2>
  <p class="lead">เขียนกระชับแต่ครบถ้วน ให้ผู้อ่านเข้าใจภาพรวมโครงการในเอกสารสั้น ๆ</p>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">องค์ประกอบ</th><th style="background:var(--blue)">คำอธิบายโดยย่อ</th></tr></thead>
    <tbody>
      <tr><td>ที่มา/เหตุผล</td><td>เหตุใดจึงต้องทำโครงการนี้</td></tr>
      <tr><td>วัตถุประสงค์</td><td>สิ่งที่โครงการต้องการบรรลุ (SMART)</td></tr>
      <tr><td>ขอบเขต</td><td>สิ่งที่อยู่ในและนอกขอบเขต</td></tr>
      <tr><td>ผลงานส่งมอบ</td><td>สิ่งที่จะส่งมอบเมื่อจบโครงการ</td></tr>
      <tr><td>งบประมาณ/เวลา</td><td>กรอบงบประมาณและกำหนดการ</td></tr>
      <tr><td>เกณฑ์ความสำเร็จ</td><td>ตัวชี้วัดว่าโครงการสำเร็จ</td></tr>
    </tbody>
  </table></div>
  <div class="callout tip"><b>เพิ่มเติม:</b> ยังควรมี ผู้มีส่วนเกี่ยวข้อง · สมมติฐานและข้อจำกัด · ความเสี่ยงเบื้องต้น</div>
`},
{ id:"c6-smart", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"6.3 SMART & เกณฑ์สำเร็จ", icon:"4", html:`
  <div class="eyebrow">6.4–6.5 · SMART</div><h2 class="title">วัตถุประสงค์ตามหลัก SMART & เกณฑ์ความสำเร็จ</h2>
  <div class="grid c5">
    <div class="card mini"><div class="c" style="background:var(--blue)">S</div><b>Specific</b><span>เฉพาะเจาะจง</span></div>
    <div class="card mini"><div class="c" style="background:var(--teal)">M</div><b>Measurable</b><span>วัดได้</span></div>
    <div class="card mini"><div class="c" style="background:var(--amber)">A</div><b>Achievable</b><span>ทำได้จริง</span></div>
    <div class="card mini"><div class="c" style="background:#3B7DD8">R</div><b>Relevant</b><span>สอดคล้อง</span></div>
    <div class="card mini"><div class="c" style="background:var(--red)">T</div><b>Time-bound</b><span>มีกรอบเวลา</span></div>
  </div>
  <div class="callout info"><b>รากฐานทฤษฎี:</b> หลัก SMART เสนอครั้งแรกโดย George T. Doran (1981) เพื่อการตั้งวัตถุประสงค์การบริหารที่ชัดเจนและวัดผลได้ · ในองค์กรสมัยใหม่มักใช้ควบคู่กับกรอบ OKR (Objectives and Key Results) ที่เน้น "เป้าหมายเชิงแรงบันดาลใจ + ผลลัพธ์หลักที่วัดได้"</div>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">แบบอ่อน (หลวม)</th><th style="background:var(--teal)">แบบ SMART (ดี)</th></tr></thead>
    <tbody>
      <tr><td>"ทำแอปให้ดี ๆ"</td><td>"พัฒนาแอปต้นแบบที่ลดเวลารอคอยลง 30% ภายใน 1 ภาคการศึกษา"</td></tr>
      <tr><td>"ให้ลูกค้าพอใจ"</td><td>"ผู้ทดลองใช้พึงพอใจ ≥ 80% จากผู้ทดสอบอย่างน้อย 10 คน"</td></tr>
    </tbody>
  </table></div>
  <h3>ลองเช็ก — วัตถุประสงค์ของคุณ SMART ครบไหม</h3>
  <div class="lab">
    <div class="labh">🎯 SMART Self-Check <span class="badge">กดเลือกข้อที่วัตถุประสงค์ของคุณมี</span></div>
    <div class="hint">อ่านวัตถุประสงค์ของกลุ่มแล้วกดเลือกทีละข้อว่า "มี" องค์ประกอบนั้นไหม — ยิ่งครบยิ่งพร้อมใช้</div>
    <div class="wsel" id="smartSel"></div>
    <div id="smartRes" class="res"></div>
  </div>
  <h3>เกณฑ์ความสำเร็จ (Success Criteria)</h3>
  <div class="grid c2">
    <div class="card"><h4>สอดคล้องวัตถุประสงค์</h4><p>ส่งมอบตรงเวลา · อยู่ในงบประมาณ · ได้คุณภาพตามกำหนด</p></div>
    <div class="card"><h4>วัดได้ตั้งแต่ต้น</h4><p>เช่น ผู้ใช้พึงพอใจ ≥ 80% — ทุกฝ่ายมีมาตรฐานเดียวกันในการตัดสินความสำเร็จ</p></div>
  </div>
  <div class="callout tip"><b>ต่างกันตรงไหน — วัตถุประสงค์ vs เกณฑ์ความสำเร็จ:</b> วัตถุประสงค์คือ "สิ่งที่จะทำ" · เกณฑ์ความสำเร็จคือ "เส้นวัดว่าทำสำเร็จหรือยัง"</div>
`},
{ id:"c6-builder", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"6.4 สร้าง Charter (ลองกรอก)", icon:"5", html:`
  <div class="eyebrow">6.6 · Charter Builder</div><h2 class="title">แม่แบบ Project Charter — ลองกรอกของกลุ่มท่าน</h2>
  <p class="lead">พิมพ์ในช่องด้านล่าง แล้วดู Charter ประกอบร่างขึ้นทันทีด้านล่าง — ใช้เป็นร่างเสนออาจารย์ได้</p>
  <div class="lab">
    <div class="labh">📝 แบบฟอร์ม Project Charter <span class="badge">พิมพ์เพื่อดูตัวอย่าง</span></div>
    <div class="chform">
      <div><label>ชื่อโครงการ</label><input data-ch="name" value="แพลตฟอร์มจองคิวร้านตัดผม"></div>
      <div><label>ที่มา/เหตุผล</label><input data-ch="why" value="ลูกค้าเสียเวลารอคิวนาน ร้านจัดคิวไม่เป็นระบบ"></div>
      <div><label>วัตถุประสงค์ (SMART)</label><input data-ch="obj" value="พัฒนาแอปต้นแบบลดเวลารอคอยลง 30% ภายใน 1 ภาคการศึกษา"></div>
      <div><label>ขอบเขต</label><input data-ch="scope" value="เฉพาะร้านตัดผมในเขตเมือง (ต้นแบบ)"></div>
      <div><label>ผลงานส่งมอบ</label><input data-ch="deliver" value="ต้นแบบแอปและคู่มือการใช้งาน"></div>
      <div><label>งบประมาณ / กรอบเวลา</label><input data-ch="budget" value="งบ 5,000 บาท · 1 ภาคการศึกษา"></div>
      <div><label>เกณฑ์ความสำเร็จ</label><input data-ch="success" value="ผู้ทดลองใช้พึงพอใจไม่น้อยกว่า 80%"></div>
    </div>
    <div class="chprev" id="chPrev"></div>
  </div>
  <div class="callout tip"><b>อนุมัติก่อนเริ่ม:</b> Charter ควรได้รับความเห็นชอบจากผู้สนับสนุน (สำหรับโครงงาน = อาจารย์ผู้สอน) ก่อนลงมือพัฒนา</div>
`},
{ id:"c6-assume", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"6.5 สมมติฐาน/ข้อจำกัด & เอกสาร 3 ระดับ", icon:"6", html:`
  <div class="eyebrow">6.7 · Assumptions &amp; Documents</div><h2 class="title">สมมติฐาน ข้อจำกัด และเอกสารเริ่มโครงการ 3 ระดับ</h2>
  <div class="grid c3">
    <div class="card"><h4>สมมติฐาน (Assumptions)</h4><p>สิ่งที่ "เชื่อว่าจะเป็นจริง" โดยยังไม่ยืนยัน เช่น "ร้านค้ายินดีเข้าร่วม" — ถ้าผิดจะกลายเป็นความเสี่ยง</p></div>
    <div class="card"><h4>ข้อจำกัด (Constraints)</h4><p>ขีดจำกัดที่ต้องอยู่ภายใน เช่น งบ 5,000 บาท · เสร็จใน 1 เทอม · ใช้เครื่องมือฟรี</p></div>
    <div class="card"><h4>ความเสี่ยงเบื้องต้น</h4><p>เหตุการณ์ไม่แน่นอนที่อาจกระทบ เช่น สมาชิกถอนตัว เทคโนโลยีมีปัญหา</p></div>
  </div>
  <div class="callout warn"><b>สมมติฐานที่อันตราย:</b> โครงการหลายโครงการล้มเพราะ "สมมติฐานที่ไม่ได้ตรวจสอบ" กลายเป็นเท็จ — ควรระบุและติดตามสมมติฐานสำคัญเสมอ</div>
  <h3>อย่าสับสน — เอกสารเริ่มโครงการ 3 ระดับ</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">เอกสาร</th><th style="background:var(--blue)">ตอบคำถาม</th><th style="background:var(--teal)">ช่วงเวลา</th></tr></thead>
    <tbody>
      <tr><td>Business Case (บท 3)</td><td>"คุ้มค่าลงทุนไหม"</td><td>ก่อนตัดสินใจทำ</td></tr>
      <tr><td>Project Charter (บทนี้)</td><td>"อนุมัติเริ่ม + กรอบคืออะไร"</td><td>เริ่มโครงการอย่างเป็นทางการ</td></tr>
      <tr><td>แผนบริหารโครงการ (บท 7–9)</td><td>"จะทำอย่างไร ละเอียด"</td><td>หลังอนุมัติ Charter</td></tr>
    </tbody>
  </table></div>
  <div class="callout ok"><b>ลำดับที่ถูก:</b> Business Case → Charter → แผนบริหารโครงการ — จากหยาบไปละเอียด (สอดคล้องหลัก Progressive Elaboration ในบท 1)</div>
`},
{ id:"c6-case", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: Charter โครงงาน "แพลตฟอร์มจองคิวร้านตัดผม"</h2>
  <div class="gdef">
    <div class="gitem"><b>ที่มา</b><span>ปัญหาการรอคิว</span></div>
    <div class="gitem"><b>วัตถุประสงค์ SMART</b><span>พัฒนาแอปต้นแบบลดเวลารอคอยลงร้อยละ 30 ภายใน 1 ภาคการศึกษา</span></div>
    <div class="gitem"><b>ขอบเขต</b><span>เฉพาะร้านในเขตเมือง</span></div>
    <div class="gitem"><b>ผลงานส่งมอบ</b><span>ต้นแบบแอปและคู่มือ</span></div>
    <div class="gitem"><b>เกณฑ์ความสำเร็จ</b><span>ผู้ทดลองใช้พึงพอใจไม่น้อยกว่าร้อยละ 80</span></div>
  </div>
  <div class="callout ok"><b>ขั้นตอนสุดท้าย:</b> เสนออาจารย์เพื่อขอความเห็นชอบก่อนเริ่มพัฒนา — เหมือน Sponsor อนุมัติ Charter ในองค์กรจริง</div>
`},
{ id:"c6-sum", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 6</h2>
  <ul class="clean">
    <li><b>Project Charter</b> = เอกสารเริ่มต้นที่อนุมัติและกำหนดกรอบโครงการอย่างเป็นทางการ</li>
    <li><b>องค์ประกอบครบถ้วน</b> — ที่มา · วัตถุประสงค์ · ขอบเขต · ผลงานส่งมอบ · งบ/เวลา · เกณฑ์สำเร็จ</li>
    <li><b>วัตถุประสงค์ SMART</b> ทำให้ประเมินผลตอนท้ายเป็นรูปธรรม</li>
    <li>Charter ต่างจากแผนบริหารโครงการ — Charter กำหนดกรอบ ส่วนแผนลงรายละเอียดการปฏิบัติ</li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>องค์ประกอบของ Project Charter มีอะไรบ้าง พร้อมอธิบายความสำคัญ</li>
    <li>หลัก SMART ประกอบด้วยอะไร และใช้ตั้งวัตถุประสงค์อย่างไร</li>
    <li>เหตุใด Charter จึงควรได้รับความเห็นชอบจากผู้สนับสนุนก่อนเริ่มโครงการ</li>
    <li>เขียนวัตถุประสงค์ของโครงงานกลุ่มท่านตามหลัก SMART</li>
    <li>กำหนดเกณฑ์ความสำเร็จของโครงงานกลุ่มท่านอย่างน้อย 3 ข้อ</li>
    <li>จัดทำ Project Charter ฉบับร่างของโครงงานกลุ่มท่านให้ครบองค์ประกอบ</li>
    <li>Charter แตกต่างจากแผนบริหารโครงการอย่างไร</li>
  </ol>
`},
{ id:"c6-gloss", part:"", group:"บทที่ 6 · ใบอนุมัติโครงการ (Project Charter)", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 6</h2>
  <div class="gdef">
    <div class="gitem"><b>Project Charter</b><span>เอกสารอนุมัติและกำหนดกรอบของโครงการอย่างเป็นทางการ</span></div>
    <div class="gitem"><b>Sponsor</b><span>ผู้สนับสนุนโครงการที่มีอำนาจอนุมัติและจัดสรรทรัพยากร</span></div>
    <div class="gitem"><b>SMART</b><span>หลักตั้งวัตถุประสงค์: เฉพาะเจาะจง วัดได้ ทำได้ สอดคล้อง มีกรอบเวลา</span></div>
    <div class="gitem"><b>เกณฑ์ความสำเร็จ</b><span>ตัวชี้วัดว่าโครงการบรรลุเป้าหมายหรือไม่</span></div>
    <div class="gitem"><b>สมมติฐานและข้อจำกัด</b><span>เงื่อนไขที่คาดว่าจะเป็นจริงและขีดจำกัดของโครงการ</span></div>
  </div>
  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management.</i> · PMI. <i>PMBOK Guide.</i></div>
`},
/* ===== บทที่ 7 ===== */
{ id:"ch7", part:"ส่วนที่ 3 · วางแผนโครงการ", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 7 · Overview</div><h2 class="title">การวางแผนขอบเขตโครงการและโครงสร้างจำแนกงาน (Scope &amp; WBS)</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2–2.5 ชั่วโมง</b> · 13 หน้าจอสอน</div>
  <p class="lead">การวางแผนขอบเขตคือหัวใจของการวางแผน — กำหนดว่า "ต้องทำอะไรบ้าง" เพื่อบรรลุเป้าหมาย</p>
  <div class="callout info"><b>ทำไมสำคัญ:</b> ขอบเขตที่ชัดเจนเป็นพื้นฐานของการประมาณเวลา ต้นทุน และการมอบหมายงาน — ถ้าขอบเขตพร่ามัว ทุกอย่างที่ตามมาก็คลาดเคลื่อน</div>
  <h3>วัตถุประสงค์การเรียนรู้ประจำบท</h3>
  <ul class="clean">
    <li>กำหนดขอบเขตงานของโครงการ (Scope Statement) ได้</li>
    <li>จัดทำโครงสร้างจำแนกงาน (WBS) ตามหลักการได้</li>
    <li>จัดทำตารางเวลาและกำหนดจุดสำคัญ (Milestone) ได้</li>
    <li>อธิบายเส้นทางวิกฤต (Critical Path) เบื้องต้นได้</li>
    <li>ออกแบบกระบวนการจัดการการเปลี่ยนแปลงขอบเขตได้</li>
  </ul>
  <div class="chapopen" data-open="7"></div>
`},
{ id:"c7-scope", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.1 ขอบเขตงาน (Scope)", icon:"2", html:`
  <div class="eyebrow">7.2 · Scope Statement</div><h2 class="title">การกำหนดขอบเขตงาน</h2>
  <div class="callout info"><b>Scope Statement</b> ระบุชัดเจนว่าโครงการจะส่งมอบอะไร (In-scope) และอะไรไม่อยู่ในขอบเขต (Out-of-scope) รวมถึงเกณฑ์การยอมรับผลงาน ข้อสมมติ และข้อจำกัด</div>
  <div class="grid c2">
    <div class="card"><h4 style="color:var(--green)">In-scope</h4><p>สิ่งที่โครงการจะทำและส่งมอบ — ระบุให้ชัด</p></div>
    <div class="card"><h4 style="color:var(--red)">Out-of-scope</h4><p>สิ่งที่ "จะไม่ทำ" — สำคัญพอ ๆ กับ in-scope เพื่อกันความเข้าใจผิด</p></div>
  </div>
  <div class="callout warn"><b>ป้องกัน Scope Creep:</b> ขอบเขตที่ชัดเจนช่วยกันการขยายงานเกินกำหนดโดยไม่ควบคุม ซึ่งเป็นสาเหตุสำคัญที่ทำให้โครงการล่าช้าและเกินงบ</div>
  <div class="callout dig"><span class="tag">ชวนคิด</span>ในโครงงานของกลุ่ม อะไรคือสิ่งที่ "น่าทำแต่จะไม่ทำในเทอมนี้"? การประกาศ out-of-scope ชัด ๆ ช่วยทีมโฟกัสได้อย่างไร</div>
`},
{ id:"c7-wbs", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.2 WBS + กฎ 100%", icon:"3", html:`
  <div class="eyebrow">7.3 · Work Breakdown Structure</div><h2 class="title">โครงสร้างจำแนกงาน (WBS)</h2>
  <div class="callout info"><b>WBS</b> = การแตกผลงานและงานของโครงการเป็นองค์ประกอบย่อยตามลำดับชั้น จนถึงระดับที่มอบหมาย ประเมินเวลา/ต้นทุน และควบคุมได้ — หน่วยย่อยที่สุดเรียก <b>Work Package</b></div>
  <h3>5 ระดับชั้นของ WBS</h3>
  <div class="wbslevels">
    <div class="lvtag l0">Level 0</div><div class="lvtxt"><b>Project</b> — โครงการทั้งหมด (1 กล่องบนสุด)</div>
    <div class="lvtag l1">Level 1</div><div class="lvtxt"><b>Deliverable / Phase</b> — ผลงานหลักหรือระยะของโครงการ</div>
    <div class="lvtag l2">Level 2</div><div class="lvtxt"><b>Sub-deliverable</b> — ผลงานย่อยของแต่ละส่วน</div>
    <div class="lvtag l3">Level 3</div><div class="lvtxt"><b>Activity / Task</b> — กิจกรรม/งานที่ต้องทำ</div>
    <div class="lvtag l3" style="background:var(--red)">Level 4</div><div class="lvtxt"><b>Work Package</b> — หน่วยย่อยที่สุด มอบหมาย ประเมินเวลา/ต้นทุนได้</div>
  </div>
  <div class="grid c2">
    <div class="card"><h4>การให้รหัส (Numbering)</h4><p>ใส่รหัสตามลำดับชั้น เช่น 1 → 1.1 → 1.1.1 ช่วยอ้างอิงงาน ติดตาม และทำงบประมาณเป็นรายส่วน</p></div>
    <div class="card"><h4>2 รูปแบบการจัดกลุ่ม</h4><p><b>ตามผลงานส่งมอบ</b> (Deliverable-based) หรือ <b>ตามระยะงาน</b> (Phase-based) — เลือกให้เหมาะกับลักษณะโครงการ</p></div>
  </div>
  <div class="callout ok"><b>กฎ 100% (100% Rule):</b> งานย่อยทุกชั้นรวมกันต้องครอบคลุม <b>100%</b> ของงานในชั้นบน โดย <b>ไม่ตกหล่น (Omission)</b> และ <b>ไม่ซ้ำซ้อน (Overlap)</b></div>
  <div class="callout tip"><b>แตกลึกแค่ไหน — กฎ 8/80:</b> Work Package ที่ดีควรใช้เวลาราว <b>8–80 ชั่วโมง</b> (ไม่เล็กจนจุกจิก ไม่ใหญ่จนคุมยาก) และต้อง "ประเมินเวลา/ต้นทุน และมอบหมายผู้รับผิดชอบได้"</div>
`},
{ id:"c7-wbsx", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.2.1 ผัง WBS แบบโต้ตอบ", icon:"4", html:`
  <div class="eyebrow">7.3 · WBS Explorer</div><h2 class="title">สำรวจผัง WBS — กดดูแต่ละงาน</h2>
  <p class="lead">เลือกตัวอย่างโครงการ แล้วกดที่กล่องงานเพื่อดูรหัส ระดับชั้น และรายละเอียด (งาน Work Package จะแสดงเวลา/ผู้รับผิดชอบ) — เห็นภาพรวมทั้งโครงการในหน้าเดียว</p>
  <div class="wsel" id="wbsSel"></div>
  <div class="wtreewrap"><ul class="wtree" id="wbsTree"></ul></div>
  <div class="wdetail" id="wbsDetail"></div>
  <div class="callout info" id="wbsRule" style="margin-top:12px"></div>
  <div class="callout act"><span class="tag">ลงมือ</span><b>(12 นาที)</b> ให้แต่ละกลุ่มวาดผัง WBS ของโครงงานตัวเองแบบนี้ 3 ระดับ (โครงการ → งานหลัก → งานย่อย/Work Package) ใส่รหัส 1, 1.1, 1.1.1 แล้วตรวจกฎ 100%: งานย่อยรวมกันครบงานหลักไหม มีตกหล่น/ซ้ำซ้อนหรือเปล่า</div>
`},
{ id:"c7-sched", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.3 ภาพรวมการจัดตารางเวลา", icon:"5", html:`
  <div class="eyebrow">7.4 · Scheduling Overview</div><h2 class="title">การจัดตารางเวลาโครงการ</h2>
  <p class="lead">จากงานย่อยใน WBS นำมากำหนดลำดับ ความสัมพันธ์ และระยะเวลา เพื่อสร้างตารางเวลาที่ทำให้โครงการเสร็จตามกำหนด</p>
  <h3>3 ปัจจัยที่ต้องพิจารณา</h3>
  <div class="grid c3">
    <div class="card"><h4>1) Dependencies</h4><p>ความสัมพันธ์ของงาน — งานใดต้องทำก่อน/พร้อมกัน/หลัง</p></div>
    <div class="card"><h4>2) Resources</h4><p>ทรัพยากรที่มี — คน เครื่องมือ งบประมาณ</p></div>
    <div class="card"><h4>3) Constraints</h4><p>ข้อจำกัด — กำหนดส่ง วันหยุด เงื่อนไข</p></div>
  </div>
  <h3>เครื่องมือจัดตารางเวลา 4 แบบในบทนี้</h3>
  <div class="grid c2">
    <div class="card"><h4><span class="num">1</span>Gantt Chart</h4><p>แสดงงานเป็นแท่งตามเวลา เห็นภาพรวมกำหนดการและความคืบหน้า</p></div>
    <div class="card"><h4><span class="num t">2</span>PDM / AON</h4><p>แผนภาพเครือข่ายแสดงความสัมพันธ์ระหว่างงาน (FS/SS/FF/SF) และ Lag</p></div>
    <div class="card"><h4><span class="num a">3</span>CPM (Critical Path Method)</h4><p>คำนวณ ES/EF/LS/LF หาเส้นทางวิกฤตและเวลาสำรอง (Float)</p></div>
    <div class="card"><h4><span class="num r">4</span>PERT</h4><p>ประมาณเวลาแบบ 3 ค่า คำนวณความน่าจะเป็นที่เสร็จทันเวลา</p></div>
  </div>
  <div class="callout tip"><b>เลือกอย่างไร:</b> งานไม่ซับซ้อนใช้ Gantt · งานที่มีความสัมพันธ์หลายขั้นใช้ PDM+CPM · งานที่เวลาไม่แน่นอนสูงใช้ PERT (เทียบสรุปในหน้าสุดท้ายของบท)</div>
`},
{ id:"c7-gantt", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.3.1 Gantt Chart", icon:"6", html:`
  <div class="eyebrow">7.4.1 · Gantt Chart</div><h2 class="title">แผนภูมิแกนต์ (Gantt Chart)</h2>
  <p class="lead">แสดงงานเป็นแท่งแนวนอนตามเวลา — เห็นว่างานใดเริ่ม/จบเมื่อไร ทับซ้อนกันอย่างไร และงานใดอยู่บนเส้นทางวิกฤต (แถบแดง)</p>
  <div class="lab">
    <div class="labh">🧮 Gantt Chart + เส้นทางวิกฤต + ลูกศรความสัมพันธ์ <span class="badge">ปรับระยะเวลาได้</span></div>
    <div class="hint">แต่ละงานสัมพันธ์กันแบบ Finish-to-Start (ลูกศรเชื่อม) ปรับ "สัปดาห์" แล้วดูว่าโครงการเสร็จเมื่อไรและเส้นทางวิกฤตเปลี่ยนไหม</div>
    <div class="ctrlrow" id="gCtrl7"></div>
    <div id="gViz7" class="vizwrap"></div>
  </div>
  <div class="grid c2">
    <div class="card"><h4 style="color:var(--green)">จุดเด่น</h4><p>เข้าใจง่าย สื่อสารกับทีม/ผู้บริหารได้ดี ติดตามความคืบหน้าชัด</p></div>
    <div class="card"><h4 style="color:var(--red)">ข้อจำกัด</h4><p>งานซับซ้อนมาก ๆ ความสัมพันธ์จะดูยาก ต้องใช้ PDM/CPM ช่วย</p></div>
  </div>
  <div class="callout tip"><b>Milestone</b> = จุดสำคัญที่ใช้ติดตามความก้าวหน้า เช่น วันส่งมอบต้นแบบ หรือวันนำเสนอความก้าวหน้า</div>
`},
{ id:"c7-pdm", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.3.2 PDM/AON + Lag", icon:"7", html:`
  <div class="eyebrow">7.4.2 · Precedence Diagram (AON)</div><h2 class="title">PDM / AON และระยะหน่วง (Lag)</h2>
  <p class="lead">PDM (Precedence Diagramming Method) แสดงงานเป็น "โหนด" (Activity-on-Node) และเชื่อมด้วยความสัมพันธ์ 4 แบบ — กดแท็บเพื่อดูแต่ละแบบ และเลื่อน Lag</p>
  <div class="tabs" id="pdmTabs">
    <button class="tab on" data-pt="FS">FS</button>
    <button class="tab" data-pt="SS">SS</button>
    <button class="tab" data-pt="FF">FF</button>
    <button class="tab" data-pt="SF">SF</button>
  </div>
  <div class="lab">
    <div class="labh">🧮 ตัวอย่างความสัมพันธ์ + Lag <span class="badge">เลื่อนปรับ Lag</span></div>
    <div class="grow"><span class="gl">งาน A (4 หน่วย)</span><div class="tim"><div class="timbar" id="barA" style="background:var(--blue)">A</div></div></div>
    <div class="grow"><span class="gl">งาน B (3 หน่วย)</span><div class="tim"><div class="timbar" id="barB" style="background:var(--teal)">B</div></div></div>
    <div class="ctrlrow" style="margin-top:10px"><span class="ci"><b>Lag (ระยะหน่วง)</b> <input type="range" id="lagRange" min="-3" max="5" value="0"> <b id="lagVal" style="color:var(--blue)">0</b> หน่วย</span></div>
    <div id="pdmDesc" class="callout info" style="margin:6px 0 0"></div>
  </div>
  <div class="callout warn"><b>Lag คืออะไร:</b> ระยะเวลา "หน่วง/รอ" ระหว่างงาน เช่น ทาสีเสร็จต้องรอสีแห้ง 2 วันก่อนเริ่มงานถัดไป (FS + Lag 2) · ค่า Lag ติดลบ = <b>Lead</b> (เร่งให้เริ่มก่อน)</div>
  <div class="callout tip"><b>ทำไมต้องสนใจ Lag:</b> ถ้าลืมคิด Lag ตารางเวลาจะสั้นเกินจริง งานชนกัน และประเมินวันเสร็จผิดพลาด</div>
`},
{ id:"c7-cpm", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.3.3 CPM: เส้นทางวิกฤต + Float", icon:"8", html:`
  <div class="eyebrow">7.4.3 · Critical Path Method</div><h2 class="title">CPM: เส้นทางวิกฤตและเวลาสำรอง</h2>
  <p class="lead">CPM คำนวณเวลาเริ่ม/เสร็จของแต่ละงานทั้งไปหน้า (ES/EF) และย้อนกลับ (LS/LF) เพื่อหา "เส้นทางวิกฤต" และ "เวลาสำรอง (Float)" — ปรับระยะเวลาแล้วดูเครือข่ายเปลี่ยน</p>
  <div class="grid c2" style="margin-bottom:12px">
    <div class="card"><h4>Forward Pass → ES/EF</h4><p>ES = เริ่มเร็วสุด · EF = ES + ระยะเวลา ไล่จากต้นไปปลาย</p></div>
    <div class="card"><h4>Backward Pass → LS/LF</h4><p>LF = เสร็จช้าสุดที่ยอมได้ · LS = LF − ระยะเวลา ไล่ย้อนกลับ</p></div>
  </div>
  <div class="lab">
    <div class="labh">🧮 เครือข่าย CPM (AON) — โหนดแดง = งานวิกฤต (TF=0) <span class="badge">ปรับระยะเวลาได้</span></div>
    <div class="hint">แต่ละโหนดแสดง ES · Dur · EF (แถวบน) และ LS · TF · LF (แถวล่าง) · TF (Total Float) = เวลาที่งานเลื่อนได้โดยไม่กระทบโครงการ</div>
    <div class="ctrlrow" id="cpmCtrl7"></div>
    <div class="vizwrap"><div class="cnet" id="cpmNet7"></div></div>
    <div id="cpmRes7" class="res"></div>
  </div>
  <div class="callout warn"><b>Float (เวลาสำรอง) = 0 → งานวิกฤต:</b> งานที่ไม่มีเวลาสำรอง หากล่าช้าแม้นิดเดียวโครงการจะล่าช้าทันที เส้นทางที่ต่อกันด้วยงานวิกฤตทั้งหมดคือ "เส้นทางวิกฤต"</div>
  <div class="callout info"><b>รากฐานทฤษฎี:</b> วิธีวิถีวิกฤต (Critical Path Method: CPM) พัฒนาโดย Kelley และ Walker (ค.ศ. 1959) เพื่อวางแผนงานอุตสาหกรรม ส่วนเทคนิค PERT (Program Evaluation and Review Technique) พัฒนาโดยกองทัพเรือสหรัฐฯ (ค.ศ. 1958) ในโครงการขีปนาวุธ Polaris ทั้งสองเป็นรากฐานของการวางตารางเวลาแบบเครือข่ายที่ใช้กันจนปัจจุบัน</div>
`},
{ id:"c7-pert", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.3.4 PERT (ประมาณ 3 ค่า)", icon:"9", html:`
  <div class="eyebrow">7.4.4 · PERT</div><h2 class="title">PERT: ประมาณเวลาแบบ 3 ค่า</h2>
  <p class="lead">เมื่อเวลาไม่แน่นอน PERT ใช้ 3 ค่า (มองโลกดี/ปกติ/แย่) หาเวลาคาดหวัง และคำนวณ "ความน่าจะเป็น" ที่จะเสร็จภายในเวลาที่กำหนด</p>
  <div class="grid c2" style="margin-bottom:12px">
    <div class="card"><h4>สูตรเวลาคาดหวัง</h4><div class="fx" style="background:#243056;color:#EDEBFA;border-radius:10px;padding:12px;text-align:center;font-size:15px">te = (to + 4·tm + tp) / 6</div><p style="font-size:12.5px;color:var(--mute);margin-top:8px">to=ดีสุด · tm=น่าจะเป็นมากสุด · tp=แย่สุด</p></div>
    <div class="card"><h4>ความแปรปรวน</h4><div class="fx" style="background:#243056;color:#EDEBFA;border-radius:10px;padding:12px;text-align:center;font-size:15px">σ² = [(tp − to) / 6]²</div><p style="font-size:12.5px;color:var(--mute);margin-top:8px">ยิ่ง tp−to กว้าง ยิ่งไม่แน่นอน</p></div>
  </div>
  <div class="lab">
    <div class="labh">🧮 เครื่องคิด PERT + ความน่าจะเป็น <span class="badge">ปรับ to/tm/tp ได้</span></div>
    <div class="hint">ใส่ 3 ค่าของแต่ละงาน ระบบคำนวณ te และ σ² ให้ แล้วบอกโอกาสเสร็จภายในเวลาที่ตั้ง (T)</div>
    <div class="vizwrap"><table class="pt" id="pertTable7"></table></div>
    <div id="pertRes7" class="res" style="margin-top:10px"></div>
    <div class="ctrlrow" style="margin-top:10px"><span class="ci"><b>อยากเสร็จภายใน T =</b> <input class="numin" style="width:56px" id="pertT7" type="number" value="16"> หน่วยเวลา</span></div>
    <div id="pertProb7" class="res"></div>
    <svg class="bell" id="pertBell7" viewBox="0 0 440 130"></svg>
    <div id="pertInterp7" class="callout info" style="margin:8px 0 0;font-size:13.5px"></div>
  </div>
  <div class="callout tip"><b>อ่านผลอย่างไร:</b> ถ้าโอกาสเสร็จภายใน T ต่ำกว่า 50% ควรเผื่อเวลาเพิ่ม — PERT ช่วยตอบว่า "ควรสัญญาวันส่งมอบเมื่อไรจึงมั่นใจ ~95%"</div>
`},
{ id:"c7-change", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"7.4 จัดการการเปลี่ยนแปลง", icon:"10", html:`
  <div class="eyebrow">7.6 · Change Control</div><h2 class="title">การจัดการการเปลี่ยนแปลงขอบเขต</h2>
  <div class="callout info"><b>เมื่อมีคำขอเปลี่ยนขอบเขต</b> ต้องมีกระบวนการพิจารณา <b>ผลกระทบต่อเวลา ต้นทุน และคุณภาพ</b> ก่อนตัดสินใจอนุมัติ</div>
  <ol class="qs" style="counter-reset:none">
    <li><b>รับคำขอ</b> — บันทึกคำขอเปลี่ยนแปลงอย่างเป็นทางการ</li>
    <li><b>ประเมินผลกระทบ</b> — ต่อเวลา/ต้นทุน/คุณภาพ/ความเสี่ยง</li>
    <li><b>ตัดสินใจ</b> — อนุมัติ / ปฏิเสธ / เลื่อน โดยผู้มีอำนาจ</li>
    <li><b>ปรับแผน + สื่อสาร</b> — อัปเดต Baseline และแจ้งทีม</li>
  </ol>
  <div class="callout ok"><b>Change Control</b> ที่เป็นระบบช่วยรักษาสมดุลของข้อจำกัดโครงการ (ย้อนกลับไปดู Triple Constraint บท 1)</div>
`},
{ id:"c7-case", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: WBS + Gantt ของโครงงานแอปจองคิว</h2>
  <div class="callout info">ทีมแตก WBS เป็น 4 งานหลัก (วิเคราะห์ความต้องการ · ออกแบบ · พัฒนา · ทดสอบ/นำเสนอ) แล้วแตกเป็นงานย่อย กำหนดผู้รับผิดชอบและระยะเวลา</div>
  <div class="grid c2">
    <div class="card"><h4>จัดทำ Gantt + Milestone รายสัปดาห์</h4><p>ทีมเห็นภาพงานทั้งหมด ระบุเส้นทางวิกฤต และติดตามความก้าวหน้าได้</p></div>
    <div class="card"><h4>ใช้ Change Control</h4><p>เมื่อมีคำขอเพิ่มฟังก์ชันใหม่ ทีมประเมินผลกระทบก่อนตัดสินใจ — ไม่รับเพิ่มพร่ำเพรื่อ</p></div>

`},
{ id:"c7-sum", part:"", group:"บทที่ 7 · ขอบเขตและ WBS", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`

{ id:"ch8", part:"", group:"บทที่ 8 · เครื่องมือและโปรแกรมบริหารโครงการ", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 8 · Overview</div><h2 class="title">เครื่องมือและโปรแกรมบริหารโครงการ</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2–2.5 ชั่วโมง</b> · 9 หน้าจอสอน</div>
  <p class="lead">ในยุคดิจิทัล เครื่องมือช่วยเพิ่มประสิทธิภาพการวางแผน ติดตาม และทำงานร่วมกัน — การเลือกใช้ให้เหมาะเป็นทักษะสำคัญ</p>

    <li>สร้างตารางงาน Task, Milestone และ Gantt Chart ด้วยโปรแกรมได้</li>

  <div class="chapopen" data-open="8"></div>

{ id:"c8-tools", part:"", group:"บทที่ 8 · เครื่องมือและโปรแกรมบริหารโครงการ", nav:"8.1 ภาพรวมเครื่องมือ", icon:"2", html:`
  <div class="eyebrow">8.2 · Tools Overview</div><h2 class="title">ภาพรวมเครื่องมือบริหารโครงการ</h2>
  <p class="lead">มีหลายระดับ ตั้งแต่ตารางใน Excel/Sheets ไปจนถึงโปรแกรมเฉพาะ — เลือกตามขนาด ความซับซ้อน งบ และความคุ้นเคยของทีม</p>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">เครื่องมือ</th><th style="background:var(--blue)">จุดเด่น</th><th style="background:var(--teal)">เหมาะกับ</th></tr></thead>
    <tbody>
      <tr><td>Excel/Sheets</td><td>ยืดหยุ่น ใช้กว้าง</td><td>โครงการขนาดเล็ก</td></tr>
      <tr><td>Trello</td><td>บอร์ด Kanban ใช้ง่าย</td><td>งานทีมที่เห็นสถานะชัด</td></tr>
      <tr><td>ClickUp/Asana</td><td>ฟีเจอร์ครบ ติดตามงาน</td><td>โครงการที่ซับซ้อนขึ้น</td></tr>
      <tr><td>MS Project</td><td>วางแผน Gantt/Critical Path</td><td>โครงการขนาดใหญ่</td></tr>
    </tbody>
  </table></div>
  <div class="callout tip"><b>สำหรับโครงงานนิสิต:</b> เครื่องมือแบบบอร์ด (Kanban) เช่น Trello ใช้ง่ายและเหมาะกับการทำงานเป็นทีม เลือกที่ฟรีหรือมีแผนสำหรับนักศึกษา</div>
  <h3>ลองหาเครื่องมือที่เหมาะ — กดเลือกเงื่อนไข</h3>
  <div class="lab">
    <div class="labh">🧭 ตัวช่วยเลือกเครื่องมือ <span class="badge">เลือก 2 ข้อ</span></div>
    <div class="ctrlrow" style="gap:16px"><div><div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px">ขนาด/ความซับซ้อน</div><div class="wsel" id="toolSize"><button class="on" data-sz="0">เล็ก</button><button data-sz="1">กลาง</button><button data-sz="2">ใหญ่/ซับซ้อน</button></div></div>
    <div><div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px">ต้องวาง Gantt/Critical Path?</div><div class="wsel" id="toolGantt"><button class="on" data-gt="0">ไม่จำเป็น</button><button data-gt="1">ต้องการ</button></div></div></div>
    <div id="toolRec" class="res"></div>
  </div>
`},
{ id:"c8-kanban", part:"", group:"บทที่ 8 · เครื่องมือและโปรแกรมบริหารโครงการ", nav:"8.2 บอร์ด Kanban (ลองเล่น)", icon:"3", html:`
  <div class="eyebrow">8.3 · Kanban Board</div><h2 class="title">บอร์ดงานแบบ Kanban</h2>
  <p class="lead">บอร์ด Kanban แสดงสถานะงานเป็นคอลัมน์ To do → Doing → Done — กดที่การ์ดเพื่อเลื่อนสถานะงาน</p>
  <div class="kanban" id="kanban"></div>
  <div class="callout info"><b>ประโยชน์:</b> ทุกคนเห็นสถานะงานร่วมกันแบบเรียลไทม์ รู้ว่าใครทำอะไรค้างอยู่ และงานไหนเสร็จแล้ว — ลดการสื่อสารซ้ำซ้อน</div>
  <div class="callout warn"><b>WIP Limit (จำกัดงานที่ทำพร้อมกัน):</b> หัวใจของ Kanban คือ "อย่าเปิดงานค้างไว้เยอะ" — จำกัดจำนวนการ์ดในคอลัมน์ Doing เช่นไม่เกิน 2 ใบ/คน เพื่อให้งาน "ไหลจนจบ" ก่อนเริ่มใหม่ ลดการทำหลายอย่างพร้อมกันจนไม่เสร็จสักอย่าง</div>
  <div class="callout info"><b>รากฐานทฤษฎี:</b> "คัมบัง" (Kanban) มีต้นกำเนิดจากระบบการผลิตแบบโตโยต้า (Toyota Production System) ที่พัฒนาโดย Taiichi Ohno ภายใต้แนวคิดแบบลีน (Lean) เพื่อควบคุมการไหลของงานแบบทันเวลาพอดี (Just-in-Time) ต่อมา David J. Anderson (2010) ได้นำมาประยุกต์เป็นวิธีบริหารงานความรู้และซอฟต์แวร์ · โดยรวมเครื่องมือเหล่านี้จัดอยู่ในกรอบ "ระบบสารสนเทศเพื่อการบริหารโครงการ" (Project Management Information System: PMIS)</div>
  <div class="callout tip"><b>Gantt ในโปรแกรม:</b> โปรแกรมช่วยสร้าง Task กำหนดวันเริ่ม–สิ้นสุด ความสัมพันธ์ระหว่างงาน และแสดง Gantt + Milestone + เส้นทางวิกฤตอัตโนมัติ (ดู Gantt โต้ตอบในบท 7)</div>
`},
{ id:"c8-track", part:"", group:"บทที่ 8 · เครื่องมือและโปรแกรมบริหารโครงการ", nav:"8.3 ทรัพยากร & ติดตามงาน", icon:"4", html:`
  <div class="eyebrow">8.4–8.6 · Resources &amp; Tracking</div><h2 class="title">จัดสรรทรัพยากร ติดตามงาน และทำงานร่วมกัน</h2>
  <div class="grid c2">
    <div class="card"><h4>จัดสรรทรัพยากร</h4><p>กำหนดผู้รับผิดชอบและทรัพยากรในแต่ละงาน ประเมินภาระงาน — ป้องกัน <b>Overallocation</b> (จัดสรรเกินกำลัง)</p></div>
    <div class="card"><h4>ติดตาม vs Baseline</h4><p>บันทึกความก้าวหน้าจริงเทียบ <b>แผนฐาน (Baseline)</b> เห็นความคลาดเคลื่อนของเวลา/ต้นทุน และปรับแผนทันเวลา</p></div>
  </div>
  <div class="callout ok"><b>ทำงานร่วมกันแบบดิจิทัล:</b> เครื่องมือสมัยใหม่รองรับการทำงานเรียลไทม์ การแจ้งเตือน และแนบไฟล์ — ช่วยทีมต่างเวลา/ต่างสถานที่ประสานงานได้ ลดข้อมูลสูญหาย เพิ่มความโปร่งใส</div>
  <div class="callout warn"><b>กุญแจสำคัญ:</b> เครื่องมือดีแค่ไหนก็ไร้ค่าถ้าไม่ <b>อัปเดตข้อมูลสม่ำเสมอ</b> — วินัยการอัปเดตทุกสัปดาห์คือหัวใจ</div>
`},
{ id:"c8-case", part:"", group:"บทที่ 8 · เครื่องมือและโปรแกรมบริหารโครงการ", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: Trello + ClickUp ในโครงงานนิสิต</h2>
  <div class="grid c2">
    <div class="card"><h4>Trello — บอร์ดงาน</h4><p>คอลัมน์ To do / Doing / Done กำหนดผู้รับผิดชอบและกำหนดส่งในแต่ละการ์ด</p></div>
    <div class="card"><h4>ClickUp — มุมมอง Gantt</h4><p>ติดตามกำหนดการ อัปเดตความก้าวหน้าทุกสัปดาห์</p></div>
  </div>
  <div class="callout ok"><b>ผลลัพธ์:</b> เมื่อพบว่างานออกแบบล่าช้ากว่า Baseline ทีมปรับลำดับงานและจัดสรรกำลังคนใหม่ ทำให้โครงงานกลับมาอยู่ในกำหนด</div>
  <div class="callout act"><span class="tag">ลงมือ</span><b>(10 นาที)</b> ให้แต่ละกลุ่มเปิดบัญชี Trello (ฟรี) สร้างบอร์ด To do/Doing/Done ใส่งานจาก WBS ของตัวเอง แล้วมอบหมายผู้รับผิดชอบ</div>
`},
{ id:"c8-sum", part:"", group:"บทที่ 8 · เครื่องมือและโปรแกรมบริหารโครงการ", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 8</h2>
  <ul class="clean">
    <li><b>เลือกเครื่องมือ</b> ให้เหมาะกับขนาด/ความซับซ้อน/งบ/ความคุ้นเคยของทีม</li>
    <li><b>Kanban</b> เห็นสถานะงานร่วมกัน · <b>Gantt</b> เห็นกำหนดการและเส้นทางวิกฤต</li>
    <li><b>จัดสรรทรัพยากร</b> ป้องกัน Overallocation · <b>ติดตาม vs Baseline</b> ปรับแผนทันเวลา</li>
    <li><b>อัปเดตข้อมูลสม่ำเสมอ</b> คือกุญแจของการใช้เครื่องมือให้ได้ผล</li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>ยกตัวอย่างเครื่องมือบริหารโครงการ 3 ชนิด พร้อมจุดเด่นและความเหมาะสม</li>
    <li>Gantt Chart ช่วยในการบริหารโครงการอย่างไร</li>
    <li>Overallocation คืออะไร และจะป้องกันอย่างไร</li>
    <li>อธิบายความสำคัญของการเปรียบเทียบผลงานจริงกับ Baseline</li>
    <li>เลือกเครื่องมือบริหารโครงการสำหรับโครงงานกลุ่มท่าน พร้อมเหตุผล</li>
    <li>ฝึกสร้างบอร์ดงานและ Gantt Chart เบื้องต้นของโครงงานกลุ่ม</li>
    <li>เครื่องมือดิจิทัลช่วยการทำงานร่วมกันของทีมอย่างไร</li>
  </ol>
`},
{ id:"c8-gloss", part:"", group:"บทที่ 8 · เครื่องมือและโปรแกรมบริหารโครงการ", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 8</h2>
  <div class="gdef">
    <div class="gitem"><b>Kanban</b><span>ระบบบริหารงานแบบบอร์ดที่แสดงสถานะงานเป็นคอลัมน์</span></div>
    <div class="gitem"><b>Gantt Chart</b><span>แผนภูมิแสดงกำหนดการและความสัมพันธ์ของงานตามเวลา</span></div>
    <div class="gitem"><b>Baseline</b><span>แผนฐานที่ใช้เปรียบเทียบกับผลการดำเนินงานจริง</span></div>
    <div class="gitem"><b>Overallocation</b><span>การจัดสรรทรัพยากรเกินกำลังที่มี</span></div>
    <div class="gitem"><b>Task</b><span>หน่วยงานย่อยที่กำหนดผู้รับผิดชอบและกำหนดเวลา</span></div>
    <div class="gitem"><b>Milestone</b><span>จุดสำคัญที่ใช้ติดตามความก้าวหน้า</span></div>
  </div>
  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management.</i> · PMI. <i>PMBOK Guide.</i></div>
`},
/* ===== บทที่ 9 ===== */
{ id:"ch9", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 9 · Overview</div><h2 class="title">การบริหารงบประมาณและทรัพยากรโครงการ</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2.5 ชั่วโมง</b> · 9 หน้าจอสอน</div>
  <p class="lead">งบประมาณและทรัพยากรเป็นข้อจำกัดสำคัญของทุกโครงการ — บริหารดีทำให้โครงการอยู่ในต้นทุนและเกิดความคุ้มค่า</p>
  <h3>วัตถุประสงค์การเรียนรู้ประจำบท</h3>
  <ul class="clean">
    <li>ประมาณการต้นทุนของโครงการด้วยวิธีที่เหมาะสมได้</li>
    <li>จัดทำงบประมาณโครงการพร้อมงบสำรองได้</li>
    <li>วางแผนและบริหารทรัพยากรของโครงการได้</li>
    <li>ควบคุมต้นทุนและวิเคราะห์ความคุ้มค่า (จุดคุ้มทุน, ROI) ได้</li>
    <li>ประยุกต์การบริหารงบประมาณกับโครงงานธุรกิจสมัยใหม่ได้</li>
  </ul>
  <div class="chapopen" data-open="9"></div>
`},
{ id:"c9-est", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"9.1 ประมาณการต้นทุน", icon:"2", html:`
  <div class="eyebrow">9.2 · Cost Estimating</div><h2 class="title">การประมาณการต้นทุน 3 วิธี</h2>
  <div class="grid c3">
    <div class="card"><h4>Analogous</h4><p>เทียบเคียงโครงการคล้ายกัน — เร็ว แต่แม่นยำต่ำ</p></div>
    <div class="card"><h4>Parametric</h4><p>ประมาณด้วยพารามิเตอร์/สูตร — แม่นยำปานกลาง-สูง</p></div>
    <div class="card"><h4>Bottom-up</h4><p>ประมาณจากล่างขึ้นบนตาม WBS — ช้า แต่แม่นยำสูงสุด</p></div>
  </div>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">วิธี</th><th style="background:var(--blue)">ความรวดเร็ว</th><th style="background:var(--teal)">ความแม่นยำ</th></tr></thead>
    <tbody>
      <tr><td>Analogous</td><td>สูง</td><td>ต่ำ–ปานกลาง</td></tr>
      <tr><td>Parametric</td><td>ปานกลาง</td><td>ปานกลาง–สูง</td></tr>
      <tr><td>Bottom-up</td><td>ต่ำ</td><td>สูง</td></tr>
    </tbody>
  </table></div>
  <div class="callout tip"><b>สำหรับโครงงานนิสิต:</b> ใช้ <b>Bottom-up จาก WBS</b> — แตกงานย่อยแล้วประมาณต้นทุนแต่ละงานรวมขึ้นมา แม่นยำที่สุด</div>
  <h3>รู้จักประเภทของต้นทุน</h3>
  <div class="grid c3">
    <div class="card"><h4>คงที่ vs ผันแปร</h4><p><b>Fixed</b> ไม่เปลี่ยนตามปริมาณ (ค่าเช่า) · <b>Variable</b> เปลี่ยนตามปริมาณ (วัตถุดิบ/หน่วย)</p></div>
    <div class="card"><h4>ทางตรง vs ทางอ้อม</h4><p><b>Direct</b> ระบุเข้าโครงการได้ตรง (ค่าจ้างทีม) · <b>Indirect</b> ใช้ร่วมหลายงาน (ค่าไฟ/ส่วนกลาง)</p></div>
    <div class="card"><h4>Sunk Cost</h4><p>ต้นทุนจมที่จ่ายไปแล้ว เรียกคืนไม่ได้ — <b>ห้าม</b> เอามาใช้ตัดสินใจว่าจะไปต่อหรือไม่</p></div>
  </div>
  <div class="callout warn"><b>กับดัก Sunk Cost:</b> "ลงทุนไปเยอะแล้ว เสียดาย ต้องทำต่อ" เป็นการตัดสินใจที่ผิด — ควรดูว่า "จากนี้ไป" คุ้มไหม ไม่ใช่ที่จ่ายไปแล้ว</div>
`},
{ id:"c9-budget", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"9.2 งบประมาณ + งบสำรอง", icon:"3", html:`
  <div class="eyebrow">9.3–9.4 · Budgeting &amp; Resources</div><h2 class="title">จัดทำงบประมาณและบริหารทรัพยากร</h2>
  <div class="callout info"><b>งบประมาณโครงการ</b> = รวมต้นทุนงานทั้งหมด + กำหนด <b>งบสำรอง (Contingency Reserve)</b> สำหรับความเสี่ยงที่คาดการณ์ได้ — ทำหน้าที่เป็น <b>Cost Baseline</b> ในการควบคุมการใช้จ่าย</div>
  <div class="grid c2">
    <div class="card"><h4>ทำไมต้องมีงบสำรอง</h4><p>กันเหตุไม่คาดฝัน (ราคาขึ้น งานเพิ่ม) ให้โครงการมีสภาพคล่องพอ ลดความเสี่ยงทางการเงิน — นิยม 10–15%</p></div>
    <div class="card"><h4>บริหารทรัพยากร</h4><p>บุคลากร · อุปกรณ์ · วัสดุ · เวลา — จัดสรรให้สอดคล้องกับงานและกำหนดการ หลีกเลี่ยงไม่พอหรือเกิน</p></div>
  </div>
  <div class="callout ok"><b>บริหารคนที่ดี:</b> มอบหมายงานตามความสามารถ และรักษาแรงจูงใจของทีม (เชื่อมกับบท 5)</div>
`},
{ id:"c9-roi", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"9.3 จุดคุ้มทุน & ROI (คำนวณ)", icon:"4", html:`
  <div class="eyebrow">9.5 · Break-even &amp; ROI</div><h2 class="title">ควบคุมต้นทุนและวิเคราะห์ความคุ้มค่า</h2>
  <p class="lead">จุดคุ้มทุนบอกว่าต้องขายเท่าไรจึงเริ่มมีกำไร · ROI บอกว่าการลงทุนคุ้มแค่ไหน — ลองปรับตัวเลขดู</p>
  <div class="lab">
    <div class="labh">🧮 เครื่องคิดจุดคุ้มทุน (Break-even) <span class="badge">ปรับตัวเลข</span></div>
    <div class="hint">จุดคุ้มทุน (หน่วย) = ต้นทุนคงที่ ÷ (ราคาขาย − ต้นทุนผันแปรต่อหน่วย)</div>
    <div class="ctrlrow">
      <span class="ci"><b>ต้นทุนคงที่</b> <input class="numin" style="width:90px" id="beFix" type="number" min="0" value="20000"></span>
      <span class="ci"><b>ราคาขาย/หน่วย</b> <input class="numin" style="width:70px" id="bePrice" type="number" min="0" value="45"></span>
      <span class="ci"><b>ต้นทุนผันแปร/หน่วย</b> <input class="numin" style="width:70px" id="beVar" type="number" min="0" value="20"></span>
    </div>
    <div id="beRes" class="res"></div>
  </div>
  <div class="lab">
    <div class="labh">🧮 เครื่องคิด ROI <span class="badge">ปรับตัวเลข</span></div>
    <div class="hint">ROI = (กำไรสุทธิ ÷ เงินลงทุน) × 100%</div>
    <div class="ctrlrow">
      <span class="ci"><b>กำไรสุทธิ</b> <input class="numin" style="width:90px" id="roiProfit" type="number" value="15000"></span>
      <span class="ci"><b>เงินลงทุน</b> <input class="numin" style="width:90px" id="roiInv" type="number" min="1" value="50000"></span>
    </div>
    <div id="roiRes" class="res"></div>
  </div>
`},
{ id:"c9-evm", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"9.4 การจัดการมูลค่างาน (EVM)", icon:"5", html:`
  <div class="eyebrow">9.5.1 · Earned Value Management</div><h2 class="title">การจัดการมูลค่าที่ได้ (EVM) — คุมเวลาและต้นทุนพร้อมกัน</h2>
  <p class="lead">EVM ตอบคำถามสำคัญ 2 ข้อพร้อมกัน: "งานคืบหน้าตามแผนไหม" และ "ใช้เงินเกินงบไหม" — จากตัวเลข 3 ค่า</p>
  <div class="callout info"><b>รากฐานทฤษฎี:</b> การจัดการมูลค่าที่ได้ (Earned Value Management) มีต้นกำเนิดจากระบบ C/SCSC (Cost/Schedule Control Systems Criteria) ของกระทรวงกลาโหมสหรัฐฯ ในคริสต์ทศวรรษ 1960 และปัจจุบันเป็นมาตรฐานสากล (เช่น ANSI/EIA-748) ที่ PMBOK รับรอง — ถือเป็นเครื่องมือบูรณาการมิติขอบเขต เวลา และต้นทุนเข้าด้วยกัน</div>
  <div class="grid c3">
    <div class="card"><h4>PV (Planned Value)</h4><p>มูลค่างานที่ "วางแผนว่าควรเสร็จ" ณ ตอนนี้</p></div>
    <div class="card"><h4>EV (Earned Value)</h4><p>มูลค่างานที่ "ทำเสร็จจริง" (คิดตาม % งานที่เสร็จ × งบ)</p></div>
    <div class="card"><h4>AC (Actual Cost)</h4><p>เงินที่ "จ่ายไปจริง" ณ ตอนนี้</p></div>
  </div>
  <div class="lab">
    <div class="labh">🧮 เครื่องคิด EVM <span class="badge">ปรับ PV / EV / AC / BAC</span></div>
    <div class="hint">CV = EV−AC (บวก=ประหยัด) · SV = EV−PV (บวก=เร็วกว่าแผน) · CPI = EV/AC · SPI = EV/PV (≥1 = ดี) · EAC = BAC/CPI (คาดการณ์งบตอนจบ)</div>
    <div class="ctrlrow">
      <span class="ci"><b>PV</b> <input class="numin" style="width:74px" id="evmPV" type="number" value="50000"></span>
      <span class="ci"><b>EV</b> <input class="numin" style="width:74px" id="evmEV" type="number" value="45000"></span>
      <span class="ci"><b>AC</b> <input class="numin" style="width:74px" id="evmAC" type="number" value="48000"></span>
      <span class="ci"><b>BAC (งบรวม)</b> <input class="numin" style="width:84px" id="evmBAC" type="number" value="100000"></span>
    </div>
    <div id="evmRes" class="res"></div>
    <div id="evmInterp" class="callout info" style="margin:10px 0 0;font-size:13.5px"></div>
  </div>
  <div class="callout tip"><b>อ่านผลเร็ว ๆ:</b> ดูที่ <b>CPI</b> และ <b>SPI</b> — ถ้าทั้งคู่ ≥ 1 แปลว่าทั้งประหยัดงบและเร็วกว่าแผน · ถ้าต่ำกว่า 1 คือมีปัญหาด้านนั้น ๆ ต้องรีบแก้</div>
`},
{ id:"c9-case", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: งบประมาณรถเข็นกาแฟเคลื่อนที่</h2>
  <div class="callout info">ทีมประมาณการต้นทุนจาก WBS แบบล่างขึ้นบน (ค่าอุปกรณ์ · วัตถุดิบ · ค่าการตลาด) รวมเป็นงบประมาณ พร้อมงบสำรองร้อยละ 10</div>
  <div class="grid c2">
    <div class="card"><h4>คำนวณจุดคุ้มทุน</h4><p>ประเมินว่าต้องขายกี่แก้วต่อวันจึงจะคุ้มทุน</p></div>
    <div class="card"><h4>คำนวณ ROI เบื้องต้น</h4><p>ประเมินว่าการลงทุนคุ้มค่าหรือไม่</p></div>
  </div>
  <div class="callout ok"><b>ผลลัพธ์:</b> การวิเคราะห์ช่วยให้ทีมตัดสินใจเรื่อง <b>ราคาขายและปริมาณการผลิต</b> อย่างมีเหตุผลรองรับ</div>
  <div class="callout act"><span class="tag">ลองคำนวณ</span><b>(10 นาที)</b> ให้กลุ่มใส่ตัวเลขโครงงานตัวเองในเครื่องคิดจุดคุ้มทุน (หน้า 9.3) — ต้องขายกี่หน่วยจึงคุ้มทุน? รับได้ไหมในเวลา 1 เทอม</div>
`},
{ id:"c9-sum", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 9</h2>
  <ul class="clean">
    <li><b>ประมาณการต้นทุน</b> 3 วิธี — Analogous · Parametric · Bottom-up (แม่นสุด)</li>
    <li><b>งบประมาณ + งบสำรอง</b> ทำหน้าที่เป็น Cost Baseline</li>
    <li><b>บริหารทรัพยากร</b> ให้สอดคล้องงานและกำหนดการ</li>
    <li><b>จุดคุ้มทุน + ROI</b> ช่วยการตัดสินใจด้านการเงินมีเหตุผลรองรับ</li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>วิธีประมาณการต้นทุนแบบ Bottom-up ต่างจาก Analogous อย่างไร</li>
    <li>เหตุใดโครงการจึงต้องมีงบสำรอง (Contingency Reserve)</li>
    <li>อธิบายความหมายและประโยชน์ของจุดคุ้มทุนและ ROI</li>
    <li>การบริหารทรัพยากรที่ดีควรคำนึงถึงอะไรบ้าง</li>
    <li>จัดทำงบประมาณเบื้องต้นของโครงงานกลุ่มท่านพร้อมงบสำรอง</li>
    <li>คำนวณจุดคุ้มทุนอย่างง่ายจากข้อมูลสมมติของโครงงานท่าน</li>
    <li>Baseline ด้านต้นทุนมีไว้เพื่ออะไร</li>
  </ol>
`},
{ id:"c9-gloss", part:"", group:"บทที่ 9 · งบประมาณและทรัพยากร", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`

{ id:"ch10", part:"ส่วนที่ 4 · ดำเนินการ / ปิดโครงการ", group:"บทที่ 10 · คุณภาพและความเสี่ยง", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 10 · Overview</div><h2 class="title">การบริหารคุณภาพและการดำเนินโครงการ</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2.5 ชั่วโมง</b> · 8 หน้าจอสอน</div>
  <p class="lead">คุณภาพของผลงานเป็นปัจจัยชี้วัดความสำเร็จที่สำคัญพอ ๆ กับเวลาและต้นทุน</p>
  <div class="callout info"><b>แกนของบท:</b> วางแผนคุณภาพ · กำหนด KPI · ควบคุมคุณภาพระหว่างทาง · บริหารความเสี่ยง (ระบุ→ประเมิน→รับมือ)</div>

{ id:"c10-quality", part:"", group:"บทที่ 10 · คุณภาพและความเสี่ยง", nav:"10.1 วางแผนคุณภาพ + KPI", icon:"2", html:`
  <div class="eyebrow">10.2–10.4 · Quality</div><h2 class="title">การวางแผนและควบคุมคุณภาพ</h2>
  <div class="callout info"><b>วางแผนคุณภาพ</b> = กำหนดมาตรฐานของผลงานส่งมอบ และวิธีที่จะบรรลุ+ตรวจสอบมาตรฐานนั้น</div>
  <div class="callout ok"><b>Quality by Design:</b> ออกแบบคุณภาพเข้าไปในกระบวนการ <b>ตั้งแต่ต้น</b> ดีกว่ารอตรวจจับข้อผิดพลาดในตอนท้ายอย่างเดียว</div>
  <h3>วงจรพัฒนาคุณภาพ PDCA — กดดูแต่ละขั้น</h3>
  <div class="wfmap" id="pdcaMap">
    <button class="wfnode" data-pc="0"><span class="wfcirc">P</span><span class="wflbl">Plan</span></button><span class="wfarrow">→</span>
    <button class="wfnode" data-pc="1"><span class="wfcirc">D</span><span class="wflbl">Do</span></button><span class="wfarrow">→</span>
    <button class="wfnode" data-pc="2"><span class="wfcirc">C</span><span class="wflbl">Check</span></button><span class="wfarrow">→</span>
    <button class="wfnode" data-pc="3"><span class="wfcirc">A</span><span class="wflbl">Act</span></button><span class="wfarrow">↻</span>
  </div>
  <div class="wfdetail" id="pdcaDetail"></div>
  <div class="callout tip" style="margin-top:14px"><b>PDCA วนซ้ำ:</b> ไม่ใช่ทำครั้งเดียวจบ แต่หมุนวนเพื่อ "ปรับปรุงต่อเนื่อง" (Continuous Improvement) — เชื่อมกับแนวคิดไคเซ็น (Kaizen)</div>
  <h3>รากฐานแนวคิด: ปรมาจารย์ด้านคุณภาพ</h3>
  <p style="font-size:14px;color:var(--mute);margin-bottom:10px">การบริหารคุณภาพสมัยใหม่มีรากฐานจากนักคิดสำคัญในช่วงคริสต์ทศวรรษ 1950–1980 อันเป็นที่มาของระบบการบริหารคุณภาพทั่วทั้งองค์กร (Total Quality Management: TQM) และมาตรฐาน ISO 9001</p>
  <div class="grid c3">
    <div class="card"><h4>W. E. Deming</h4><p>ผู้พัฒนาวงจร PDCA และหลักการบริหาร 14 ประการ เน้นว่าคุณภาพเป็นความรับผิดชอบของ "ระบบและผู้บริหาร" มิใช่ตัวผู้ปฏิบัติงาน</p></div>
    <div class="card"><h4>J. M. Juran</h4><p>เสนอไตรภาคคุณภาพ (Quality Trilogy: การวางแผน–ควบคุม–ปรับปรุง) และนิยามคุณภาพว่า "ความเหมาะสมกับการใช้งาน" (Fitness for Use)</p></div>
    <div class="card"><h4>P. B. Crosby</h4><p>เสนอแนวคิด "ของเสียเป็นศูนย์" (Zero Defects) และหลัก "ทำให้ถูกต้องตั้งแต่ครั้งแรก" (Do it right the first time)</p></div>
  </div>
  <div class="callout info"><b>ต้นทุนคุณภาพ (Cost of Quality):</b> จำแนกเป็นต้นทุนการป้องกัน (Prevention) · ต้นทุนการตรวจสอบ (Appraisal) · ต้นทุนความล้มเหลวภายในและภายนอก (Internal/External Failure) — โดยหลักการ <b>การลงทุนป้องกันตั้งแต่ต้นย่อมประหยัดกว่าการแก้ไขความล้มเหลวในภายหลัง</b></div>
  <div class="callout tip"><b>เครื่องมือควบคุมคุณภาพ 7 ชนิด (7 QC Tools):</b> ผังแสดงเหตุและผล (Cause-and-Effect / Ishikawa) · แผนภูมิพาเรโต (Pareto) · ใบตรวจสอบ (Check Sheet) · ฮิสโทแกรม (Histogram) · ผังการกระจาย (Scatter Diagram) · แผนภูมิควบคุม (Control Chart) · ผังการไหลของงาน (Flowchart)</div>
  <h3>ตัวชี้วัดความสำเร็จ (KPI) ที่ดี</h3>
  <div class="grid c2">
    <div class="card"><h4>วัดผลได้ ชัดเจน</h4><p>เช่น ความพึงพอใจผู้ใช้ · จำนวนข้อผิดพลาด · ระยะเวลาให้บริการ · อัตราการใช้ซ้ำ</p></div>
    <div class="card"><h4>สอดคล้องวัตถุประสงค์</h4><p>KPI ที่ดีเชื่อมกับเป้าหมายโครงการ ทำให้ประเมินความสำเร็จเป็นรูปธรรม</p></div>
  </div>
  <div class="callout tip"><b>ควบคุมคุณภาพระหว่างทาง:</b> ทดสอบ · รีวิว · เก็บข้อเสนอแนะจากผู้ใช้อย่างสม่ำเสมอ — เจอปัญหาเนิ่น ๆ แก้ถูกกว่าแก้ตอนท้าย</div>
`},
{ id:"c10-risk", part:"", group:"บทที่ 10 · คุณภาพและความเสี่ยง", nav:"10.2 ประเมินความเสี่ยง (ลองปรับ)", icon:"3", html:`
  <div class="eyebrow">10.5 · Risk Management</div><h2 class="title">การบริหารความเสี่ยงเบื้องต้น</h2>
  <p class="lead">ระบุ → ประเมินโอกาส×ผลกระทบ → วางแผนรับมือ — ปรับระดับในตารางแล้วดูระดับความเสี่ยงเปลี่ยนสี</p>
  <div class="callout info"><b>กรอบมาตรฐาน ISO 31000:</b> การบริหารความเสี่ยงเป็นกระบวนการต่อเนื่อง ประกอบด้วย การกำหนดบริบท (Establishing Context) → การระบุความเสี่ยง (Identification) → การวิเคราะห์ (Analysis) → การประเมินค่า (Evaluation) → การจัดการ (Treatment) โดยมีการสื่อสารและการเฝ้าติดตามกำกับตลอดกระบวนการ</div>
  <div class="grid c2" style="margin-bottom:12px">
    <div class="card"><h4>4 แนวทางรับมือ</h4><ul><li><b>Avoid</b> — หลีกเลี่ยง</li><li><b>Mitigate</b> — ลดโอกาส/ผลกระทบ</li><li><b>Transfer</b> — ถ่ายโอน (เช่น ประกัน)</li><li><b>Accept</b> — ยอมรับ</li></ul></div>
    <div class="card"><h4>ระดับความเสี่ยง</h4><p>= โอกาส × ผลกระทบ<br><span class="risklv h">สูง</span> เฝ้าใกล้ชิด · <span class="risklv m">กลาง</span> ติดตาม · <span class="risklv l">ต่ำ</span> รับได้</p></div>
  </div>
  <div class="lab">
    <div class="labh">🧮 ตารางประเมินความเสี่ยง <span class="badge">ปรับโอกาส/ผลกระทบ</span></div>
    <div class="vizwrap"><table class="risktab" id="riskTab"></table></div>
  </div>
  <h3>แผนที่ความร้อนความเสี่ยง (Risk Heatmap 5×5)</h3>
  <p class="lead">กดที่ช่องเพื่อดูคะแนนความเสี่ยง (โอกาส × ผลกระทบ) และโซนสี — สีแดง = ต้องจัดการก่อน</p>
  <div class="vizwrap"><div class="heatmap" id="riskHeat"></div></div>
  <div class="wfdetail" id="heatDetail"></div>
  <div class="callout ok"><b>มูลค่าคาดหวังทางการเงินของความเสี่ยง (Expected Monetary Value: EMV):</b> ใช้จัดลำดับความเสี่ยงเชิงปริมาณ โดย EMV = โอกาสเกิด (%) × ผลกระทบเป็นตัวเงิน เช่น ความเสี่ยงที่มีโอกาส 30% และผลกระทบ 20,000 บาท มี EMV = 6,000 บาท ซึ่งใช้เปรียบเทียบว่าควรลงทุนป้องกันเท่าใดจึงคุ้ม</div>
  <div class="callout warn"><b>ความเสี่ยง ≠ ปัญหา (Issue):</b> <b>ความเสี่ยง</b> = เหตุการณ์ที่ "อาจ" เกิดในอนาคต (บริหารเชิงป้องกัน) · <b>ปัญหา</b> = สิ่งที่ "เกิดขึ้นแล้ว" ต้องแก้ทันที</div>
`},
{ id:"c10-case", part:"", group:"บทที่ 10 · คุณภาพและความเสี่ยง", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: KPI และความเสี่ยงของทีมพัฒนาแอป</h2>
  <div class="grid c2">
    <div class="card"><h4>กำหนด KPI</h4><ul><li>แอปใช้งานได้ ≥ 95% ของฟังก์ชันที่วางไว้</li><li>ทดสอบกับผู้ใช้จริง ≥ 10 คน</li></ul></div>
    <div class="card"><h4>ประเมินความเสี่ยง</h4><ul><li>ด้านเวลา และด้านเทคนิค</li><li>เตรียมไลบรารีสำรองเผื่อเทคโนโลยีหลักมีปัญหา (Mitigate)</li></ul></div>
  </div>
  <div class="callout ok"><b>ผลลัพธ์:</b> ส่งมอบผลงานที่มีคุณภาพและลดโอกาสเกิดปัญหาเฉพาะหน้า</div>
  <div class="callout act"><span class="tag">ลงมือ</span><b>(10 นาที)</b> ให้กลุ่มใส่ความเสี่ยง 3 ข้อของโครงงานตัวเองในตาราง (หน้า 10.2) ปรับโอกาส/ผลกระทบ แล้วเขียนแนวทางรับมือแต่ละข้อ</div>
`},
{ id:"c10-sum", part:"", group:"บทที่ 10 · คุณภาพและความเสี่ยง", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 10</h2>
  <ul class="clean">
    <li><b>วางแผนคุณภาพ</b> + Quality by Design — ออกแบบคุณภาพตั้งแต่ต้น</li>
    <li><b>KPI</b> ที่วัดได้และสอดคล้องวัตถุประสงค์</li>
    <li><b>ควบคุมคุณภาพระหว่างทาง</b> — เจอปัญหาเนิ่น ๆ แก้ถูกกว่า</li>
    <li><b>บริหารความเสี่ยง</b> — ระบุ→ประเมิน→รับมือ (Avoid/Mitigate/Transfer/Accept)</li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>การวางแผนคุณภาพมีความสำคัญต่อความสำเร็จของโครงการอย่างไร</li>
    <li>กำหนด KPI ของโครงงานกลุ่มท่านอย่างน้อย 3 ตัว พร้อมเหตุผล</li>
    <li>อธิบายแนวทางรับมือความเสี่ยง 4 รูปแบบ พร้อมยกตัวอย่าง</li>
    <li>จัดทำตารางประเมินความเสี่ยงของโครงงานกลุ่มท่านอย่างน้อย 3 ความเสี่ยง</li>
    <li>เหตุใดการควบคุมคุณภาพแต่เนิ่น ๆ จึงประหยัดต้นทุนกว่าการแก้ไขในตอนท้าย</li>
    <li>Quality by Design หมายความว่าอย่างไร</li>
    <li>ความเสี่ยงต่างจากปัญหา (Issue) อย่างไร</li>
  </ol>
`},
{ id:"c10-gloss", part:"", group:"บทที่ 10 · คุณภาพและความเสี่ยง", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 10</h2>
  <div class="gdef">
    <div class="gitem"><b>Quality Planning</b><span>การกำหนดมาตรฐานคุณภาพและวิธีบรรลุมาตรฐานนั้น</span></div>
    <div class="gitem"><b>KPI</b><span>ตัวชี้วัดผลการดำเนินงานที่ใช้ประเมินความสำเร็จ</span></div>
    <div class="gitem"><b>Quality Control</b><span>การตรวจสอบผลงานให้เป็นไปตามมาตรฐาน</span></div>
    <div class="gitem"><b>Risk Management</b><span>กระบวนการระบุ ประเมิน และรับมือความเสี่ยง</span></div>
    <div class="gitem"><b>Mitigate/Transfer/Avoid/Accept</b><span>แนวทางรับมือความเสี่ยง 4 รูปแบบ</span></div>
    <div class="gitem"><b>Quality by Design</b><span>การออกแบบคุณภาพเข้าไปในกระบวนการตั้งแต่ต้น</span></div>
  </div>
  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management.</i> · PMI. <i>PMBOK Guide.</i></div>
`},

{ id:"c11-comm", part:"", group:"บทที่ 11 · การสื่อสารและการปิดโครงการ", nav:"11.1 แผนการสื่อสาร", icon:"2", html:`
  <div class="eyebrow">11.2–11.3 · Communication</div><h2 class="title">การวางแผนการสื่อสารและรายงานความก้าวหน้า</h2>
  <div class="callout info"><b>แผนการสื่อสาร</b> ตอบว่า ใครต้องการข้อมูลใด · รูปแบบใด · ความถี่เท่าใด · ช่องทางใด — เพื่อให้ผู้เกี่ยวข้องได้ข้อมูลถูกต้องและทันเวลา</div>
  <h3>ตารางที่ 11.1 องค์ประกอบของแผนการสื่อสาร</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">องค์ประกอบ</th><th style="background:var(--blue)">คำถามที่ต้องตอบ</th></tr></thead>
    <tbody>
      <tr><td>ผู้รับสาร</td><td>ใครต้องการข้อมูล</td></tr>
      <tr><td>เนื้อหา</td><td>ข้อมูลอะไร</td></tr>
      <tr><td>รูปแบบ/ช่องทาง</td><td>สื่อสารอย่างไร</td></tr>
      <tr><td>ความถี่</td><td>บ่อยแค่ไหน</td></tr>
      <tr><td>ผู้รับผิดชอบ</td><td>ใครเป็นผู้สื่อสาร</td></tr>
    </tbody>
  </table></div>
  <div class="callout tip"><b>รายงานความก้าวหน้าที่ดี:</b> กระชับ ตรงประเด็น เน้นข้อมูลที่นำไปใช้ได้ — สถานะเทียบแผน · ความเสี่ยง · สิ่งที่ต้องการการสนับสนุน</div>
  <h3>3 รูปแบบวิธีสื่อสาร</h3>
  <div class="grid c3">
    <div class="card"><h4>Interactive</h4><p>สองทาง เรียลไทม์ — ประชุม โทร วิดีโอคอล · เหมาะเรื่องซับซ้อน/ต้องตกลงกัน</p></div>
    <div class="card"><h4>Push (ส่งออก)</h4><p>ส่งถึงผู้รับ — อีเมล รายงาน เมโม · เหมาะแจ้งข้อมูลให้คนหมู่มาก (ไม่ยืนยันว่าอ่าน)</p></div>
    <div class="card"><h4>Pull (ดึงเอง)</h4><p>วางไว้ให้เข้ามาดู — เว็บบอร์ด ฐานข้อมูลกลาง · เหมาะข้อมูลปริมาณมาก</p></div>
  </div>
  <h3>ยิ่งคนเยอะ ช่องทางสื่อสารยิ่งพุ่ง — ลองคำนวณ</h3>
  <div class="lab">
    <div class="labh">🧮 เครื่องคิดช่องทางการสื่อสาร <span class="badge">ปรับจำนวนคน</span></div>
    <div class="hint">จำนวนช่องทาง = n(n−1)/2 · ยิ่งทีมใหญ่ ช่องทางยิ่งเพิ่มแบบทวีคูณ จึงต้องมี "แผน" การสื่อสาร</div>
    <div class="ctrlrow"><span class="ci"><b>จำนวนคนในทีม/ผู้เกี่ยวข้อง</b> <input class="numin" style="width:60px" id="commN" type="number" min="1" max="100" value="6"></span></div>
    <div id="commRes" class="res"></div>
  </div>
  <div class="callout warn"><b>ข้อคิด:</b> ทีม 6 คนมี 15 ช่องทาง แต่ 12 คนมีถึง 66 ช่องทาง — นี่คือเหตุผลที่ทีมใหญ่ต้องมีหัวหน้า/ช่องทางกลาง ไม่ใช่ทุกคนคุยกับทุกคน</div>
  <h3>รากฐานทฤษฎี: แบบจำลองการสื่อสารของแชนนอนและวีเวอร์</h3>
  <div class="callout info"><b>Shannon–Weaver Model (1949):</b> การสื่อสารประกอบด้วย <b>ผู้ส่งสาร (Sender) → การเข้ารหัส (Encoding) → สาร/ช่องทาง (Message/Channel) → การถอดรหัส (Decoding) → ผู้รับสาร (Receiver)</b> โดยมี <b>สิ่งรบกวน (Noise)</b> แทรกได้ทุกจุด และมี <b>ข้อมูลป้อนกลับ (Feedback)</b> เป็นตัวยืนยันความเข้าใจ — เป็นรากฐานที่อธิบายว่าเหตุใดสารจึงคลาดเคลื่อนได้</div>
  <div class="callout warn"><b>อุปสรรคการสื่อสาร (Communication Barriers):</b> ด้านภาษา/ศัพท์เทคนิค · ด้านกายภาพ (ระยะทาง/สัญญาณ) · ด้านจิตวิทยา (อคติ/ทัศนคติ) · ข้อมูลล้นเกิน (Information Overload) — ผู้จัดการโครงการต้องออกแบบการสื่อสารเพื่อลดสิ่งรบกวนเหล่านี้</div>
`},
{ id:"c11-close", part:"", group:"บทที่ 11 · การสื่อสารและการปิดโครงการ", nav:"11.2 ปิดโครงการ (เช็กลิสต์)", icon:"3", html:`
  <div class="eyebrow">11.4–11.6 · Closing</div><h2 class="title">การส่งมอบและปิดโครงการ</h2>
  <p class="lead">การปิดอย่างเป็นทางการช่วยให้โครงการสิ้นสุดเรียบร้อย ป้องกันงานค้างคา — กดเช็กแต่ละข้อเมื่อทำเสร็จ</p>
  <div class="lab">
    <div class="labh">✅ เช็กลิสต์การปิดโครงการ <span class="badge">กดเพื่อเช็ก</span></div>
    <div class="chkbar"><div id="clkBar"></div></div>
    <div id="clkStat" style="font-size:13px;color:var(--mute);margin-bottom:10px"></div>
    <ul class="chk" id="clkList"></ul>
  </div>
  <h3>ประเภทของการปิดโครงการ</h3>
  <div class="grid c2">
    <div class="card"><h4>ปิดตามปกติ (Normal)</h4><p>โครงการบรรลุวัตถุประสงค์และส่งมอบครบตามแผน</p></div>
    <div class="card"><h4>ปิดก่อนกำหนด (Premature)</h4><p>ยุติก่อนเสร็จเพราะไม่คุ้มค่า/เปลี่ยนกลยุทธ์ (มักผ่าน Stage Gate)</p></div>
    <div class="card"><h4>ปิดเพราะล้มเหลว (Failed)</h4><p>ไม่สามารถบรรลุเป้าหมายได้ ต้องบันทึกบทเรียนเป็นสำคัญ</p></div>
    <div class="card"><h4>ปิดแบบบูรณาการ (Integration)</h4><p>ส่งมอบผลงานเข้าสู่งานประจำ/ระบบเดิมขององค์กร</p></div>
  </div>
  <div class="callout ok"><b>ถอดบทเรียน (Lessons Learned) และการเรียนรู้ขององค์กร:</b> ตามแนวคิด "องค์กรแห่งการเรียนรู้" (The Learning Organization) ของ Peter Senge (1990) องค์กรควรแปลงประสบการณ์รายโครงการเป็น "ความรู้ที่จัดเก็บและเข้าถึงได้" (Knowledge Management) เพื่อมิให้เกิดข้อผิดพลาดซ้ำและต่อยอดในโครงการถัดไป</div>
`},
{ id:"c11-case", part:"", group:"บทที่ 11 · การสื่อสารและการปิดโครงการ", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: ปิดโครงงานและถอดบทเรียน</h2>
  <div class="callout info">เมื่อจบโครงงาน ทีมส่งมอบต้นแบบและเล่มรายงาน นำเสนอผลงานต่ออาจารย์และเพื่อนร่วมชั้น</div>
  <div class="grid c2">
    <div class="card"><h4>Lessons Learned</h4><p>"การแบ่งงานชัดเจนช่วยให้งานราบรื่น แต่ควรเผื่อเวลาทดสอบมากขึ้น" — บันทึกไว้ใช้ต่อ</p></div>
    <div class="card"><h4>ยอมรับทีม</h4><p>กล่าวขอบคุณสมาชิกเพื่อเสริมขวัญกำลังใจ ก่อนปิดโครงการอย่างเป็นทางการ</p></div>
  </div>
  <div class="callout act"><span class="tag">สะท้อนคิด</span><b>(8 นาที)</b> ให้กลุ่มลองเขียน Lessons Learned ล่วงหน้า 2 ข้อ (สิ่งที่ทำได้ดี / สิ่งที่จะปรับ) จากงานที่ผ่านมาถึงตอนนี้</div>
`},
{ id:"c11-sum", part:"", group:"บทที่ 11 · การสื่อสารและการปิดโครงการ", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`

  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2–2.5 ชั่วโมง</b> · 9 หน้าจอสอน</div>
  <p class="lead">บูรณาการความรู้ตลอดรายวิชา — เล่มรายงานและการนำเสนอคือผลงานชิ้นสำคัญที่ใช้ประเมินผลลัพธ์การเรียนรู้</p>

      <tr><td>ทบทวนแนวคิด</td><td>แนวคิด/ข้อมูลที่เกี่ยวข้อง</td></tr>
      <tr><td>วิธีดำเนินงาน</td><td>ขั้นตอนและการบริหารโครงการ</td></tr>
