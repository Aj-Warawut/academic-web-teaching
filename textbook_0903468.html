    </tbody>
  </table></div>
  <div class="callout info"><b>เทียบกับโครงสร้างงานวิชาการสากล IMRAD:</b> รายงานวิจัย/วิชาการนิยมใช้โครงสร้าง <b>Introduction – Methods – Results – and – Discussion</b> ซึ่งสอดคล้องกับโครงสร้างข้างต้น (บทนำ–วิธีดำเนินงาน–ผลการดำเนินงาน–สรุป/อภิปราย) การยึดโครงมาตรฐานช่วยให้ผู้อ่านติดตามเหตุผลได้เป็นระบบ</div>
  <div class="callout tip"><b>การอ้างอิงตามหลักวิชาการ (APA Style):</b> อ้างอิงในเนื้อหาแบบ (ผู้แต่ง, ปี) และจัดทำรายการอ้างอิงท้ายเล่มอย่างสม่ำเสมอ เพื่อความน่าเชื่อถือและหลีกเลี่ยงการคัดลอกผลงาน (Plagiarism)</div>
  <div class="callout dig"><span class="tag">การเขียนที่ดี</span>ลำดับความคิดชัดเจน มีหลักฐานสนับสนุน และสะท้อนคุณภาพของกระบวนการทำงานตลอดโครงการ</div>
`},
{ id:"c12-present", part:"", group:"บทที่ 12 · จัดทำและนำเสนอโครงงาน", nav:"12.2 นำเสนอ + สื่อ + จริยธรรม", icon:"3", html:`
  <div class="eyebrow">12.3–12.5 · Presentation &amp; Ethics</div><h2 class="title">การนำเสนอ สื่อ และจริยธรรม</h2>
  <h3>นำเสนออย่างมืออาชีพ</h3>
  <div class="grid c2">
    <div class="card"><h4>โครงเรื่องชัด</h4><p>เปิดด้วยประเด็นน่าสนใจ เน้นสาระสำคัญ บริหารเวลา เตรียมตอบคำถาม</p></div>
    <div class="card"><h4>ฝึกซ้อม</h4><p>ซ้อมก่อนจริงเพิ่มความมั่นใจ ความลื่นไหล และคุมเวลาได้</p></div>
  </div>
  <div class="callout ok"><b>One Idea per Slide:</b> หนึ่งสไลด์หนึ่งประเด็น ตัวอักษรใหญ่พอเหมาะ ใช้ภาพประกอบ หลีกเลี่ยงข้อความแน่นเกินไป (PowerPoint/Canva)</div>
  <h3>เล่าเรื่องให้จับใจ — โครง Problem → Solution → Result</h3>
  <div class="grid c3">
    <div class="card"><h4><span class="num r">1</span>Problem</h4><p>เปิดด้วยปัญหา/ความเจ็บปวดที่ผู้ฟังรู้สึกร่วม — "ทำไมเรื่องนี้สำคัญ"</p></div>
    <div class="card"><h4><span class="num a">2</span>Solution</h4><p>เสนอแนวคิด/ผลงานที่แก้ปัญหานั้น — "เราทำอะไร และทำไมได้ผล"</p></div>
    <div class="card"><h4><span class="num g">3</span>Result</h4><p>โชว์ผลลัพธ์/ตัวเลข/ผลตอบรับ — "แล้วมันได้ผลจริงแค่ไหน"</p></div>
  </div>
  <div class="callout tip"><b>หลักออกแบบสไลด์:</b> คอนทราสต์สูง (อ่านง่ายในห้องมืด) · ฟอนต์ ≥ 24pt · ใช้ภาพ/กราฟแทนข้อความยาว · จำกัด 6 บรรทัด/สไลด์ · สีไม่เกิน 2–3 สี</div>
  <div class="callout warn"><b>จริยธรรมวิชาการ:</b> อ้างอิงแหล่งข้อมูลถูกต้อง ไม่คัดลอกผลงานผู้อื่น (Plagiarism) เคารพลิขสิทธิ์ และคุ้มครองข้อมูลส่วนบุคคลของผู้ใช้ (ความยินยอม) · การใช้ AI ช่วยงานต้องอ้างอิงและตรวจสอบความถูกต้องเอง</div>
  <div class="callout ok"><b>รับมือคำถาม (Q&amp;A):</b> ฟังให้จบ · ทวนคำถามสั้น ๆ · ตอบตรงประเด็น · ไม่รู้ให้บอกว่าจะไปหาข้อมูลเพิ่ม — ซื่อสัตย์ดีกว่าเดา</div>
`},
{ id:"c12-timing", part:"", group:"บทที่ 12 · จัดทำและนำเสนอโครงงาน", nav:"12.2.1 วางแผนเวลานำเสนอ", icon:"4", html:`
  <div class="eyebrow">12.3.1 · Timing Planner</div><h2 class="title">วางแผนเวลานำเสนอให้พอดี</h2>
  <p class="lead">นำเสนอเกินเวลาคือปัญหาที่พบบ่อยสุด — ใส่เวลารวมที่มี ระบบจะแบ่งเวลาแต่ละช่วงให้ตามสัดส่วนที่เหมาะ</p>
  <div class="lab">
    <div class="labh">⏱ ตัวจัดสรรเวลานำเสนอ <span class="badge">ปรับเวลารวม</span></div>
    <div class="ctrlrow"><span class="ci"><b>เวลารวม (นาที)</b> <input class="numin" style="width:60px" id="ptMin" type="number" min="3" max="60" value="10"></span></div>
    <div id="ptRes"></div>
  </div>
  <div class="callout tip"><b>เผื่อเวลา Q&amp;A:</b> กันเวลาไว้ตอบคำถาม ~20% เสมอ และซ้อมจับเวลาจริงอย่างน้อย 1 รอบก่อนวันนำเสนอ</div>
`},
{ id:"c12-rubric", part:"", group:"บทที่ 12 · จัดทำและนำเสนอโครงงาน", nav:"12.3 ประเมินด้วย Rubric", icon:"5", html:`
  <div class="eyebrow">12.6 · Rubric</div><h2 class="title">เกณฑ์การประเมิน (Rubric) — ลองประเมินตนเอง</h2>
  <p class="lead">กดเลือกระดับของแต่ละเกณฑ์ ระบบรวมคะแนนและบอกระดับผลงานให้ — ใช้ประเมินตนเองก่อนนำเสนอจริง</p>
  <div class="lab">
    <div class="labh">📊 Rubric ประเมินโครงงาน (5 เกณฑ์ × 4 ระดับ) <span class="badge">กดเลือกระดับ</span></div>
    <div class="vizwrap"><table class="rubric" id="rubTab"></table></div>
    <div id="rubRes" class="res" style="margin-top:12px"></div>
  </div>
  <h3>รากฐานทฤษฎี: วงจรการเรียนรู้เชิงสะท้อนคิด</h3>
  <div class="grid c2">
    <div class="card"><h4>Kolb — วงจรการเรียนรู้จากประสบการณ์ (1984)</h4><p>ประสบการณ์รูปธรรม → การสะท้อนคิด (Reflective Observation) → การสร้างมโนทัศน์ → การทดลองปฏิบัติ แล้ววนซ้ำ — เรียนรู้จริงจากการ "ทำแล้วคิดทบทวน"</p></div>
    <div class="card"><h4>Gibbs — วงจรสะท้อนคิด (1988)</h4><p>บรรยายเหตุการณ์ → ความรู้สึก → ประเมิน → วิเคราะห์ → สรุป → วางแผนปฏิบัติครั้งต่อไป — ใช้เป็นกรอบเขียน Reflection ท้ายโครงงานได้ดี</p></div>
  </div>
  <div class="callout tip"><b>การสะท้อนการเรียนรู้ (Reflection):</b> การทบทวนอย่างเป็นระบบเมื่อจบโครงงานช่วยให้ผู้เรียนตระหนักถึงสิ่งที่ได้เรียนรู้และแนวทางพัฒนาตนเอง อันเป็นหัวใจของการเรียนรู้แบบเน้นผลลัพธ์ (Outcome-Based Education) ตามที่ระบุใน มคอ.3</div>
`},
{ id:"c12-case", part:"", group:"บทที่ 12 · จัดทำและนำเสนอโครงงาน", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: นำเสนอโครงงาน "แพลตฟอร์มจองคิว"</h2>
  <div class="grid c2">
    <div class="card"><h4>เล่มรายงาน + สไลด์</h4><p>จัดทำตามโครงสร้างมาตรฐาน + สไลด์ Canva อ่านง่าย มีภาพประกอบ (หนึ่งสไลด์หนึ่งประเด็น)</p></div>
    <div class="card"><h4>นำเสนอ 2 รอบ</h4><p>ความก้าวหน้าสัปดาห์ที่ 9 · ฉบับสมบูรณ์สัปดาห์ที่ 15–16 พร้อมสะท้อนการเรียนรู้</p></div>
  </div>
  <div class="callout ok"><b>ยึดจริยธรรม:</b> อ้างอิงแหล่งข้อมูลถูกต้อง และประเมินผลงานเทียบ Rubric ของรายวิชา</div>
  <div class="callout act"><span class="tag">ปิดท้าย</span><b>(10 นาที)</b> ให้แต่ละกลุ่มใช้ Rubric (หน้า 12.3) ประเมินตนเอง แล้วระบุ 1 เกณฑ์ที่จะพัฒนาก่อนนำเสนอจริง</div>
`},
{ id:"c12-sum", part:"", group:"บทที่ 12 · จัดทำและนำเสนอโครงงาน", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 12 · ปิดเล่ม</h2>
  <ul class="clean">
    <li><b>เล่มรายงาน</b> ตามโครงสร้างมาตรฐาน ลำดับชัด มีหลักฐาน</li>
    <li><b>นำเสนอมืออาชีพ</b> + One Idea per Slide + ฝึกซ้อม</li>
    <li><b>จริยธรรมวิชาการ</b> — อ้างอิงถูกต้อง ไม่ลอก เคารพลิขสิทธิ์/ข้อมูลส่วนบุคคล</li>
    <li><b>Rubric + Reflection</b> ประเมินและสะท้อนการเรียนรู้</li>
  </ul>
  <div class="callout ok"><b>จบครบ 12 บท 🎉</b> ตั้งแต่เข้าใจโครงการ → ริเริ่ม → วางแผน → ดำเนินการ → ปิดและนำเสนอ — ครบวงจรการบริหารโครงงานธุรกิจสมัยใหม่</div>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>โครงสร้างเล่มรายงานโครงงานควรประกอบด้วยส่วนใดบ้าง</li>
    <li>หลักการนำเสนอผลงานอย่างมืออาชีพมีอะไรบ้าง</li>
    <li>หลัก One Idea per Slide ช่วยการนำเสนออย่างไร</li>
    <li>เหตุใดจริยธรรมการอ้างอิงจึงสำคัญต่อผลงานวิชาการ</li>
    <li>ออกแบบโครงร่างสไลด์นำเสนอโครงงานกลุ่มท่าน 8–10 สไลด์</li>
    <li>ทบทวนเกณฑ์ Rubric ของรายวิชา แล้วประเมินตนเองว่าผลงานกลุ่มอยู่ในระดับใด</li>
    <li>เขียน Reflection สั้น ๆ เกี่ยวกับสิ่งที่ทีมเรียนรู้จากการทำโครงงาน</li>
  </ol>
`},
{ id:"c12-gloss", part:"", group:"บทที่ 12 · จัดทำและนำเสนอโครงงาน", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 12</h2>
  <div class="gdef">
    <div class="gitem"><b>โครงสร้างรายงาน</b><span>ลำดับส่วนประกอบมาตรฐานของเล่มรายงานโครงงาน</span></div>
    <div class="gitem"><b>Plagiarism</b><span>การคัดลอกผลงานผู้อื่นโดยไม่อ้างอิง ถือเป็นการผิดจริยธรรม</span></div>
    <div class="gitem"><b>One Idea per Slide</b><span>หลักการนำเสนอหนึ่งประเด็นต่อหนึ่งสไลด์</span></div>
    <div class="gitem"><b>Rubric</b><span>เกณฑ์การให้คะแนนที่ระบุระดับคุณภาพของผลงาน</span></div>

  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management.</i> · PMI. <i>PMBOK Guide.</i></div>

{ id:"glossary", part:"", group:"ภาคผนวก", nav:"ก · อภิธานศัพท์รวม", icon:"ก", html:`
  <div class="eyebrow">ภาคผนวก ก · Glossary</div><h2 class="title">อภิธานศัพท์รวม (12 บท)</h2>
  <p class="lead">รวมศัพท์และแนวคิดสำคัญจากทั้ง 12 บท เรียงตามลำดับบท</p>
  <h3>ส่วนที่ 1 · พื้นฐาน (บท 1–2)</h3>
  <div class="gdef">
    <div class="gitem"><b>โครงการ (Project)</b><span>ความพยายามชั่วคราวเพื่อสร้างผลลัพธ์เฉพาะตัวภายใต้ข้อจำกัด</span></div>
    <div class="gitem"><b>Triple Constraint</b><span>สามเหลี่ยมข้อจำกัด: ขอบเขต เวลา ต้นทุน โดยมีคุณภาพเป็นแกนกลาง</span></div>
    <div class="gitem"><b>Progressive Elaboration</b><span>พัฒนารายละเอียดให้ชัดขึ้นตามความก้าวหน้า</span></div>
    <div class="gitem"><b>Project Life Cycle / Process Groups</b><span>ลำดับช่วงงาน 5 เฟส และกลุ่มกระบวนการบริหาร 5 กลุ่ม</span></div>
    <div class="gitem"><b>Stage Gate · Scope Creep</b><span>จุดตัดสินใจระหว่างเฟส · การขยายขอบเขตงานโดยไม่ควบคุม</span></div>
  </div>
  <h3>ส่วนที่ 2 · ริเริ่มโครงการ (บท 3–6)</h3>
  <div class="gdef">
    <div class="gitem"><b>Feasibility Study</b><span>การศึกษาความเป็นไปได้ 4 ด้าน: ตลาด เทคนิค การเงิน การจัดการ</span></div>
    <div class="gitem"><b>Payback Period · NPV · Business Case</b><span>เครื่องมือประเมินความคุ้มค่าและเอกสารสรุปเหตุผลการลงทุน</span></div>
    <div class="gitem"><b>Power–Interest Grid</b><span>จัดกลุ่มผู้มีส่วนได้ส่วนเสียตามอำนาจและความสนใจ</span></div>
    <div class="gitem"><b>Tuckman Model · RACI</b><span>พัฒนาการทีม 4 ขั้น · การกำหนดบทบาท R/A/C/I</span></div>
    <div class="gitem"><b>Project Charter · SMART</b><span>เอกสารอนุมัติโครงการ · หลักตั้งวัตถุประสงค์ที่วัดผลได้</span></div>
  </div>
  <h3>ส่วนที่ 3 · วางแผนโครงการ (บท 7–9)</h3>
  <div class="gdef">
    <div class="gitem"><b>WBS · Work Package</b><span>โครงสร้างจำแนกงานตามลำดับชั้น ยึดกฎ 100%</span></div>
    <div class="gitem"><b>Critical Path · Milestone</b><span>เส้นทางงานที่ล่าช้าไม่ได้ · จุดสำคัญติดตามความก้าวหน้า</span></div>
    <div class="gitem"><b>Kanban · Baseline · Overallocation</b><span>บอร์ดสถานะงาน · แผนฐานเทียบผลจริง · จัดสรรทรัพยากรเกินกำลัง</span></div>
    <div class="gitem"><b>Break-even · ROI · Contingency Reserve</b><span>จุดคุ้มทุน · ผลตอบแทนการลงทุน · งบสำรอง</span></div>
  </div>
  <h3>ส่วนที่ 4 · ดำเนินการ / ปิดโครงการ (บท 10–12)</h3>
  <div class="gdef">
    <div class="gitem"><b>KPI · Quality by Design</b><span>ตัวชี้วัดความสำเร็จ · ออกแบบคุณภาพตั้งแต่ต้น</span></div>
    <div class="gitem"><b>Risk Management</b><span>ระบุ ประเมิน รับมือ (Avoid/Mitigate/Transfer/Accept)</span></div>
    <div class="gitem"><b>Communication Plan · Lessons Learned</b><span>แผนการสื่อสาร · การถอดบทเรียนเพื่อพัฒนางานในอนาคต</span></div>
    <div class="gitem"><b>Rubric · One Idea per Slide · Plagiarism</b><span>เกณฑ์ให้คะแนน · หนึ่งสไลด์หนึ่งประเด็น · การคัดลอกผิดจริยธรรม</span></div>
  </div>
  <div class="callout tip" style="margin-top:16px"><b>หมายเหตุ:</b> ศัพท์ฉบับเต็มพร้อมคำอธิบายละเอียดปรากฏในหน้า "ศัพท์สำคัญ & อ้างอิง" ท้ายแต่ละบท</div>
`},
{ id:"apx-formula", part:"", group:"ภาคผนวก", nav:"ข · รวมสูตรสำคัญ", icon:"ข", html:`
  <div class="eyebrow">ภาคผนวก ข · Formula Reference</div><h2 class="title">รวมสูตรสำคัญที่ใช้ในรายวิชา</h2>
  <p class="lead">สูตรและตัวชี้วัดที่ใช้ในเครื่องมือคำนวณตลอดทั้งเล่ม จัดกลุ่มตามด้าน</p>
  <h3>ด้านการเงินและความคุ้มค่า (บท 3, 9)</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">ตัวชี้วัด</th><th style="background:var(--blue)">สูตร</th><th style="background:var(--teal)">การแปลผล</th></tr></thead>
    <tbody>
      <tr><td>ระยะเวลาคืนทุน (Payback Period)</td><td>เงินลงทุน ÷ กระแสเงินสดสุทธิต่อปี</td><td>ยิ่งสั้นยิ่งคืนทุนเร็ว</td></tr>
      <tr><td>มูลค่าปัจจุบันสุทธิ (NPV)</td><td>Σ [ CF<sub>t</sub> ÷ (1 + r)<sup>t</sup> ] − เงินลงทุน</td><td>NPV &gt; 0 = คุ้มค่าลงทุน</td></tr>
      <tr><td>อัตราผลตอบแทนภายใน (IRR)</td><td>อัตราคิดลด r ที่ทำให้ NPV = 0</td><td>IRR &gt; ต้นทุนของเงินทุน = ควรลงทุน</td></tr>
      <tr><td>อัตราส่วนผลประโยชน์ต่อต้นทุน (BCR)</td><td>มูลค่าปัจจุบันของผลประโยชน์ ÷ เงินลงทุน</td><td>BCR &gt; 1 = คุ้มค่า</td></tr>
      <tr><td>จุดคุ้มทุน (Break-even, หน่วย)</td><td>ต้นทุนคงที่ ÷ (ราคาขาย − ต้นทุนผันแปรต่อหน่วย)</td><td>ต้องขายเกินจุดนี้จึงมีกำไร</td></tr>
      <tr><td>ผลตอบแทนการลงทุน (ROI)</td><td>(กำไรสุทธิ ÷ เงินลงทุน) × 100%</td><td>ยิ่งสูงยิ่งคุ้ม</td></tr>
    </tbody>
  </table></div>
  <h3>ด้านตารางเวลา (บท 7)</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">ตัวชี้วัด</th><th style="background:var(--blue)">สูตร</th><th style="background:var(--teal)">หมายเหตุ</th></tr></thead>
    <tbody>
      <tr><td>เวลาคาดหวัง (PERT: t<sub>e</sub>)</td><td>(t<sub>o</sub> + 4t<sub>m</sub> + t<sub>p</sub>) ÷ 6</td><td>ถ่วงน้ำหนักค่ากลาง 4 เท่า</td></tr>
      <tr><td>ความแปรปรวน (PERT: σ²)</td><td>[ (t<sub>p</sub> − t<sub>o</sub>) ÷ 6 ]²</td><td>ยิ่งช่วงกว้างยิ่งไม่แน่นอน</td></tr>
      <tr><td>เวลาสำรองรวม (Total Float)</td><td>LS − ES = LF − EF</td><td>Float = 0 → งานวิกฤต</td></tr>
    </tbody>
  </table></div>
  <h3>ด้านการติดตามและควบคุม (บท 9, 10, 11)</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">ตัวชี้วัด</th><th style="background:var(--blue)">สูตร</th><th style="background:var(--teal)">การแปลผล</th></tr></thead>
    <tbody>
      <tr><td>ผลต่างต้นทุน (Cost Variance: CV)</td><td>EV − AC</td><td>บวก = ประหยัดงบ</td></tr>
      <tr><td>ผลต่างเวลา (Schedule Variance: SV)</td><td>EV − PV</td><td>บวก = เร็วกว่าแผน</td></tr>
      <tr><td>ดัชนีต้นทุน (CPI)</td><td>EV ÷ AC</td><td>≥ 1 = คุมงบได้ดี</td></tr>
      <tr><td>ดัชนีเวลา (SPI)</td><td>EV ÷ PV</td><td>≥ 1 = ตามหรือเร็วกว่าแผน</td></tr>
      <tr><td>ประมาณงบตอนจบ (EAC)</td><td>BAC ÷ CPI</td><td>เทียบกับ BAC ว่าจะบานปลายไหม</td></tr>
      <tr><td>มูลค่าคาดหวังของความเสี่ยง (EMV)</td><td>โอกาสเกิด (%) × ผลกระทบ (บาท)</td><td>ใช้จัดลำดับความเสี่ยงเชิงปริมาณ</td></tr>
      <tr><td>จำนวนช่องทางการสื่อสาร</td><td>n(n − 1) ÷ 2</td><td>n = จำนวนคน; เพิ่มแบบทวีคูณ</td></tr>
    </tbody>
  </table></div>
  <div class="callout info"><b>สัญลักษณ์:</b> CF = กระแสเงินสด · r = อัตราคิดลด · t = ปีที่ · PV = มูลค่างานตามแผน · EV = มูลค่างานที่ทำได้จริง · AC = ต้นทุนจริง · BAC = งบประมาณรวมของโครงการ · ES/EF/LS/LF = เวลาเริ่ม/เสร็จ เร็วสุด/ช้าสุด</div>
`},
{ id:"apx-template", part:"", group:"ภาคผนวก", nav:"ค · แม่แบบเอกสาร", icon:"ค", html:`
  <div class="eyebrow">ภาคผนวก ค · Templates</div><h2 class="title">แม่แบบเอกสารบริหารโครงการ</h2>
  <p class="lead">องค์ประกอบหลักของเอกสารสำคัญที่ผู้เรียนควรจัดทำในโครงงาน (หลายรายการมีแบบกดกรอก/โต้ตอบในบทที่ระบุ)</p>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">เอกสาร</th><th style="background:var(--blue)">องค์ประกอบหลัก</th><th style="background:var(--teal)">บท</th></tr></thead>
    <tbody>
      <tr><td>ใบอนุมัติโครงการ (Project Charter)</td><td>ที่มา/เหตุผล · วัตถุประสงค์ SMART · ขอบเขต · ผลงานส่งมอบ · งบประมาณ/กรอบเวลา · เกณฑ์ความสำเร็จ · สมมติฐาน/ข้อจำกัด</td><td>6</td></tr>
      <tr><td>ทะเบียนผู้มีส่วนได้ส่วนเสีย</td><td>ผู้เกี่ยวข้อง · ประเภท · อำนาจ · ความสนใจ · ความคาดหวัง · กลยุทธ์การมีส่วนร่วม</td><td>4</td></tr>
      <tr><td>โครงสร้างจำแนกงาน (WBS)</td><td>โครงการ (L0) → งานหลัก (L1) → งานย่อย → Work Package พร้อมรหัส (1, 1.1, 1.1.1)</td><td>7</td></tr>
      <tr><td>ตารางกำหนดบทบาท (RACI)</td><td>งาน × บทบาท → R (ทำ) / A (รับผิดชอบ) / C (ปรึกษา) / I (รับทราบ)</td><td>5</td></tr>
      <tr><td>ทะเบียนความเสี่ยง (Risk Register)</td><td>ความเสี่ยง · โอกาส · ผลกระทบ · ระดับ · แนวทางรับมือ · ผู้รับผิดชอบ</td><td>10</td></tr>
      <tr><td>แผนการสื่อสาร</td><td>ผู้รับสาร · เนื้อหา · รูปแบบ/ช่องทาง · ความถี่ · ผู้รับผิดชอบ</td><td>11</td></tr>
      <tr><td>รายงานสถานะรายสัปดาห์</td><td>สถานะเทียบแผน · งานที่เสร็จ/ค้าง · ความเสี่ยง · สิ่งที่ต้องการสนับสนุน</td><td>11</td></tr>
      <tr><td>เกณฑ์การประเมิน (Rubric)</td><td>เกณฑ์ × ระดับคุณภาพ (1–4) พร้อมคำบรรยายแต่ละระดับ</td><td>12</td></tr>
    </tbody>
  </table></div>
  <div class="callout ok"><b>ลำดับการจัดทำเอกสารตลอดโครงงาน:</b> Business Case (บท 3) → Project Charter (บท 6) → WBS + ตารางเวลา + งบประมาณ (บท 7–9) → ทะเบียนความเสี่ยง/แผนสื่อสาร (บท 10–11) → เล่มรายงาน + การนำเสนอ (บท 12)</div>
`},
{ id:"apx-standard", part:"", group:"ภาคผนวก", nav:"ง · มาตรฐานและกรอบสากล", icon:"ง", html:`
  <div class="eyebrow">ภาคผนวก ง · Standards &amp; Frameworks</div><h2 class="title">มาตรฐานและกรอบสากลด้านการบริหารโครงการ</h2>
  <p class="lead">กรอบอ้างอิงที่เนื้อหาในตำรานี้ยึดถือ ผู้เรียนควรทราบชื่อและขอบเขตเพื่อการศึกษาต่อยอด</p>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">มาตรฐาน/กรอบ</th><th style="background:var(--blue)">องค์กร/ที่มา</th><th style="background:var(--teal)">สาระสำคัญ</th></tr></thead>
    <tbody>
      <tr><td>PMBOK Guide</td><td>Project Management Institute (PMI), สหรัฐฯ</td><td>องค์ความรู้การบริหารโครงการ ฉบับที่ 7 (2021) เน้นหลักการและขอบเขตการทำงาน (Performance Domains)</td></tr>
      <tr><td>ISO 21500 / 21502</td><td>องค์การระหว่างประเทศว่าด้วยการมาตรฐาน (ISO)</td><td>แนวทางการบริหารโครงการที่เป็นสากล</td></tr>
      <tr><td>PRINCE2</td><td>AXELOS, สหราชอาณาจักร</td><td>ระเบียบวิธีบริหารโครงการที่เน้นกระบวนการและการควบคุมเป็นขั้นตอน</td></tr>
      <tr><td>Agile / Scrum</td><td>Agile Manifesto (2001)</td><td>แนวทางทำงานเป็นรอบสั้น ปรับตัวตามผลตอบรับ</td></tr>
      <tr><td>ISO 9001 / TQM</td><td>ISO</td><td>ระบบบริหารคุณภาพและการบริหารคุณภาพทั่วทั้งองค์กร</td></tr>
      <tr><td>ISO 31000</td><td>ISO</td><td>หลักการและแนวทางการบริหารความเสี่ยง</td></tr>
      <tr><td>ANSI/EIA-748</td><td>สหรัฐฯ</td><td>มาตรฐานการจัดการมูลค่าที่ได้ (Earned Value Management)</td></tr>
    </tbody>
  </table></div>
  <div class="callout info"><b>สำหรับโครงงานนิสิต:</b> ไม่จำเป็นต้องยึดมาตรฐานใดอย่างเคร่งครัด แต่ควรประยุกต์หลักการสากลที่เป็นแก่น ได้แก่ การกำหนดเป้าหมาย/ขอบเขตชัดเจน การวางแผนเป็นระบบ การติดตามความก้าวหน้า และการปรับปรุงอย่างต่อเนื่อง</div>
`},
{ id:"apx-theorist", part:"", group:"ภาคผนวก", nav:"จ · นักคิดและทฤษฎีสำคัญ", icon:"จ", html:`
  <div class="eyebrow">ภาคผนวก จ · Key Theorists</div><h2 class="title">นักคิดและทฤษฎีสำคัญ (เรียงตามยุค)</h2>
  <p class="lead">รากฐานทางวิชาการของแนวคิดที่ปรากฏในรายวิชา เพื่อให้ผู้เรียนสืบค้นต้นทางองค์ความรู้ได้</p>
  <div class="gdef">
    <div class="gitem"><b>Henry Gantt (ราว ค.ศ. 1910)</b><span>แผนภูมิแกนต์ (Gantt Chart) — เครื่องมือแสดงตารางเวลาที่ใช้จนปัจจุบัน (บท 7)</span></div>
    <div class="gitem"><b>A. Maslow (1943) · F. Herzberg (1959) · D. McGregor (1960)</b><span>ทฤษฎีแรงจูงใจ: ลำดับขั้นความต้องการ · สองปัจจัย · Theory X/Y (บท 5)</span></div>
    <div class="gitem"><b>C. E. Shannon &amp; W. Weaver (1949)</b><span>แบบจำลองการสื่อสาร (ผู้ส่ง–สาร–ช่องทาง–ผู้รับ–สิ่งรบกวน) (บท 11)</span></div>
    <div class="gitem"><b>US Navy (1958) · Kelley &amp; Walker (1959)</b><span>เทคนิค PERT และวิธีวิถีวิกฤต (CPM) สำหรับตารางเวลาแบบเครือข่าย (บท 7)</span></div>
    <div class="gitem"><b>B. W. Tuckman (1965, 1977)</b><span>ขั้นพัฒนาการของทีม 5 ขั้น: Forming–Storming–Norming–Performing–Adjourning (บท 5)</span></div>
    <div class="gitem"><b>T. Ohno — Toyota Production System</b><span>แนวคิดลีนและระบบคัมบัง (Kanban) แบบทันเวลาพอดี (บท 8)</span></div>
    <div class="gitem"><b>W. E. Deming · J. M. Juran · P. B. Crosby</b><span>ปรมาจารย์ด้านคุณภาพ: PDCA/14 ประการ · Quality Trilogy · Zero Defects (บท 10)</span></div>
    <div class="gitem"><b>K. Thomas &amp; R. Kilmann · P. Hersey &amp; K. Blanchard</b><span>การจัดการความขัดแย้ง 5 แบบ · ภาวะผู้นำตามสถานการณ์ (บท 5)</span></div>
    <div class="gitem"><b>G. T. Doran (1981)</b><span>หลักการตั้งวัตถุประสงค์แบบ SMART (บท 6)</span></div>
    <div class="gitem"><b>D. A. Kolb (1984) · G. Gibbs (1988)</b><span>วงจรการเรียนรู้จากประสบการณ์และการสะท้อนคิด (บท 12)</span></div>
    <div class="gitem"><b>R. E. Freeman (1984) · Mendelow (1991) · Mitchell, Agle &amp; Wood (1997)</b><span>ทฤษฎีผู้มีส่วนได้ส่วนเสีย · กริดอำนาจ-ความสนใจ · แบบจำลอง Salience (บท 4)</span></div>
    <div class="gitem"><b>E. H. Schein · R. M. Belbin</b><span>วัฒนธรรมองค์กร 3 ระดับ · บทบาทในทีม 9 แบบ (บท 5)</span></div>
    <div class="gitem"><b>P. M. Senge (1990)</b><span>แนวคิดองค์กรแห่งการเรียนรู้ (The Learning Organization) (บท 11)</span></div>
  </div>
`},
{ id:"apx-biblio", part:"", group:"ภาคผนวก", nav:"ฉ · บรรณานุกรมรวม", icon:"ฉ", html:`
  <div class="eyebrow">ภาคผนวก ฉ · Bibliography</div><h2 class="title">บรรณานุกรมรวม</h2>
  <p class="lead">รายการอ้างอิงหลักของรายวิชา จัดเรียงตามภาษา (รูปแบบใกล้เคียง APA)</p>
  <h3>ภาษาไทย</h3>
  <div class="callout info" style="font-size:13.5px">บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ (Project Planning and Management).</i> กรุงเทพฯ: อมรินทร์.<br>วิสูตร จิระดำเกิง. <i>การบริหารโครงการ: แนวทางปฏิบัติจริง.</i> กรุงเทพฯ: ซีเอ็ดยูเคชั่น.</div>
  <h3>ภาษาอังกฤษ</h3>
  <div class="callout info" style="font-size:13.5px">
    Crosby, P. B. (1979). <i>Quality is Free.</i> McGraw-Hill.<br>
    Deming, W. E. (1986). <i>Out of the Crisis.</i> MIT Press.<br>
    Freeman, R. E. (1984). <i>Strategic Management: A Stakeholder Approach.</i> Pitman.<br>
    Gibbs, G. (1988). <i>Learning by Doing: A Guide to Teaching and Learning Methods.</i> Oxford.<br>
    Kloppenborg, T. J. <i>Contemporary Project Management.</i> Cengage Learning.<br>
    Kolb, D. A. (1984). <i>Experiential Learning.</i> Prentice-Hall.<br>
    Pinto, J. K. <i>Project Management: Achieving Competitive Advantage.</i> Pearson.<br>
    Project Management Institute. <i>A Guide to the Project Management Body of Knowledge (PMBOK Guide)</i> (7th ed., 2021). PMI.<br>
    Tuckman, B. W. (1965). Developmental sequence in small groups. <i>Psychological Bulletin, 63</i>(6), 384–399.<br>
    International Organization for Standardization. <i>ISO 21502:2020 — Project, programme and portfolio management.</i>
  </div>
  <div class="callout tip"><b>ข้อพึงระวังด้านจริยธรรม:</b> การอ้างอิงที่ถูกต้องและครบถ้วนเป็นหลักความซื่อสัตย์ทางวิชาการ ผู้เรียนต้องระบุแหล่งที่มาของแนวคิดและข้อมูลทุกครั้ง เพื่อหลีกเลี่ยงการคัดลอกผลงาน (Plagiarism)</div>
`},
{ id:"apx-map", part:"", group:"ภาคผนวก", nav:"ช · แผนผังมโนทัศน์รายวิชา", icon:"ช", html:`
  <div class="eyebrow">ภาคผนวก ช · Course Concept Map</div><h2 class="title">แผนผังมโนทัศน์ทั้งรายวิชา</h2>
  <p class="lead">ภาพรวมความเชื่อมโยงของทั้ง 12 บท ตามวงจรชีวิตโครงการ — จาก "เข้าใจโครงการ" สู่ "ส่งมอบและนำเสนอ"</p>
  <div class="cmapbox" style="margin-bottom:14px">
    <h4>ส่วนที่ 1 · พื้นฐาน</h4>
    <div class="cmap"><span class="cnode2">บท1 บทนำ/นิยาม</span><span class="car">→</span><span class="cnode2">บท2 วงจรชีวิต+กระบวนการ</span></div>
  </div>

/* บท 7: CPM engine + Gantt with critical path */
function cpmCompute(tasks){const m={};tasks.forEach(t=>m[t.id]={id:t.id,dur:t.dur,deps:t.deps,es:0,ef:0,ls:0,lf:0,tf:0,crit:false});tasks.forEach(t=>{const n=m[t.id];n.es=t.deps.length?Math.max(...t.deps.map(d=>m[d].ef)):0;n.ef=n.es+n.dur;});const proj=Math.max(...tasks.map(t=>m[t.id].ef));const succ={};tasks.forEach(t=>succ[t.id]=[]);tasks.forEach(t=>t.deps.forEach(d=>succ[d].push(t.id)));[...tasks].reverse().forEach(t=>{const n=m[t.id];const s=succ[t.id];n.lf=s.length?Math.min(...s.map(x=>m[x].ls)):proj;n.ls=n.lf-n.dur;n.tf=n.ls-n.es;n.crit=(n.tf===0);});const path=tasks.filter(t=>m[t.id].crit).map(t=>t.id);return {m,proj,path};}

function renderGantt7(){const host=document.getElementById('gViz7');if(!host)return;const {m,proj,path}=cpmCompute(gTasks7);const W=700,rowH=34,H=gTasks7.length*rowH+30,L=110,R=W-14,span=R-L,x=v=>L+v/proj*span;let s='<svg viewBox="0 0 '+W+' '+H+'"><defs><marker id="g7a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8A90B8"/></marker><marker id="g7c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C0392B"/></marker></defs>';for(let k=0;k<=proj;k++){const gx=x(k);s+='<line x1="'+gx+'" y1="4" x2="'+gx+'" y2="'+(H-18)+'" stroke="#EDECF6"/><text x="'+gx+'" y="'+(H-5)+'" font-size="10" fill="#8A90B8" text-anchor="middle">'+k+'</text>';}const midY={};gTasks7.forEach((t,i)=>{const n=m[t.id],y=8+i*rowH;midY[t.id]=y+11;s+='<text x="4" y="'+(y+15)+'" font-size="11.5" fill="#1E2340" font-weight="700">'+t.id+' '+gNames7[t.id]+'</text>';s+='<rect x="'+x(n.es).toFixed(1)+'" y="'+y+'" width="'+(x(n.ef)-x(n.es)).toFixed(1)+'" height="22" rx="4" fill="'+(n.crit?'#C0392B':'#33569E')+'"/>';s+='<text x="'+((x(n.es)+x(n.ef))/2).toFixed(1)+'" y="'+(y+15)+'" font-size="10" fill="#fff" text-anchor="middle">'+n.dur+'</text>';});gTasks7.forEach(t=>{const n=m[t.id];t.deps.forEach(d=>{const pn=m[d],ex=x(pn.ef),ey=midY[d],sx=x(n.es),sy=midY[t.id],crit=pn.crit&&n.crit;s+='<path d="M '+ex.toFixed(1)+' '+ey+' L '+ex.toFixed(1)+' '+sy+' L '+(sx-3).toFixed(1)+' '+sy+'" fill="none" stroke="'+(crit?'#C0392B':'#8A90B8')+'" stroke-width="'+(crit?2:1.3)+'" marker-end="url(#'+(crit?'g7c':'g7a')+')"/>';});});s+='</svg>';host.innerHTML=s+'<div class="res"><div class="rchip ok">โครงการเสร็จ <b>'+proj+'</b> สัปดาห์</div><div class="rchip crit">เส้นทางวิกฤต <b>'+path.join(' → ')+'</b></div></div>';}

/* บท 7: CPM network (AON) */
const netNames7={A:'วางแผน',B:'ออกแบบ',C:'จัดซื้อ',D:'พัฒนา',E:'ทดสอบ',F:'ส่งมอบ'};
const cpmTasks7=[{id:'A',dur:2,deps:[]},{id:'B',dur:4,deps:['A']},{id:'C',dur:2,deps:['A']},{id:'D',dur:3,deps:['B']},{id:'E',dur:3,deps:['C']},{id:'F',dur:2,deps:['D','E']}];
const CPOS7={A:[6,110],B:[172,20],C:[172,200],D:[338,20],E:[338,200],F:[504,110]};
const NW7=118,MIDY7=38;
function buildCpm7(){const c=document.getElementById('cpmCtrl7');if(!c)return;c.innerHTML=cpmTasks7.map(t=>'<span class="ci">'+t.id+' '+netNames7[t.id]+' <b>Dur</b> <input class="numin" style="width:42px" data-cpm7="'+t.id+'" type="number" min="1" max="20" value="'+t.dur+'"></span>').join('');}
function renderCPM7(){const host=document.getElementById('cpmNet7');if(!host)return;const {m,proj,path}=cpmCompute(cpmTasks7);const edges=[];cpmTasks7.forEach(t=>t.deps.forEach(d=>edges.push([d,t.id])));let svg='<svg viewBox="0 0 640 300"><defs><marker id="c7ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA0C6"/></marker><marker id="c7ahc" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C0392B"/></marker></defs>';edges.forEach(([a,b])=>{const pa=CPOS7[a],pb=CPOS7[b];const x1=pa[0]+NW7,y1=pa[1]+MIDY7,x2=pb[0]-2,y2=pb[1]+MIDY7;const crit=m[a].crit&&m[b].crit,mx=(x1+x2)/2;svg+='<path d="M '+x1+' '+y1+' C '+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+(crit?'#C0392B':'#9AA0C6')+'" stroke-width="'+(crit?2.5:1.5)+'" marker-end="url(#'+(crit?'c7ahc':'c7ah')+')"/>';});svg+='</svg>';let nodes='';cpmTasks7.forEach(t=>{const n=m[t.id],p=CPOS7[t.id];nodes+='<div class="cnode'+(n.crit?' crit':'')+'" style="left:'+p[0]+'px;top:'+p[1]+'px"><div class="cid">'+t.id+' '+netNames7[t.id]+(n.crit?' ★':'')+'</div><div class="crow"><div class="ccell"><span class="k">ES</span>'+n.es+'</div><div class="ccell mid"><span class="k">Dur</span>'+n.dur+'</div><div class="ccell"><span class="k">EF</span>'+n.ef+'</div></div><div class="crow"><div class="ccell"><span class="k">LS</span>'+n.ls+'</div><div class="ccell mid"><span class="k">TF</span>'+n.tf+'</div><div class="ccell"><span class="k">LF</span>'+n.lf+'</div></div></div>';});host.innerHTML=svg+nodes;const r=document.getElementById('cpmRes7');if(r)r.innerHTML='<div class="rchip ok">ระยะเวลาโครงการ <b>'+proj+'</b> หน่วย</div><div class="rchip crit">เส้นทางวิกฤต <b>'+path.join(' → ')+'</b></div>';}
/* บท 7: PDM lag */
let pdmType7='FS';
function renderPDM7(){const barA=document.getElementById('barA'),barB=document.getElementById('barB');if(!barA)return;const unit=32,Ad=4,Bd=3,lag=+document.getElementById('lagRange').value;document.getElementById('lagVal').textContent=lag;const As=0,Ae=Ad;let bStart=0;if(pdmType7==='FS')bStart=Ae+lag;else if(pdmType7==='SS')bStart=As+lag;else if(pdmType7==='FF')bStart=Ae+lag-Bd;else if(pdmType7==='SF')bStart=As+lag-Bd;if(bStart<0)bStart=0;barA.style.left=(As*unit+4)+'px';barA.style.width=(Ad*unit)+'px';barB.style.left=(bStart*unit+4)+'px';barB.style.width=(Bd*unit)+'px';const desc={FS:'<b>Finish-to-Start:</b> B เริ่มหลัง A เสร็จ (ใช้บ่อยที่สุด)',SS:'<b>Start-to-Start:</b> B เริ่มหลัง A เริ่ม (ทำคู่ขนาน)',FF:'<b>Finish-to-Finish:</b> B เสร็จหลัง A เสร็จ',SF:'<b>Start-to-Finish:</b> B เสร็จหลัง A เริ่ม (หายาก)'};document.getElementById('pdmDesc').innerHTML=desc[pdmType7];}
/* บท 7: PERT */
const pertData7=[{o:2,m:4,p:8},{o:3,m:5,p:10},{o:4,m:6,p:14}];
function ncdf7(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function buildPert7(){const tb=document.getElementById('pertTable7');if(!tb)return;let rows='<tr><th>งาน</th><th>to</th><th>tm</th><th>tp</th><th>te</th><th>σ²</th></tr>';pertData7.forEach((a,i)=>{rows+='<tr><td><b>'+(i+1)+'</b></td><td><input class="numin" style="width:44px" data-pert7="'+i+'-o" type="number" min="0" value="'+a.o+'"></td><td><input class="numin" style="width:44px" data-pert7="'+i+'-m" type="number" min="0" value="'+a.m+'"></td><td><input class="numin" style="width:44px" data-pert7="'+i+'-p" type="number" min="0" value="'+a.p+'"></td><td id="pte7-'+i+'">–</td><td id="pv7-'+i+'">–</td></tr>';});tb.innerHTML=rows;}
function updatePert7(){if(!document.getElementById('pertTable7'))return;let Te=0,Var=0;pertData7.forEach((a,i)=>{const te=(a.o+4*a.m+a.p)/6,v=Math.pow((a.p-a.o)/6,2);Te+=te;Var+=v;document.getElementById('pte7-'+i).textContent=te.toFixed(2);document.getElementById('pv7-'+i).textContent=v.toFixed(2);});const SD=Math.sqrt(Var);document.getElementById('pertRes7').innerHTML='<div class="rchip">Te (เวลารวมคาดหวัง) <b>'+Te.toFixed(2)+'</b></div><div class="rchip">Σσ² <b>'+Var.toFixed(2)+'</b></div><div class="rchip">SD <b>'+SD.toFixed(2)+'</b></div>';const T=+document.getElementById('pertT7').value;const Z=SD>0?(T-Te)/SD:0,P=ncdf7(Z)*100;document.getElementById('pertProb7').innerHTML='<div class="rchip">Z = (T−Te)/SD <b>'+Z.toFixed(2)+'</b></div><div class="rchip '+(P>=50?'ok':'crit')+'">โอกาสเสร็จภายใน '+T+' หน่วย <b>'+P.toFixed(1)+'%</b></div>';const need=(Te+1.65*SD).toFixed(1);document.getElementById('pertInterp7').innerHTML='ถ้าต้องการความมั่นใจ ~95% ควรเผื่อเวลาถึง ≈ <b>'+need+'</b> หน่วย (Te + 1.65×SD)';drawBell7(Te,SD,T);}
function drawBell7(Te,SD,T){const svg=document.getElementById('pertBell7');if(!svg||SD<=0)return;const W=440,H=130,pad=12,x0=Te-3.2*SD,x1=Te+3.2*SD,yb=H-18,peak=12,sx=x=>pad+(x-x0)/(x1-x0)*(W-2*pad);let d='';for(let i=0;i<=120;i++){const x=x0+(x1-x0)*i/120,y=yb-(yb-peak)*Math.exp(-Math.pow((x-Te)/SD,2)/2);d+=(i?' L ':'M ')+sx(x).toFixed(1)+' '+y.toFixed(1);}const Tc=Math.max(x0,Math.min(T,x1));let area='M '+sx(x0).toFixed(1)+' '+yb;for(let i=0;i<=120;i++){const x=x0+(Tc-x0)*i/120,y=yb-(yb-peak)*Math.exp(-Math.pow((x-Te)/SD,2)/2);area+=' L '+sx(x).toFixed(1)+' '+y.toFixed(1);}area+=' L '+sx(Tc).toFixed(1)+' '+yb+' Z';svg.innerHTML='<path d="'+area+'" fill="rgba(46,139,114,.28)"/><path d="'+d+'" fill="none" stroke="#33569E" stroke-width="2"/><line x1="'+sx(Te).toFixed(1)+'" y1="'+peak+'" x2="'+sx(Te).toFixed(1)+'" y2="'+yb+'" stroke="#5C6285" stroke-dasharray="3"/><line x1="'+sx(Tc).toFixed(1)+'" y1="16" x2="'+sx(Tc).toFixed(1)+'" y2="'+yb+'" stroke="#C0392B" stroke-width="1.5"/><line x1="'+pad+'" y1="'+yb+'" x2="'+(W-pad)+'" y2="'+yb+'" stroke="#E0DFEF"/><text x="'+sx(Te).toFixed(1)+'" y="'+(yb+14)+'" font-size="10" fill="#5C6285" text-anchor="middle">Te='+Te.toFixed(1)+'</text><text x="'+sx(Tc).toFixed(1)+'" y="12" font-size="10" fill="#C0392B" text-anchor="middle">T='+T+'</text>';}

function buildOpsQuiz(){const q=document.getElementById('opsQuiz');if(!q)return;q.innerHTML=opsQ.map((it,i)=>'<div class="quizrow" data-qr="'+i+'"><span class="qitem">'+it.t+'</span><span class="qbtns"><button class="qb" data-oq="'+i+'-project">โครงการ</button><button class="qb" data-oq="'+i+'-ops">งานประจำ</button></span><span class="fb"></span></div>').join('');updateOpsRes();}
function answerOps(i,ans){const row=document.querySelector('#opsQuiz .quizrow[data-qr="'+i+'"]');if(!row)return;const ok=opsQ[i].a===ans;row.classList.remove('correct','wrong');row.classList.add(ok?'correct':'wrong');row.querySelectorAll('.qb').forEach(b=>b.classList.toggle('sel',b.dataset.oq===i+'-'+ans));row.querySelector('.fb').textContent=ok?'✓ ถูกต้อง':'✗ ลองใหม่';opsQ[i].done=ok;updateOpsRes();}
function updateOpsRes(){const n=opsQ.filter(x=>x.done).length;const r=document.getElementById('opsQuizRes');if(r)r.innerHTML='<div class="rchip '+(n===opsQ.length?'ok':'')+'">ตอบถูก <b>'+n+'</b>/'+opsQ.length+(n===opsQ.length?' 🎉':'')+'</div>';}

content.addEventListener('input',e=>{const el=e.target;if(el.id==='pbInv'||el.id==='pbCf')renderPayback();else if(el.dataset.sc){const p=el.dataset.sc.split('-');let v=parseInt(el.value);if(isNaN(v))return;v=Math.max(1,Math.min(5,v));scItems[+p[0]].s[+p[1]]=v;renderScore();}else if(el.dataset.ch){renderCharter();}else if(el.dataset.g7){const t=gTasks7.find(x=>x.id===el.dataset.g7);const v=parseInt(el.value);if(v>=1){t.dur=v;renderGantt7();}}else if(el.dataset.cpm7){const t=cpmTasks7.find(x=>x.id===el.dataset.cpm7);const v=parseInt(el.value);if(v>=1){t.dur=v;renderCPM7();}}else if(el.id==='lagRange')renderPDM7();else if(el.dataset.pert7){const p=el.dataset.pert7.split('-');const v=parseFloat(el.value);if(!isNaN(v)){pertData7[+p[0]][p[1]]=v;updatePert7();}}else if(el.id==='pertT7')updatePert7();else if(el.id==='beFix'||el.id==='bePrice'||el.id==='beVar')renderBreakeven();else if(el.id==='roiProfit'||el.id==='roiInv')renderROI();else if(el.id==='npvInv'||el.id==='npvCf'||el.id==='npvN'||el.id==='npvR')renderNPV();else if(el.id==='evmPV'||el.id==='evmEV'||el.id==='evmAC'||el.id==='evmBAC')renderEVM();else if(el.id==='commN')renderComm();else if(el.id==='ptMin')renderPT();});
/* ===== presenter controls ===== */
const sb=document.getElementById('sidebar'),bd=document.getElementById('backdrop');
document.getElementById('menuToggle').onclick=()=>{sb.classList.add('open');bd.classList.add('show');};
bd.onclick=closeMenu;function closeMenu(){sb.classList.remove('open');bd.classList.remove('show');}
let zoom=1;const main=document.getElementById('main');const zc=document.getElementById('content');function applyZoom(){zc.style.zoom=zoom;main.scrollTop=main.scrollTop;}
document.getElementById('fsz-up').onclick=()=>{zoom=Math.min(2,+(zoom+0.1).toFixed(2));applyZoom();};
document.getElementById('fsz-down').onclick=()=>{zoom=Math.max(0.7,+(zoom-0.1).toFixed(2));applyZoom();};
document.getElementById('fs-btn').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}};
document.addEventListener('fullscreenchange',()=>{const b=document.getElementById('fs-btn');b.innerHTML=document.fullscreenElement?'⛶ ออกจากเต็มจอ':'⛶ เต็มจอ';b.classList.toggle('on',!!document.fullscreenElement);});
const projBtn=document.getElementById('proj-btn');
projBtn.onclick=()=>{const on=document.body.classList.toggle('projector');projBtn.classList.toggle('on',on);if(on){if(zoom<1.2){zoom=1.2;applyZoom();}}else{zoom=1;applyZoom();closeMenu();}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
/* ===== home shortcut (logo) ===== */
const brandEl=document.querySelector('#sidebar .brand');
if(brandEl){brandEl.style.cursor='pointer';brandEl.title='กลับหน้าปก';brandEl.onclick=()=>go(0);}
