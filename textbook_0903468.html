<style>

.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:38px 34px;margin-bottom:12px}
.hero .kick{color:var(--amber);font-weight:700;letter-spacing:2px;font-size:13px}
.hero h2{font-size:29px;margin:10px 0 4px;line-height:1.25}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:18px}
.flow .st{background:rgba(255,255,255,.14);padding:7px 13px;border-radius:20px;font-size:13px;color:#fff}
.flow .ar{color:var(--amber);font-weight:700}
.toc{display:grid;gap:16px}
.tocpart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.tocpart h4{color:var(--amber);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.tocrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:.15s;border:1px solid transparent}
.tocrow:hover{background:var(--tint);border-color:var(--line)}

.tocrow.locked:hover{background:none;border-color:transparent}
.tocrow .cn{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}

.trianglewrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin:6px 0 4px}
.trianglewrap svg{flex:0 0 auto}
.tlegend{max-width:280px}
.tlegend div{font-size:13.5px;margin-bottom:7px;padding-left:20px;position:relative}

.tlegend .l1::before{background:var(--blue)} .tlegend .l2::before{background:var(--teal)} .tlegend .l3::before{background:var(--amber)} .tlegend .l4::before{background:var(--red)}
.wfmap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 14px;box-shadow:var(--shadow);margin-bottom:14px}
.wfnode{display:flex;flex-direction:column;align-items:center;gap:7px;border:none;background:none;cursor:pointer;font-family:inherit;width:108px;padding:6px 2px;border-radius:10px;transition:.15s}

.wfarrow{color:var(--mute);font-size:19px;align-self:center;padding-top:20px}

/* interactive lab / calculators */
.lab{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.lab .labh{font-weight:700;color:var(--navy);font-size:16px;margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.rchip b{color:var(--blue);font-size:17px} .rchip.crit b{color:var(--red)} .rchip.ok b{color:var(--green)}
.scoretab{border-collapse:collapse;width:100%;background:#fff;font-size:13.5px;border-radius:8px;overflow:hidden;min-width:520px}
.scoretab th,.scoretab td{border:1px solid var(--line);padding:7px 9px;text-align:center}
.scoretab th{background:var(--navy);color:#fff;font-weight:700;font-size:12.5px}
.scoretab td:first-child{text-align:left;font-weight:600;color:var(--navy)}
.scoretab tr.win td{background:#E9F5EE}
/* Power-Interest quadrant */
.qgrid{display:grid;grid-template-columns:70px 1fr 1fr;grid-template-rows:26px 1fr 1fr;gap:6px;max-width:560px;margin:6px 0}
.qgrid .qax{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--mute);text-align:center}
.qgrid .qcell{border:1.5px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;background:#fff;transition:.15s;min-height:82px}
.qgrid .qcell:hover{border-color:var(--blue);background:var(--tint)}
.qgrid .qcell.on{border-color:var(--amber);background:#FBF1DD;box-shadow:0 0 0 2px rgba(232,145,45,.2)}

.qgrid .qcell span{font-size:12px;color:var(--mute)}
/* RACI matrix */
.raci{border-collapse:collapse;width:100%;background:#fff;font-size:13.5px;min-width:480px;border-radius:8px;overflow:hidden}
.raci th,.raci td{border:1px solid var(--line);padding:0;text-align:center}
.raci th{background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;padding:8px 6px}
.raci td:first-child,.raci th:first-child{text-align:left;padding:8px 10px}

.raci .rc{width:100%;height:38px;border:none;background:none;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:.15s}

.raci .rc[data-v="R"]{color:#fff;background:var(--blue)} .raci .rc[data-v="A"]{color:#fff;background:var(--red)}
.raci .rc[data-v="C"]{color:#fff;background:var(--teal)} .raci .rc[data-v="I"]{color:var(--navy);background:var(--amber)}
.raci .rc[data-v="-"]{color:#C4C7DE}
.raci-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12.5px}
.raci-legend span{display:inline-flex;align-items:center;gap:6px}
.raci-legend i{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-style:normal;font-size:12px}
/* Charter builder */
.chform{display:grid;gap:10px;margin:6px 0}
.chform label{font-size:13px;font-weight:700;color:var(--navy);display:block;margin-bottom:3px}
.chform input,.chform textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px;background:#fff;resize:vertical}
.chform input:focus,.chform textarea:focus{outline:none;border-color:var(--blue)}
.chprev{background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);margin-top:6px}

.chprev .cprow b{color:var(--blue)}
.chprev .cprow span{color:var(--ink);white-space:pre-wrap}
/* WBS tree */
.wbs{list-style:none;margin:8px 0;padding:0}
.wbs>li{margin:6px 0}
.wbs .wnode{background:var(--navy);color:#fff;border-radius:9px;padding:9px 14px;font-weight:700;font-size:14.5px;display:inline-block}

.wbs .wpkg b{color:var(--navy)}
#gViz7 svg{width:100%;height:auto;display:block;min-width:560px}

.wbslevels{display:grid;grid-template-columns:auto 1fr;gap:0 14px;margin:8px 0}
.wbslevels .lvtag{font-size:11px;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:4px 8px;align-self:center;text-align:center;white-space:nowrap}
.wbslevels .lvtag.l0{background:var(--navy)} .wbslevels .lvtag.l1{background:var(--blue)} .wbslevels .lvtag.l2{background:var(--teal)} .wbslevels .lvtag.l3{background:var(--amber)}
.wbslevels .lvtxt{font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.wtreewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 12px 8px;box-shadow:var(--shadow);margin:6px 0}
.wtree,.wtree ul{position:relative;padding-top:20px;display:flex;justify-content:center;list-style:none;margin:0}
.wtree li{position:relative;padding:20px 7px 0;text-align:center}
.wtree li::before,.wtree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:20px}
.wtree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.wtree>li{padding-top:0}
.wtree>li::before,.wtree>li::after{display:none}
.wtree li:only-child::before,.wtree li:only-child::after{display:none}

.wtree li:last-child::before{border-right:2px solid var(--line);border-radius:0 7px 0 0}
.wtree li:first-child::after{border-radius:7px 0 0 0}
.wtree ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);width:0;height:20px}
.wbox{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;background:#fff;transition:.15s;min-width:96px;max-width:150px;box-shadow:var(--shadow)}

/* ===== บทที่ 1 ===== */
{ id:"ch1", part:"ส่วนที่ 1 · พื้นฐาน", group:"บทที่ 1 · บทนำสู่การบริหารโครงการ", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 1 · Overview</div><h2 class="title">บทนำสู่การบริหารโครงการและโครงงานธุรกิจสมัยใหม่</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2.5 ชั่วโมง</b> · 14 หน้าจอสอน</div>
  <p class="lead">ปูพื้นฐานความเข้าใจธรรมชาติของ "โครงการ" และการบริหารโครงการ อันเป็นรากฐานของทุกบทถัดไป</p>
  <div class="callout info"><b>ทำไมต้องเรียนบทนี้:</b> โลกธุรกิจศตวรรษที่ 21 เปลี่ยนเร็วจากเทคโนโลยีดิจิทัล พฤติกรรมผู้บริโภค และการแข่งขันไร้พรมแดน องค์กรที่อยู่รอดต้องสร้างสิ่งใหม่เสมอ ซึ่งมัก <b>เกิดในรูปของ "โครงการ" ไม่ใช่งานประจำ</b> ความสามารถบริหารโครงการให้สำเร็จจึงเป็นสมรรถนะหลัก (Core Competency) ของคนทำธุรกิจยุคใหม่</div>
  <h3>วัตถุประสงค์การเรียนรู้ประจำบท</h3>
  <ul class="clean">
    <li>อธิบายความหมายและลักษณะเฉพาะของโครงการ และจำแนกประเภทของโครงการได้</li>
    <li>อธิบายความหมาย ขอบเขต และความสำคัญของการบริหารโครงการในบริบทธุรกิจสมัยใหม่ได้</li>
    <li>วิเคราะห์ความแตกต่างระหว่างงานประจำกับโครงการ และเชื่อมโยงกับการดำเนินธุรกิจได้</li>
    <li>อธิบายข้อจำกัดของโครงการ ความรู้/ทักษะของผู้จัดการโครงการ และผู้มีส่วนได้ส่วนเสียเบื้องต้นได้</li>
    <li>อธิบายมาตรฐานการบริหารโครงการที่สำคัญ และเชื่อมโยงสู่การทำโครงงานธุรกิจสมัยใหม่ได้</li>
  </ul>
  <div class="callout act"><span class="tag">เปิดคาบ</span><b>คำถามอุ่นเครื่อง (5 นาที):</b> ให้นิสิตยกตัวอย่าง "สิ่งใหม่" ที่ธุรกิจรอบตัวเพิ่งทำ (แอปใหม่ เมนูใหม่ สาขาใหม่) คนละ 1 อย่าง แล้วเก็บไว้—ท้ายคาบจะกลับมาดูว่าอันไหน "เป็นโครงการ" อันไหน "เป็นงานประจำ"</div>
  <div class="chapopen" data-open="1"></div>
`},
{ id:"c1-what", part:"ส่วนที่ 1 · พื้นฐาน", group:"บทที่ 1 · บทนำสู่การบริหารโครงการ", nav:"1.1 โครงการคืออะไร", icon:"2", html:`
  <div class="eyebrow">1.2 · นิยาม</div><h2 class="title">โครงการ (Project) คืออะไร</h2>
  <p class="lead">นักวิชาการและองค์กรวิชาชีพให้นิยามหลากหลาย แต่มีสาระสำคัญตรงกัน</p>
  <div class="grid c2">
    <div class="card"><h4>นิยามตาม PMI</h4><p>"ความพยายามชั่วคราว (temporary endeavor) ที่ดำเนินการขึ้นเพื่อสร้างผลิตภัณฑ์ บริการ หรือผลลัพธ์ที่มีลักษณะเฉพาะตัว (unique product, service, or result)"</p></div>
    <div class="card"><h4>นิยามเชิงวิชาการ</h4><p>ชุดของกิจกรรมที่สัมพันธ์กัน มีจุดเริ่มต้นและจุดสิ้นสุดชัดเจน มุ่งบรรลุวัตถุประสงค์เฉพาะภายใต้ข้อจำกัดของทรัพยากร</p></div>
  </div>
  <div class="callout ok"><b>สรุปนิยามสังเคราะห์:</b> โครงการ คือ <b>ความพยายามชั่วคราว</b> ที่ดำเนินอย่างมีระบบเพื่อสร้าง <b>ผลลัพธ์เฉพาะตัว</b> ให้บรรลุวัตถุประสงค์ที่กำหนด ภายใต้ข้อจำกัดด้าน <b>ขอบเขต เวลา ต้นทุน และคุณภาพ</b> โดยประสานทรัพยากรและบุคลากรที่เกี่ยวข้อง</div>
  <div class="callout tip"><b>ครอบคลุมทุกขนาด:</b> ตั้งแต่โครงการใหญ่ (พัฒนาระบบสารสนเทศองค์กร งบหลักล้าน) จนถึงโครงการเล็ก (โครงงานพัฒนาผลิตภัณฑ์ของนิสิตในหนึ่งภาคเรียน) — คำนิยามเดียวกันใช้ได้ทั้งหมด</div>
  <div class="callout dig"><span class="tag">ชวนคิด</span>ลองเทียบ "การเปิดสาขาร้านกาแฟใหม่ 1 สาขา" กับ "การชงกาแฟขายทุกวัน" — อันไหนคือโครงการ อันไหนคืองานประจำ เพราะอะไร? (คำใบ้: ดูที่ "จุดสิ้นสุด")</div>
`},
{ id:"c1-hierarchy", part:"ส่วนที่ 1 · พื้นฐาน", group:"บทที่ 1 · บทนำสู่การบริหารโครงการ", nav:"1.2 โครงการ/โปรแกรม/พอร์ตโฟลิโอ", icon:"3", html:`
  <div class="eyebrow">1.2.1 · Hierarchy</div><h2 class="title">โครงการ · โปรแกรม · พอร์ตโฟลิโอ</h2>
  <p class="lead">"โครงการ" เป็นหน่วยเล็กสุดในภาพใหญ่ของการบริหารเชิงกลยุทธ์ — เข้าใจลำดับชั้นนี้ช่วยเห็นว่าโครงงานของเราเชื่อมกับเป้าหมายองค์กรอย่างไร</p>
  <div class="wbslevels">
    <div class="lvtag l0">พอร์ตโฟลิโอ</div><div class="lvtxt"><b>Portfolio</b> — กลุ่มของโปรแกรม/โครงการทั้งหมดที่องค์กรเลือกลงทุน เพื่อบรรลุ "กลยุทธ์" (ทำสิ่งที่ถูกต้อง — do the right things)</div>
    <div class="lvtag l1">โปรแกรม</div><div class="lvtxt"><b>Program</b> — กลุ่มโครงการที่สัมพันธ์กัน บริหารรวมกันเพื่อได้ประโยชน์ที่มากกว่าทำแยก</div>
    <div class="lvtag l2">โครงการ</div><div class="lvtxt"><b>Project</b> — ความพยายามชั่วคราวสร้างผลลัพธ์เฉพาะ (ทำให้ถูกวิธี — do things right)</div>
    <div class="lvtag l3" style="background:var(--mute)">งานประจำ</div><div class="lvtxt"><b>Operations</b> — งานที่ทำต่อเนื่องเพื่อรักษาการดำเนินธุรกิจ (รับผลงานจากโครงการมาดูแลต่อ)</div>
  </div>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">ระดับ</th><th style="background:var(--blue)">มุ่งเน้น</th><th style="background:var(--teal)">ตัวอย่าง</th></tr></thead>
    <tbody>
      <tr><td>Portfolio</td><td>เลือกลงทุนให้ตรงกลยุทธ์ สร้างคุณค่าสูงสุด</td><td>แผนการลงทุนดิจิทัลทั้งบริษัท</td></tr>
      <tr><td>Program</td><td>ประสานหลายโครงการให้ได้ประโยชน์ร่วม</td><td>โปรแกรม "เปลี่ยนสู่ดิจิทัล" (มีหลายโครงการ)</td></tr>
      <tr><td>Project</td><td>ส่งมอบผลลัพธ์เฉพาะตามกรอบเวลา/งบ</td><td>พัฒนาแอปสั่งอาหาร 1 แอป</td></tr>
    </tbody>
  </table></div>
  <div class="callout info"><b>เชื่อมกับรายวิชา:</b> "โครงงานธุรกิจสมัยใหม่" ของนิสิตอยู่ระดับ <b>Project</b> แต่ควรอธิบายได้ว่ามันสนับสนุนเป้าหมายที่ใหญ่กว่า (เช่น แก้ปัญหาชุมชน/สร้างรายได้) อย่างไร</div>
  <div class="callout dig"><span class="tag">ชวนคิด</span>"do the right things" (เลือกโครงการที่ถูก — ระดับพอร์ตโฟลิโอ) ต่างจาก "do things right" (ทำโครงการให้ดี — ระดับโครงการ) อย่างไร? ทำไมต้องมีทั้งสอง</div>
`},
{ id:"c1-char", part:"ส่วนที่ 1 · พื้นฐาน", group:"บทที่ 1 · บทนำสู่การบริหารโครงการ", nav:"1.3 ลักษณะเฉพาะ 5 ประการ", icon:"4", html:`
  <div class="eyebrow">1.3 · Characteristics</div><h2 class="title">ลักษณะเฉพาะของโครงการ 5 ประการ</h2>
  <p class="lead">สิ่งที่ทำให้โครงการต่างจากกิจกรรมทั่วไป และเป็นเหตุผลว่าทำไมต้องบริหารเป็นพิเศษ</p>
  <div class="grid c2">
    <div class="card"><h4><span class="num">1</span>ความเป็นชั่วคราว (Temporary)</h4><p>มีจุดเริ่มต้น–สิ้นสุดชัดเจน เมื่อบรรลุเป้าหมายหรือหมดความจำเป็นก็ยุติ — "ชั่วคราว" ไม่ได้แปลว่าสั้น แต่หมายถึงมี "กรอบเวลา" ต่างจากงานประจำที่ทำต่อเนื่องไม่มีกำหนดจบ</p></div>
    <div class="card"><h4><span class="num t">2</span>ผลลัพธ์เฉพาะตัว (Unique)</h4><p>ไม่ใช่การผลิตซ้ำสิ่งเดิม แม้สองโครงการคล้ายกัน บริบท/ผู้เกี่ยวข้อง/เงื่อนไขก็ต่างกัน จึงมีความท้าทายเฉพาะตน</p></div>
    <div class="card"><h4><span class="num a">3</span>ค่อยเป็นค่อยไป (Progressive Elaboration)</h4><p>รายละเอียดชัดขึ้นเรื่อย ๆ ตามความก้าวหน้า เริ่มจากแนวคิดกว้าง สู่แผนที่แม่นยำ ทำให้การวางแผนต้องทบทวน/ปรับปรุงต่อเนื่อง</p></div>
    <div class="card"><h4><span class="num r">4</span>ข้อจำกัดที่ต้องบริหารสมดุล</h4><p>ขอบเขต–เวลา–ต้นทุนสัมพันธ์กัน เปลี่ยนด้านหนึ่งกระทบด้านอื่น ต้องบริหารความสมดุลอย่างระมัดระวัง</p></div>
    <div class="card"><h4><span class="num g">5</span>ความไม่แน่นอนและความเสี่ยง</h4><p>เพราะมุ่งสร้างสิ่งใหม่ จึงเสี่ยงสูงกว่างานประจำ การบริหารความเสี่ยงเป็นองค์ประกอบที่ขาดไม่ได้</p></div>
  </div>
  <div class="callout act"><span class="tag">กิจกรรมคู่</span><b>(8 นาที)</b> ให้นิสิตจับคู่ นำ "โครงงานที่กลุ่มอยากทำ" มาตรวจ 5 ลักษณะทีละข้อ ว่าครบไหม ข้อไหนที่ยังคลุมเครือ (เช่น "จุดสิ้นสุด" ยังไม่ชัด) แล้วบันทึกไว้ปรับในบทถัดไป</div>
`},
{ id:"c1-ops", part:"ส่วนที่ 1 · พื้นฐาน", group:"บทที่ 1 · บทนำสู่การบริหารโครงการ", nav:"1.4 ประเภท & งานประจำ vs โครงการ", icon:"5", html:`
  <div class="eyebrow">1.4–1.5 · Types & Operation vs Project</div><h2 class="title">ประเภทโครงการ & งานประจำ vs โครงการ</h2>
  <h3>จำแนกประเภทโครงการได้หลายเกณฑ์</h3>
  <div class="grid c3">
    <div class="card"><h4>ตามวัตถุประสงค์</h4><p>เชิงพาณิชย์ · วิจัยและพัฒนา · เพื่อสังคม</p></div>
    <div class="card"><h4>ตามขนาด/ความซับซ้อน</h4><p>ขนาดเล็ก · กลาง · ใหญ่</p></div>
    <div class="card"><h4>ตามสาขางาน</h4><p>การตลาด · การผลิต · เทคโนโลยีสารสนเทศ ฯลฯ</p></div>
  </div>
  <div class="callout info"><b>โครงงานในรายวิชานี้</b> มักเป็นโครงการเชิงพาณิชย์หรือพัฒนานวัตกรรมขนาดเล็ก–กลางที่ทำเป็นทีม การรู้ประเภทช่วยเลือกแนวทางและเครื่องมือบริหารที่เหมาะสม</div>
  <h3>ตารางที่ 1.1 เปรียบเทียบงานประจำกับโครงการ</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">ประเด็น</th><th style="background:var(--teal)">งานประจำ (Operation)</th><th style="background:var(--blue)">โครงการ (Project)</th></tr></thead>
    <tbody>
      <tr><td>ระยะเวลา</td><td>ต่อเนื่อง ไม่มีกำหนดสิ้นสุด</td><td>ชั่วคราว มีจุดเริ่มต้น–สิ้นสุด</td></tr>

  <div class="callout tip"><b>พัฒนาการของศาสตร์:</b> การบริหารโครงการพัฒนาเป็นศาสตร์อย่างเป็นระบบตั้งแต่ต้นคริสต์ศตวรรษที่ 20 — Henry Gantt คิดค้นแผนภูมิแกนต์ (ราว ค.ศ. 1910), เทคนิคเครือข่าย CPM/PERT เกิดในคริสต์ทศวรรษ 1950, สถาบัน PMI ก่อตั้ง ค.ศ. 1969 และจัดทำ PMBOK, ต่อมามีมาตรฐานสากล ISO 21500/21502 และแนวทาง Agile (ค.ศ. 2001) ทำให้ปัจจุบันเป็นวิชาชีพที่มีองค์ความรู้และการรับรองระดับสากล</div>
  <h3>ดำเนินผ่านกลุ่มกระบวนการ 5 กลุ่ม</h3>

  </div>
  <p style="margin-top:14px">ครอบคลุมองค์ความรู้หลายด้าน: ขอบเขต เวลา ต้นทุน คุณภาพ ทรัพยากร การสื่อสาร ความเสี่ยง และผู้มีส่วนได้ส่วนเสีย (จะลงลึกในบทถัดไป)</p>

      <text x="292" y="230" text-anchor="end" font-size="14" font-weight="800" fill="#2E8B72">เวลา · Time</text>
      <text x="8" y="230" text-anchor="start" font-size="14" font-weight="800" fill="#E8912D">ต้นทุน · Cost</text>
    </svg>

      <div class="l1"><b>ขอบเขต (Scope)</b> — สิ่งที่ต้องส่งมอบ</div>
      <div class="l3"><b>ต้นทุน (Cost)</b> — งบประมาณที่ใช้</div>
      <div class="l2"><b>เวลา (Time)</b> — กรอบเวลาดำเนินงาน</div>
      <div class="l4"><b>คุณภาพ (Quality)</b> — แกนกลาง รับผลจากทั้งสามด้าน</div>

  <h3>ตารางที่ 1.2 ข้อจำกัดหลักและผลกระทบ</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">ข้อจำกัด</th><th style="background:var(--blue)">ความหมาย</th><th style="background:var(--amber)">ผลเมื่อเปลี่ยนแปลง</th></tr></thead>
    <tbody>
      <tr><td>ขอบเขต (Scope)</td><td>สิ่งที่ต้องส่งมอบ</td><td>เพิ่มงาน → ใช้เวลา/ต้นทุนมากขึ้น</td></tr>

    <div class="card"><h4><span class="num t">2</span>ความเป็นเอกลักษณ์</h4><p>สร้างแอปต้นแบบเฉพาะบริบทของมหาวิทยาลัย</p></div>
    <div class="card"><h4><span class="num a">3</span>พัฒนาแบบค่อยเป็นค่อยไป</h4><p>รายละเอียดชัดขึ้นจากการสำรวจผู้ใช้</p></div>
    <div class="card"><h4><span class="num r">4</span>บริหารข้อจำกัดสมดุล</h4><p>เวลา งบประมาณ และขอบเขต</p></div>
  </div>
  <div class="callout tip"><b>โครงการ vs งานประจำ:</b> เมื่อพัฒนาแอปเสร็จและส่งมอบ โครงการก็สิ้นสุด แต่การดูแลและให้บริการแอปในแต่ละวันจะกลายเป็น "งานประจำ" ต่อไป</div>
  <div class="callout act"><span class="tag">อภิปรายกลุ่ม</span><b>(10 นาที)</b> ให้แต่ละกลุ่มนำ "โครงงานของตัวเอง" มาเขียนเทียบกรณีศึกษานี้: (1) จุดเริ่ม–จุดจบอยู่ตรงไหน (2) ผลลัพธ์เฉพาะตัวคืออะไร (3) เมื่อจบโครงการแล้วส่วนใดจะกลายเป็นงานประจำ</div>
`},
{ id:"c1-sum", part:"ส่วนที่ 1 · พื้นฐาน", group:"บทที่ 1 · บทนำสู่การบริหารโครงการ", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 1</h2>
  <ul class="clean">
    <li><b>โครงการ</b> = ความพยายามชั่วคราว สร้างผลลัพธ์เฉพาะตัว ภายใต้ข้อจำกัดขอบเขต–เวลา–ต้นทุน–คุณภาพ</li>
    <li><b>5 ลักษณะเฉพาะ</b> — ชั่วคราว · เอกลักษณ์ · ค่อยเป็นค่อยไป · ข้อจำกัดสมดุล · ความเสี่ยง</li>
    <li><b>การบริหารโครงการ</b> = ประยุกต์ความรู้/ทักษะ/เครื่องมือ ผ่าน 5 กลุ่มกระบวนการ เป็นทั้งศาสตร์และศิลป์</li>
    <li><b>ผู้จัดการโครงการ</b> ต้องมีทั้งความรู้เทคนิค ภาวะผู้นำ และทักษะมนุษยสัมพันธ์</li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>จงให้นิยามของ "โครงการ" พร้อมอธิบายลักษณะเฉพาะทั้ง 5 ประการ และยกตัวอย่างประกอบแต่ละข้อ</li>
    <li>เปรียบเทียบความแตกต่างระหว่างงานประจำกับโครงการอย่างน้อย 5 ประเด็น พร้อมยกตัวอย่างจากธุรกิจจริง</li>
    <li>อธิบายความหมายและขอบเขตของการบริหารโครงการ และเหตุใดจึงกล่าวว่าเป็นทั้งศาสตร์และศิลป์</li>
    <li>วิเคราะห์ว่าการบริหารโครงการมีความสำคัญต่อธุรกิจสมัยใหม่อย่างไร พร้อมตัวอย่าง</li>
    <li>อธิบายแนวคิดสามเหลี่ยมข้อจำกัด และยกตัวอย่างสถานการณ์ที่เปลี่ยนข้อจำกัดด้านหนึ่งกระทบอีกสองด้าน</li>
    <li>PMI Talent Triangle ประกอบด้วยสมรรถนะด้านใด และเหตุใดทักษะมนุษยสัมพันธ์จึงสำคัญ</li>
    <li>เปรียบเทียบจุดเด่นของ PMBOK, PRINCE2 และ Agile โดยสังเขป</li>
    <li>ยกตัวอย่างโครงงานธุรกิจสมัยใหม่ที่กลุ่มสนใจ พร้อมเป้าหมาย ผลลัพธ์คาดหวัง และเหตุผลที่จัดเป็นโครงการ</li>
    <li>วิเคราะห์ว่าในโครงงานกลุ่ม ส่วนใดเป็น "โครงการ" และส่วนใดจะกลายเป็น "งานประจำ"</li>
    <li>ระบุผู้มีส่วนได้ส่วนเสียเบื้องต้นของโครงงานกลุ่มอย่างน้อย 5 กลุ่ม พร้อมอธิบายความเกี่ยวข้อง</li>
  </ol>
`},
{ id:"c1-gloss", part:"ส่วนที่ 1 · พื้นฐาน", group:"บทที่ 1 · บทนำสู่การบริหารโครงการ", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 1</h2>
  <div class="gdef">
    <div class="gitem"><b>โครงการ (Project)</b><span>ความพยายามชั่วคราวเพื่อสร้างผลลัพธ์เฉพาะตัวภายใต้ข้อจำกัดที่กำหนด</span></div>
    <div class="gitem"><b>การบริหารโครงการ (Project Management)</b><span>การประยุกต์ความรู้ ทักษะ เครื่องมือ และเทคนิคเพื่อให้โครงการบรรลุวัตถุประสงค์</span></div>
    <div class="gitem"><b>Progressive Elaboration</b><span>การพัฒนารายละเอียดของโครงการให้ชัดเจนขึ้นตามความก้าวหน้าของงาน</span></div>
    <div class="gitem"><b>Triple Constraint</b><span>สามเหลี่ยมข้อจำกัด: ขอบเขต เวลา ต้นทุน โดยมีคุณภาพเป็นแกนกลาง</span></div>
    <div class="gitem"><b>งานประจำ (Operation)</b><span>งานที่ทำซ้ำต่อเนื่องเพื่อรักษาการดำเนินงานขององค์กร</span></div>
    <div class="gitem"><b>Stakeholders</b><span>ผู้มีส่วนได้ส่วนเสียที่ได้รับผลกระทบหรือมีอิทธิพลต่อโครงการ</span></div>
    <div class="gitem"><b>PMI Talent Triangle</b><span>กรอบสมรรถนะผู้จัดการโครงการ 3 ด้าน: เทคนิค ภาวะผู้นำ กลยุทธ์/ธุรกิจ</span></div>
    <div class="gitem"><b>PMBOK / PRINCE2 / Agile</b><span>มาตรฐานและแนวทางการบริหารโครงการที่ได้รับการยอมรับ</span></div>
  </div>
  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management: Achieving Competitive Advantage.</i> · PMI. <i>PMBOK Guide.</i></div>
`},

{ id:"ch2", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 2 · Overview</div><h2 class="title">วงจรชีวิตโครงการและกระบวนการบริหารโครงการ</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2–2.5 ชั่วโมง</b> · 11 หน้าจอสอน</div>
  <p class="lead">กรอบความคิดหลักที่ใช้ตลอดอายุโครงการ ช่วยให้วางแผน ควบคุม และตัดสินใจได้อย่างมีหลักการ</p>
  <div class="callout info"><b>แนวคิดหลักของบท:</b> การบริหารโครงการให้สำเร็จต้องแบ่งงานเป็นช่วงที่จัดการได้ (วงจรชีวิต) และดำเนินกระบวนการบริหารอย่างเป็นระบบ (กลุ่มกระบวนการ 5 กลุ่ม)</div>
  <h3>วัตถุประสงค์การเรียนรู้ประจำบท</h3>
  <ul class="clean">
    <li>อธิบายความหมายและองค์ประกอบของวงจรชีวิตโครงการได้</li>
    <li>อธิบายเฟสของโครงการและผลงานส่งมอบในแต่ละเฟสได้</li>
    <li>อธิบายกลุ่มกระบวนการบริหาร 5 กลุ่มและความสัมพันธ์ระหว่างกันได้</li>
    <li>เปรียบเทียบวงจรชีวิตแบบทำนายได้ (Predictive) วนซ้ำ (Iterative) และปรับตัว (Agile) ได้</li>
    <li>วิเคราะห์ปัจจัยความสำเร็จ/ความล้มเหลว และประยุกต์กับโครงงานธุรกิจสมัยใหม่ได้</li>
  </ul>
  <div class="callout dig"><span class="tag">ทบทวน</span>บทที่ 1 บอกว่าโครงการมี "จุดเริ่ม–จุดจบ" — บทนี้จะเจาะว่า ระหว่างเริ่มกับจบ โครงการเดินผ่าน "เฟส" อะไรบ้าง และต้องบริหารอย่างไรในแต่ละเฟส</div>
  <div class="chapopen" data-open="2"></div>
`},
{ id:"c2-def", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"2.1 วงจรชีวิตคืออะไร", icon:"2", html:`
  <div class="eyebrow">2.2 · Life Cycle</div><h2 class="title">วงจรชีวิตโครงการคืออะไร</h2>
  <div class="callout info"><b>นิยาม:</b> ลำดับของช่วงงาน (Phases) ที่โครงการต้องผ่านตั้งแต่เริ่มต้นจนสิ้นสุด แต่ละช่วงมีกิจกรรม ผลงานส่งมอบ และจุดตัดสินใจที่ชัดเจน — ช่วยลดความซับซ้อนโดยแบ่งงานใหญ่เป็นส่วนย่อยที่บริหารได้</div>
  <div class="grid c2">
    <div class="card"><h4>วงจรชีวิต (Life Cycle)</h4><p>โครงสร้างของ <b>"ช่วงงาน"</b> — โครงการอยู่ในเฟสไหน</p></div>
    <div class="card"><h4>กลุ่มกระบวนการ (Process Groups)</h4><p><b>"กิจกรรมการบริหาร"</b> ที่เกิดขึ้นภายในแต่ละช่วง</p></div>
  </div>
  <div class="callout tip"><b>อย่าสับสน:</b> วงจรชีวิต = "ช่วงเวลาของโครงการ" ส่วนกลุ่มกระบวนการ = "งานบริหารที่ทำในแต่ละช่วง" ทั้งสองทำงานคู่กัน เช่น ในเฟส "ดำเนินการ" เราก็ยังทำกระบวนการ "วางแผน (ปรับแผน)" และ "ควบคุม" ไปพร้อมกัน</div>
  <div class="callout info"><b>แนวโน้มร่วมสมัย:</b> PMBOK ฉบับที่ 7 (ค.ศ. 2021) ปรับจากแนวคิดเชิงกระบวนการ (Process-based) สู่แนวคิดเชิงหลักการและขอบเขตการทำงาน (12 หลักการ + 8 Performance Domains) สะท้อนว่าโลกให้ความสำคัญกับ "การส่งมอบคุณค่า" มากขึ้น · การเลือกรูปแบบวงจรชีวิตอาจใช้กรอบ Cynefin (Snowden) พิจารณาว่าปัญหาอยู่ในบริบทที่ชัดเจน ซับซ้อน หรืออลวน เพื่อเลือกวิธีที่เหมาะสม</div>
`},

{ id:"c2-proc", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"2.3 กลุ่มกระบวนการ 5 กลุ่ม", icon:"4", html:`
  <div class="eyebrow">2.4 · Process Groups</div><h2 class="title">กลุ่มกระบวนการบริหารโครงการ 5 กลุ่ม</h2>
  <div class="callout info"><b>ตามแนว PMBOK</b> แบ่งเป็น 5 กลุ่ม: ริเริ่ม · วางแผน · ดำเนินการ · ติดตาม/ควบคุม · ปิดโครงการ — กลุ่มเหล่านี้ <b>ไม่ใช่ลำดับขั้นที่แยกขาด</b> แต่ทับซ้อนและวนกลับได้ตลอดอายุโครงการ</div>
  <div class="grid c2">
    <div class="card"><h4>ทับซ้อนกัน</h4><p>ขณะดำเนินการ กระบวนการติดตาม/ควบคุมก็ทำงานตลอดเวลาเพื่อรักษาโครงการให้อยู่ในกรอบ</p></div>
    <div class="card"><h4>วนกลับได้</h4><p>เมื่อมีการเปลี่ยนแปลงระหว่างดำเนินการ กระบวนการวางแผนถูกเรียกใช้อีกครั้งเพื่อปรับแผน</p></div>
  </div>
  <div class="callout tip"><b>เชื่อมกับบทที่ 1:</b> 5 กลุ่มกระบวนการนี้คือแกนเดียวกับที่พูดถึงในหัวข้อ "การบริหารโครงการ" ของบท 1 — บทนี้ลงลึกว่าแต่ละกลุ่มสัมพันธ์กันอย่างไร</div>
  <div class="callout dig"><span class="tag">ชวนคิด</span>ทำไม "การติดตาม/ควบคุม" ถึงไม่ใช่เฟสสุดท้าย แต่ต้องทำ "คู่ขนาน" ไปตลอด? (คำใบ้: ถ้ารอจนจบแล้วค่อยตรวจ จะแก้ทันไหม)</div>
`},
{ id:"c2-overlap", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"2.3.1 การทับซ้อนของกระบวนการ", icon:"5", html:`
  <div class="eyebrow">2.4.1 · Process Overlap</div><h2 class="title">กลุ่มกระบวนการทับซ้อนกันอย่างไรตามเวลา</h2>
  <p class="lead">กราฟคลาสสิกนี้แสดงว่าตลอดอายุโครงการ กลุ่มกระบวนการทั้ง 5 ไม่ได้ทำทีละอย่างจบแล้วค่อยขึ้นอันใหม่ แต่ "ทับซ้อน" กัน — เส้นแต่ละสีคือระดับความเข้มข้นของงานในแต่ละกลุ่ม</p>
  <svg class="pgchart" viewBox="0 0 640 260" id="pgChart"></svg>
  <div class="grid c2">
    <div class="card"><h4>อ่านกราฟอย่างไร</h4><ul><li><b>ริเริ่ม</b> พีคช่วงต้น แล้วลด</li><li><b>วางแผน</b> พีคช่วงต้น–กลาง</li><li><b>ดำเนินการ</b> พีคสูงสุดช่วงกลาง (ใช้ทรัพยากรมากสุด)</li><li><b>ติดตาม/ควบคุม</b> ทำต่อเนื่องเกือบตลอด</li><li><b>ปิดโครงการ</b> พีคช่วงท้าย</li></ul></div>
    <div class="card"><h4>ข้อสรุปสำคัญ</h4><p>ณ เวลาหนึ่ง ๆ มักมีหลายกลุ่มกระบวนการทำงานพร้อมกัน เช่น ระหว่าง "ดำเนินการ" ก็ยัง "วางแผน (ปรับแผน)" และ "ควบคุม" ไปด้วย — จึงต้องบริหารหลายมิติพร้อมกัน</p></div>
  </div>
  <div class="callout tip"><b>ต่างจากวงจรชีวิต:</b> "เฟส" เดินทีละช่วง (หน้า 2.2) แต่ "กลุ่มกระบวนการ" ทับซ้อนตามกราฟนี้ — สองแนวคิดนี้ทำงานคู่กัน</div>
`},
{ id:"c2-model", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"2.4 รูปแบบวงจรชีวิต", icon:"6", html:`
  <div class="eyebrow">2.5 · Life Cycle Models</div><h2 class="title">รูปแบบวงจรชีวิตโครงการ</h2>
  <div class="grid c3">
    <div class="card"><h4>Predictive / Waterfall</h4><p>วางแผนละเอียดตั้งแต่ต้นและดำเนินตามลำดับ</p><ul><li>เหมาะกับขอบเขตชัดเจน เปลี่ยนน้อย</li></ul></div>
    <div class="card"><h4>Iterative &amp; Incremental</h4><p>พัฒนาเป็นรอบ ส่งมอบทีละส่วน</p><ul><li>เหมาะกับงานที่ต้องเรียนรู้/ปรับปรุงระหว่างทาง</li></ul></div>
    <div class="card"><h4>Agile / Adaptive</h4><p>ทำงานรอบสั้น ปรับตามผลตอบรับเร็ว</p><ul><li>เหมาะกับความไม่แน่นอนสูง เช่น นวัตกรรมดิจิทัล</li></ul></div>
  </div>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">หัวข้อ</th><th style="background:var(--blue)">Predictive</th><th style="background:var(--teal)">Iterative</th><th style="background:var(--amber)">Agile</th></tr></thead>
    <tbody>
      <tr><td>การวางแผน</td><td>ละเอียดตั้งแต่ต้น</td><td>วางกว้าง ปรับเป็นรอบ</td><td>ปรับต่อเนื่องทุกรอบสั้น</td></tr>
      <tr><td>การส่งมอบ</td><td>ครั้งเดียวตอนจบ</td><td>ทีละส่วน</td><td>บ่อย รอบสั้น</td></tr>
      <tr><td>เหมาะกับ</td><td>ขอบเขตนิ่ง</td><td>เรียนรู้ระหว่างทาง</td><td>ไม่แน่นอนสูง</td></tr>
      <tr><td>ตัวอย่างงาน</td><td>ก่อสร้าง จัดงานพิธี</td><td>พัฒนาหลักสูตร ผลิตภัณฑ์</td><td>พัฒนาแอป/ซอฟต์แวร์</td></tr>
    </tbody>
  </table></div>
  <h3>ลองเลือกโมเดลให้เหมาะกับงาน</h3>
  <div class="callout act"><span class="tag">แบบฝึก</span>กดเลือกโมเดลที่เหมาะกับแต่ละงาน — ระบบเฉลยพร้อมเหตุผลทันที</div>
  <div class="quiz" id="lcQuiz"></div>
  <div id="lcQuizRes" class="res" style="margin-top:8px"></div>
`},
{ id:"c2-gate", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"2.5 Stage Gate & ปัจจัย", icon:"7", html:`
  <div class="eyebrow">2.6–2.8 · Gates & Success Factors</div><h2 class="title">จุดตัดสินใจ & ปัจจัยความสำเร็จ</h2>
  <div class="callout info"><b>Stage Gate (Decision Gate):</b> จุดตัดสินใจระหว่างเฟส ที่ผู้บริหารทบทวนความก้าวหน้าและความคุ้มค่า เพื่อตัดสินใจว่าจะ <b>ดำเนินต่อ · ปรับแผน · หรือยุติโครงการ</b> ช่วยควบคุมความเสี่ยงและการใช้ทรัพยากร ไม่ให้ "ทุ่มต่อ" ทั้งที่ควรหยุด</div>
  <div class="grid c2">
    <div class="card"><h4 style="color:var(--green)">ปัจจัยความสำเร็จ</h4><ul><li>เป้าหมายและขอบเขตชัดเจน</li><li>การสนับสนุนจากผู้บริหาร</li><li>วางแผนรอบคอบ · สื่อสารดี</li><li>ผู้มีส่วนได้ส่วนเสียมีส่วนร่วม</li><li>บริหารความเสี่ยง</li></ul></div>
    <div class="card"><h4 style="color:var(--red)">สาเหตุความล้มเหลว</h4><ul><li>ขอบเขตไม่ชัด/เปลี่ยนบ่อย (Scope Creep)</li><li>ประมาณการคลาดเคลื่อน</li><li>สื่อสารไม่เพียงพอ</li><li>ละเลยการบริหารความเสี่ยง</li></ul></div>
  </div>
  <div class="callout ok"><b>ประยุกต์กับโครงงานนิสิต:</b> ผสมแนวทางแบบปรับตัว—แบ่งงานเป็นรอบสั้น ทบทวนความก้าวหน้าเป็นระยะ ควบคู่กับกำหนดจุดตัดสินใจในสัปดาห์สำคัญ (เช่น สัปดาห์กลางภาคเป็น Gate ตรวจว่าไปต่อหรือปรับ)</div>
`},
{ id:"c2-case", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: ทีมโครงงานเปิดร้านกาแฟ</h2>
  <p class="lead">ทีมดำเนินงานตามวงจรชีวิตโครงการครบทั้ง 5 เฟส</p>
  <div class="grid c5">
    <div class="card mini"><div class="c" style="background:var(--blue)">1</div><b>ริเริ่ม</b><span>ศึกษาความเป็นไปได้</span></div>
    <div class="card mini"><div class="c" style="background:#3B7DD8">2</div><b>วางแผน</b><span>เมนู ทำเล งบประมาณ</span></div>
    <div class="card mini"><div class="c" style="background:var(--teal)">3</div><b>ดำเนินการ</b><span>ตกแต่งและเปิดร้าน</span></div>
    <div class="card mini"><div class="c" style="background:var(--amber)">4</div><b>ติดตาม/ควบคุม</b><span>ยอดขาย ต้นทุน</span></div>
    <div class="card mini"><div class="c" style="background:var(--red)">5</div><b>ปิดโครงการ</b><span>สรุปผลและบทเรียน</span></div>
  </div>
  <div class="callout tip"><b>ใช้แนวทางปรับตัว:</b> ช่วงทดลองขาย ทีมปรับเมนูและราคาตามผลตอบรับลูกค้าในแต่ละสัปดาห์ และใช้การประชุมปลายสัปดาห์เป็น "จุดตัดสินใจ" ว่าจะปรับแผนอย่างไร</div>
  <div class="callout act"><span class="tag">วิเคราะห์</span><b>(10 นาที)</b> ให้แต่ละกลุ่มเขียน "แผนที่ 5 เฟส" ของโครงงานตัวเอง ระบุกิจกรรมหลักและผลงานส่งมอบของแต่ละเฟส แล้วชี้ว่าจะตั้ง Stage Gate ไว้ที่สัปดาห์ใด</div>
`},
{ id:"c2-sum", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 2</h2>
  <ul class="clean">
    <li><b>วงจรชีวิตโครงการ</b> จัดระเบียบงานเป็นช่วงที่จัดการได้ (5 เฟส)</li>
    <li><b>กลุ่มกระบวนการบริหาร 5 กลุ่ม</b> เป็นกรอบดำเนินงานที่ทับซ้อนและวนกลับได้</li>
    <li><b>เลือกรูปแบบวงจรชีวิต</b> (Predictive/Iterative/Agile) ให้เหมาะกับลักษณะโครงการ</li>
    <li><b>Stage Gate + เข้าใจปัจจัยสำเร็จ/ล้มเหลว</b> เพิ่มโอกาสบรรลุเป้าหมาย</li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>วงจรชีวิตโครงการมีกี่เฟส อะไรบ้าง พร้อมอธิบายผลงานส่งมอบของแต่ละเฟส</li>
    <li>กลุ่มกระบวนการบริหารโครงการ 5 กลุ่มสัมพันธ์กับเฟสอย่างไร</li>
    <li>เปรียบเทียบรูปแบบวงจรชีวิตแบบ Predictive, Iterative และ Agile พร้อมตัวอย่างความเหมาะสม</li>
    <li>Stage Gate มีประโยชน์ต่อการบริหารโครงการอย่างไร</li>
    <li>ยกตัวอย่างปัจจัยความสำเร็จและสาเหตุความล้มเหลวอย่างละ 3 ข้อ</li>
    <li>โครงงานของกลุ่มท่านควรใช้รูปแบบวงจรชีวิตแบบใด เพราะเหตุใด</li>
    <li>ระบุว่าขณะนี้โครงงานของท่านอยู่ในเฟสใด และกิจกรรมถัดไปคืออะไร</li>
    <li>เหตุใดการติดตามและควบคุมจึงต้องทำคู่ขนานกับการดำเนินการ</li>
  </ol>
`},
{ id:"c2-gloss", part:"", group:"บทที่ 2 · วงจรชีวิตโครงการ", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 2</h2>
  <div class="gdef">
    <div class="gitem"><b>Project Life Cycle</b><span>ลำดับช่วงงานที่โครงการต้องผ่านตั้งแต่เริ่มต้นจนสิ้นสุด</span></div>
    <div class="gitem"><b>Process Groups</b><span>กลุ่มกระบวนการบริหารโครงการ 5 กลุ่มตามแนว PMBOK</span></div>
    <div class="gitem"><b>Predictive (Waterfall)</b><span>รูปแบบวงจรชีวิตที่วางแผนละเอียดและดำเนินตามลำดับ</span></div>
    <div class="gitem"><b>Agile / Adaptive</b><span>รูปแบบทำงานเป็นรอบสั้น ปรับตัวตามผลตอบรับ</span></div>
    <div class="gitem"><b>Stage Gate</b><span>จุดตัดสินใจระหว่างเฟสว่าจะไปต่อ ปรับแผน หรือยุติ</span></div>
    <div class="gitem"><b>Scope Creep</b><span>การขยายขอบเขตงานเกินกว่าที่กำหนดโดยไม่ควบคุม</span></div>
    <div class="gitem"><b>Deliverable</b><span>ผลงานส่งมอบที่จับต้องได้ของแต่ละเฟส</span></div>
  </div>
  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management.</i> · PMI. <i>PMBOK Guide.</i></div>
`},

{ id:"ch3", part:"ส่วนที่ 2 · ริเริ่มโครงการ", group:"บทที่ 3 · การริเริ่มและศึกษาความเป็นไปได้", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`
  <div class="eyebrow">บทที่ 3 · Overview</div><h2 class="title">การริเริ่มโครงการและการศึกษาความเป็นไปได้</h2>
  <div class="timechip">⏱ เวลาสอนโดยประมาณ <b>2–2.5 ชั่วโมง</b> · 9 หน้าจอสอน</div>
  <p class="lead">ก่อนลงมือทำ ต้องประเมินก่อนว่าโครงการ "คุ้มค่า" และ "เป็นไปได้" หรือไม่ การตัดสินใจที่ดีในระยะนี้ป้องกันการลงทุนที่สูญเปล่า</p>
  <div class="callout info"><b>ทำไมสำคัญ:</b> การตัดสินใจผิดในระยะริเริ่มมีต้นทุนสูงมาก เพราะยังไม่รู้ข้อมูลครบ บทนี้ให้เครื่องมือประเมินอย่างเป็นระบบก่อนอนุมัติโครงการ</div>
  <h3>วัตถุประสงค์การเรียนรู้ประจำบท</h3>
  <ul class="clean">
    <li>อธิบายขั้นตอนการริเริ่มโครงการและการกำหนดแนวคิดได้</li>
    <li>เลือกใช้เกณฑ์และเครื่องมือในการคัดเลือกโครงการได้</li>
    <li>อธิบายและจัดทำการศึกษาความเป็นไปได้ทั้ง 4 ด้านได้</li>
    <li>วิเคราะห์ต้นทุน-ผลตอบแทนและจัดทำกรณีทางธุรกิจ (Business Case) เบื้องต้นได้</li>
    <li>ประเมินความเสี่ยงในระยะริเริ่มและประยุกต์กับโครงงานธุรกิจสมัยใหม่ได้</li>
  </ul>
  <div class="callout act"><span class="tag">เปิดคาบ</span><b>(5 นาที)</b> ให้แต่ละกลุ่มเล่า "ไอเดียโครงงาน" สั้น ๆ 1 ประโยค แล้วเก็บไว้—ท้ายคาบจะกลับมาตรวจว่าไอเดียนั้น "คุ้มและทำได้จริง" ไหม ด้วยเครื่องมือในบทนี้</div>
  <div class="chapopen" data-open="3"></div>
`},
{ id:"c3-idea", part:"", group:"บทที่ 3 · การริเริ่มและศึกษาความเป็นไปได้", nav:"3.1 กำหนดแนวคิดโครงการ", icon:"2", html:`
  <div class="eyebrow">3.2 · Idea Framing</div><h2 class="title">การกำหนดแนวคิดและที่มาของโครงการ</h2>
  <p class="lead">การริเริ่มเริ่มจากการระบุ ปัญหา · โอกาส · ความต้องการทางธุรกิจ แล้วแปลงเป็นแนวคิดโครงการที่ชัดเจน</p>
  <div class="callout info"><b>แนวคิดที่ดีต้องตอบ 3 คำถาม:</b> โครงการนี้ <b>แก้ปัญหาอะไร</b> · ให้ <b>ประโยชน์แก่ใคร</b> · และ <b>เหตุใดจึงควรทำในขณะนี้</b></div>
  <div class="grid c3">
    <div class="card"><h4><span class="num">1</span>ปัญหา/โอกาส</h4><p>ระบุปัญหาหรือช่องว่างที่พบ พร้อมหลักฐาน</p></div>
    <div class="card"><h4><span class="num t">2</span>เป้าหมาย/ประโยชน์</h4><p>ผลลัพธ์ที่คาดหวังและผู้ได้ประโยชน์</p></div>
    <div class="card"><h4><span class="num a">3</span>ความสอดคล้องกลยุทธ์</h4><p>เชื่อมกับทิศทางธุรกิจ/หน่วยงาน</p></div>
  </div>
  <div class="callout dig"><span class="tag">ชวนคิด</span>ไอเดีย "ทำแอปสั่งอาหาร" ยังกว้างไป — ลองบีบให้คม: แก้ปัญหาอะไร (รอคิวนาน) ให้ใคร (นักศึกษาช่วงพัก) ทำไมตอนนี้ (ร้านเริ่มรับ QR)?</div>
`},

{ id:"c3-cba", part:"", group:"บทที่ 3 · การริเริ่มและศึกษาความเป็นไปได้", nav:"3.4 คืนทุน + NPV + Business Case", icon:"5", html:`
  <div class="eyebrow">3.5–3.6 · Cost-Benefit</div><h2 class="title">วิเคราะห์ต้นทุน-ผลตอบแทน & Business Case</h2>
  <div class="callout info"><b>Cost-Benefit Analysis:</b> เปรียบเทียบต้นทุนทั้งหมดกับผลประโยชน์ที่คาดว่าจะได้ (ทั้งที่เป็นตัวเงินและไม่เป็นตัวเงิน) เครื่องมือที่ใช้บ่อย: <b>Payback Period</b> (คืนทุนกี่ปี) และ <b>NPV</b> (คิดมูลค่าเงินตามเวลา)</div>
  <div class="lab">
    <div class="labh">🧮 เครื่องคิดระยะเวลาคืนทุน (Payback Period) <span class="badge">ลองปรับตัวเลข</span></div>
    <div class="hint">ใส่เงินลงทุนเริ่มต้นและกระแสเงินสดสุทธิต่อปี ระบบจะคำนวณว่ากี่ปีจึงคืนทุน และวาดกราฟเงินสดสะสม</div>
    <div class="ctrlrow">
      <span class="ci"><b>เงินลงทุน (บาท)</b> <input class="numin" style="width:96px" id="pbInv" type="number" min="0" value="120000"></span>
      <span class="ci"><b>กระแสเงินสด/ปี</b> <input class="numin" style="width:88px" id="pbCf" type="number" min="1" value="40000"></span>
    </div>
    <div id="pbRes" class="res"></div>
    <div id="pbViz" class="vizwrap" style="margin-top:10px"></div>
  </div>
  <div class="callout info"><b>ทำไมต้องมี NPV:</b> Payback บอกแค่ "คืนทุนกี่ปี" แต่ไม่คิดว่าเงินอนาคตมีค่าน้อยกว่าเงินวันนี้ · <b>NPV</b> (Net Present Value) คิด "มูลค่าเงินตามเวลา" ด้วยอัตราคิดลด — NPV &gt; 0 = คุ้มค่าลงทุน</div>
  <div class="callout tip"><b>รากฐานทฤษฎี — มูลค่าเงินตามเวลา (Time Value of Money):</b> เงิน 1 บาทวันนี้มีค่ามากกว่า 1 บาทในอนาคต เพราะสามารถนำไปลงทุนให้งอกเงยได้ · นอกจาก NPV ยังมี <b>อัตราผลตอบแทนภายใน (Internal Rate of Return: IRR)</b> ซึ่งคืออัตราคิดลดที่ทำให้ NPV = 0 — ใช้ตัดสินว่าโครงการให้ผลตอบแทนสูงกว่าต้นทุนของเงินทุน (Cost of Capital) หรือไม่</div>
  <div class="lab">
    <div class="labh">🧮 เครื่องคิด NPV &amp; BCR <span class="badge">ปรับตัวเลข/อัตราคิดลด</span></div>
    <div class="hint">NPV = ผลรวมของกระแสเงินสดที่คิดลดกลับมาปัจจุบัน − เงินลงทุน · BCR = ผลประโยชน์รวม(คิดลด) ÷ เงินลงทุน</div>
    <div class="ctrlrow">
      <span class="ci"><b>เงินลงทุน</b> <input class="numin" style="width:90px" id="npvInv" type="number" min="0" value="120000"></span>
      <span class="ci"><b>เงินสด/ปี</b> <input class="numin" style="width:80px" id="npvCf" type="number" value="40000"></span>
      <span class="ci"><b>จำนวนปี</b> <input class="numin" style="width:52px" id="npvN" type="number" min="1" max="15" value="4"></span>
      <span class="ci"><b>อัตราคิดลด %</b> <input class="numin" style="width:52px" id="npvR" type="number" min="0" value="8"></span>
    </div>
    <div id="npvRes" class="res"></div>
  </div>
  <div class="callout ok"><b>Business Case</b> = เอกสารสรุปเหตุผลและความคุ้มค่าของการลงทุน ประกอบด้วย: ปัญหา/โอกาส · ทางเลือก · การวิเคราะห์ต้นทุน-ผลตอบแทน · ความเสี่ยง · ข้อเสนอแนะ — ใช้ประกอบการอนุมัติโครงการ</div>
`},

{ id:"c3-gloss", part:"", group:"บทที่ 3 · การริเริ่มและศึกษาความเป็นไปได้", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 3</h2>
  <div class="gdef">
    <div class="gitem"><b>Feasibility Study</b><span>การศึกษาความเป็นไปได้ 4 ด้าน: ตลาด เทคนิค การเงิน การจัดการ</span></div>
    <div class="gitem"><b>Weighted Scoring Model</b><span>วิธีคัดเลือกโครงการด้วยการให้คะแนนตามเกณฑ์ถ่วงน้ำหนัก</span></div>
    <div class="gitem"><b>Payback Period</b><span>ระยะเวลาที่ผลตอบแทนสะสมเท่ากับเงินลงทุน</span></div>
    <div class="gitem"><b>NPV</b><span>มูลค่าปัจจุบันสุทธิที่คำนึงถึงมูลค่าเงินตามเวลา</span></div>
    <div class="gitem"><b>Business Case</b><span>เอกสารสรุปเหตุผลและความคุ้มค่าของการลงทุนในโครงการ</span></div>
    <div class="gitem"><b>Cost-Benefit Analysis</b><span>การเปรียบเทียบต้นทุนกับผลประโยชน์เพื่อประเมินความคุ้มค่า</span></div>
    <div class="gitem"><b>Break-even Point</b><span>จุดที่รายได้เท่ากับต้นทุน</span></div>

  <h3>เอกสารอ้างอิงประจำบท</h3>

{ id:"ch4", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"ภาพรวม & วัตถุประสงค์", icon:"1", html:`

{ id:"c4-who", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"4.1 ผู้มีส่วนได้ส่วนเสียคือใคร", icon:"2", html:`
  <div class="eyebrow">4.2 · Who are Stakeholders</div><h2 class="title">ผู้มีส่วนได้ส่วนเสียคือใคร</h2>
  <div class="callout info"><b>นิยาม:</b> บุคคล กลุ่ม หรือองค์กรที่ <b>ได้รับผลกระทบจากโครงการ</b> หรือ <b>มีอิทธิพลต่อโครงการ</b> ไม่ว่าทางบวกหรือลบ ทั้งตัวโครงการ ผลงานส่งมอบ หรือผลลัพธ์</div>
  <h3>จำแนกได้หลายมุม</h3>
  <div class="grid c2">
    <div class="card"><h4>ภายใน (Internal)</h4><p>อยู่ในองค์กร/ทีม — ผู้สนับสนุนโครงการ (Sponsor) · ผู้จัดการโครงการ · ทีมงาน · ผู้บริหาร</p></div>
    <div class="card"><h4>ภายนอก (External)</h4><p>อยู่นอกองค์กร — ลูกค้า/ผู้ใช้ · คู่ค้า/ซัพพลายเออร์ · ชุมชน · หน่วยงานกำกับ · คู่แข่ง</p></div>
    <div class="card"><h4>หลัก (Primary)</h4><p>เกี่ยวข้องโดยตรง มีผลได้ผลเสียชัด — ผู้ใช้ ทีมงาน ผู้ลงทุน</p></div>
    <div class="card"><h4>รอง (Secondary)</h4><p>เกี่ยวข้องทางอ้อม แต่มีอิทธิพลได้ — สื่อ ชุมชน กลุ่มผลประโยชน์</p></div>
  </div>
  <div class="callout warn"><b>ทำไมต้องใส่ใจ:</b> โครงการล้มเหลวจำนวนมากไม่ได้ล้มเพราะเทคนิค แต่เพราะ "มองข้ามคนสำคัญ" — คนที่ถูกลืมมักกลายเป็นแรงต้านในภายหลัง</div>
  <div class="callout dig"><span class="tag">ชวนคิด</span>โครงงาน "แอปสั่งอาหารในมหาวิทยาลัย" มีใครเป็นผู้มีส่วนได้ส่วนเสียบ้าง? ลองไล่ทั้งภายใน/ภายนอก และหลัก/รอง — จะพบว่ามีมากกว่าที่คิด (นิสิต ร้านค้า แม่บ้าน ฝ่ายไอที อาจารย์ ผู้ปกครอง ฯลฯ)</div>
`},
{ id:"c4-register", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"4.2 ระบุ + ทะเบียน (Register)", icon:"3", html:`
  <div class="eyebrow">4.3 · Identify &amp; Register</div><h2 class="title">การระบุและทะเบียนผู้มีส่วนได้ส่วนเสีย</h2>

      <tr><td>ฝ่ายไอทีมหาวิทยาลัย</td><td>ภายใน/รอง</td><td>สูง</td><td>ต่ำ</td><td>ปลอดภัย ไม่กระทบระบบ</td><td>ทำให้พึงพอใจ</td></tr>

  <div class="callout ok"><b>ทะเบียนช่วยอะไร:</b> รวมข้อมูลผู้เกี่ยวข้องไว้ที่เดียว — ใคร คาดหวังอะไร มีอำนาจ/ความสนใจแค่ไหน และเราจะใช้กลยุทธ์ใด ใช้เป็นฐานของเครื่องมือวิเคราะห์หน้าถัดไป</div>

{ id:"c4-grid", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"4.3 Power–Interest Grid (กลยุทธ์)", icon:"4", html:`

    <div class="qcell" data-q="2"><b>แจ้งข้อมูลสม่ำเสมอ</b><span>อำนาจต่ำ / สนใจสูง — ได้รับผลกระทบโดยตรง</span></div>

{ id:"c4-salience", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"4.4 Salience Model", icon:"6", html:`
  <div class="eyebrow">4.5 · Salience Model</div><h2 class="title">Salience Model — มองผู้เกี่ยวข้อง 3 มิติ</h2>
  <p class="lead">บางครั้ง Power–Interest ไม่พอ Salience Model เพิ่มมิติ "ความชอบธรรม" และ "ความเร่งด่วน" เข้ามา ช่วยจัดลำดับความสำคัญได้ละเอียดขึ้น</p>
  <svg class="svenn" viewBox="0 0 400 320" aria-label="Salience Venn">
    <circle cx="150" cy="130" r="105" fill="rgba(51,86,158,.20)" stroke="#33569E" stroke-width="1.5"/>
    <circle cx="250" cy="130" r="105" fill="rgba(46,139,114,.20)" stroke="#2E8B72" stroke-width="1.5"/>
    <circle cx="200" cy="220" r="105" fill="rgba(232,145,45,.20)" stroke="#E8912D" stroke-width="1.5"/>
    <text x="95" y="95" font-size="13" font-weight="800" fill="#33569E">อำนาจ</text>

  </svg>
  <div class="grid c3">
    <div class="card"><h4>1 มิติ</h4><p><b>Dormant</b> (มีอำนาจแต่ไม่ใช้) · <b>Discretionary</b> (ชอบธรรมแต่ไม่มีอำนาจ) · <b>Demanding</b> (เร่งด่วนแต่ไม่มีอำนาจ/ชอบธรรม)</p></div>
    <div class="card"><h4>2 มิติ</h4><p><b>Dominant</b> (อำนาจ+ชอบธรรม) · <b>Dependent</b> (ชอบธรรม+เร่งด่วน) · <b>Dangerous</b> (อำนาจ+เร่งด่วน แต่ไม่ชอบธรรม → ระวัง)</p></div>

`},

{ id:"c4-expect", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"4.6 บริหารความคาดหวัง & สื่อสาร", icon:"8", html:`
  <div class="eyebrow">4.7 · Managing Expectations</div><h2 class="title">การบริหารความคาดหวังและกลยุทธ์การสื่อสาร</h2>
  <div class="callout info"><b>บริหารความคาดหวัง</b> = สื่อสารและจัดการความต้องการของผู้เกี่ยวข้อง ให้สอดคล้องกับสิ่งที่โครงการส่งมอบได้จริง — ป้องกัน "คาดหวังเกินจริงแล้วผิดหวัง"</div>
  <h3>กลยุทธ์สื่อสารตามกลุ่ม (จับคู่กับ Power–Interest)</h3>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">กลุ่ม</th><th style="background:var(--blue)">วิธีสื่อสาร</th><th style="background:var(--teal)">ความถี่</th></tr></thead>
    <tbody>
      <tr><td>บริหารใกล้ชิด (อำนาจสูง/สนใจสูง)</td><td>ประชุมตัวต่อตัว · ให้ร่วมตัดสินใจ · รายงานเชิงลึก</td><td>ถี่ (รายสัปดาห์)</td></tr>
      <tr><td>ทำให้พึงพอใจ (อำนาจสูง/สนใจต่ำ)</td><td>สรุปสั้น เฉพาะประเด็นสำคัญ · ไม่รบกวนรายละเอียด</td><td>เป็นระยะ (สำคัญ ๆ)</td></tr>
      <tr><td>แจ้งข้อมูล (อำนาจต่ำ/สนใจสูง)</td><td>อัปเดตสม่ำเสมอ · เปิดช่องรับฟัง/ข้อเสนอแนะ</td><td>สม่ำเสมอ</td></tr>
      <tr><td>เฝ้าติดตาม (อำนาจต่ำ/สนใจต่ำ)</td><td>ประกาศทั่วไป · ช่องทางสาธารณะ</td><td>น้อย</td></tr>
    </tbody>
  </table></div>
  <div class="grid c2">
    <div class="card"><h4>รับฟังความเห็น</h4><p>เปิดช่องให้แสดงความต้องการและความกังวลตั้งแต่ต้น</p></div>
    <div class="card"><h4>ให้ข้อมูลโปร่งใส</h4><p>สื่อสารความก้าวหน้าและข้อจำกัดอย่างตรงไปตรงมา สร้างความไว้วางใจ</p></div>
  </div>
  <div class="callout ok"><b>ผลลัพธ์:</b> การมีส่วนร่วมที่ดีสร้าง "การสนับสนุน" และลด "แรงต้าน" — เปลี่ยนผู้ที่อาจขัดขวางให้กลายเป็นแนวร่วม</div>
  <div class="callout act"><span class="tag">อภิปราย</span><b>(8 นาที)</b> ในโครงงานของกลุ่ม ใครคือคนที่ "สนใจสูงแต่เรามักลืม"? จะสื่อสารกับเขาอย่างไรให้ไม่กลายเป็นแรงต้าน</div>
`},
{ id:"c4-portfolio", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"4.7 คัดเลือก & จัดลำดับ", icon:"9", html:`
  <div class="eyebrow">4.6 · Portfolio</div><h2 class="title">การคัดเลือกและจัดลำดับความสำคัญของโครงการ</h2>
  <div class="callout info"><b>เมื่อมีหลายโครงการแต่ทรัพยากรจำกัด</b> ต้องจัดลำดับด้วยเกณฑ์: ผลตอบแทน · ความเร่งด่วน · ความเสี่ยง · ความสอดคล้องกลยุทธ์ — <b>Project Portfolio Management</b> ช่วยเลือกลงทุนที่สร้างคุณค่าสูงสุด</div>
  <div class="lab">
    <div class="labh">🧮 ตารางให้คะแนนจัดลำดับโครงการ (Weighted Scoring) <span class="badge">ปรับคะแนน 1–5</span></div>
    <div class="hint">ใส่คะแนน 1–5 ของแต่ละเกณฑ์ (ความเสี่ยง: ยิ่งเสี่ยงต่ำยิ่งได้คะแนนสูง) ระบบคูณน้ำหนักและจัดอันดับให้อัตโนมัติ</div>
    <div class="vizwrap"><table class="scoretab" id="scTab"></table></div>
    <div id="scRes" class="res" style="margin-top:10px"></div>
  </div>
  <div class="callout warn"><b>ระวัง:</b> การจัดลำดับที่ไม่เป็นระบบ ทำให้กระจายทรัพยากรมากเกินไปจน "ไม่มีโครงการใดสำเร็จ"</div>
`},
{ id:"c4-case", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"กรณีศึกษาประจำบท", icon:"◆", html:`
  <div class="eyebrow">Case Study</div><h2 class="title">กรณีศึกษา: ตลาดนัดออนไลน์ของชุมชน</h2>
  <div class="tablewrap"><table class="cmp">
    <thead><tr><th style="background:var(--navy)">กลุ่ม</th><th style="background:var(--blue)">อำนาจ/ความสนใจ</th><th style="background:var(--teal)">กลยุทธ์</th></tr></thead>
    <tbody>
      <tr><td>พ่อค้าแม่ค้า</td><td>อำนาจสูง / สนใจสูง</td><td>บริหารอย่างใกล้ชิด</td></tr>
      <tr><td>ลูกค้า</td><td>อำนาจต่ำ / สนใจสูง</td><td>แจ้งข้อมูล + รับฟังสม่ำเสมอ</td></tr>
      <tr><td>หน่วยงานท้องถิ่น</td><td>อำนาจสูง / สนใจปานกลาง</td><td>ทำให้พึงพอใจ</td></tr>
    </tbody>
  </table></div>
  <div class="callout ok"><b>ผลลัพธ์:</b> ทีมจัดทำทะเบียนผู้มีส่วนได้ส่วนเสียและวางแผนสื่อสารที่ต่างกันในแต่ละกลุ่ม ทำให้โครงงานได้รับความร่วมมือและดำเนินไปราบรื่น</div>
  <div class="callout act"><span class="tag">ลงมือ</span><b>(10 นาที)</b> ให้แต่ละกลุ่มวางผู้เกี่ยวข้องของโครงงานตัวเองลงใน Power–Interest Grid (หน้า 4.2) อย่างน้อย 5 กลุ่ม พร้อมระบุกลยุทธ์</div>
`},
{ id:"c4-sum", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"สรุป & คำถามทบทวน", icon:"✓", html:`
  <div class="eyebrow">สรุป</div><h2 class="title">สรุปบทที่ 4</h2>
  <ul class="clean">
    <li><b>ผู้มีส่วนได้ส่วนเสีย</b> — ระบุ (ภายใน/ภายนอก) และบันทึกใน Stakeholder Register ตั้งแต่ต้น</li>
    <li><b>Power–Interest Grid</b> — 4 กลยุทธ์: บริหารใกล้ชิด · ทำให้พึงพอใจ · แจ้งข้อมูล · เฝ้าติดตาม</li>
    <li><b>บริหารความคาดหวัง</b> สร้างการสนับสนุนและลดแรงต้าน</li>
    <li><b>จัดลำดับโครงการ (Portfolio)</b> เลือกลงทุนที่สร้างคุณค่าสูงสุด</li>
  </ul>
  <h3>คำถามทบทวนและแบบฝึกหัดท้ายบท</h3>
  <ol class="qs">
    <li>ผู้มีส่วนได้ส่วนเสียคือใคร และแบ่งประเภทได้อย่างไร</li>
    <li>ระบุผู้มีส่วนได้ส่วนเสียของโครงงานกลุ่มท่านอย่างน้อย 5 กลุ่ม และจัดลงใน Power–Interest Grid</li>
    <li>อธิบายกลยุทธ์ที่เหมาะสมกับผู้มีส่วนได้ส่วนเสียแต่ละกลุ่ม</li>
    <li>Stakeholder Register มีประโยชน์อย่างไร</li>
    <li>เหตุใดการบริหารความคาดหวังจึงมีผลต่อความสำเร็จของโครงการ</li>
    <li>ยกตัวอย่างเกณฑ์ที่ใช้จัดลำดับความสำคัญของโครงการ</li>
    <li>วิเคราะห์ว่าหากละเลยผู้มีส่วนได้ส่วนเสียกลุ่มใดในโครงงานของท่าน จะเกิดผลอย่างไร</li>
    <li>Project Portfolio Management ช่วยองค์กรอย่างไร</li>
  </ol>
`},
{ id:"c4-gloss", part:"", group:"บทที่ 4 · ผู้มีส่วนได้ส่วนเสียและการจัดลำดับโครงการ", nav:"ศัพท์สำคัญ & อ้างอิง", icon:"A", html:`
  <div class="eyebrow">Key Terms</div><h2 class="title">ศัพท์และแนวคิดสำคัญ · บทที่ 4</h2>
  <div class="gdef">
    <div class="gitem"><b>Stakeholders</b><span>บุคคลหรือกลุ่มที่ได้รับผลกระทบหรือมีอิทธิพลต่อโครงการ</span></div>
    <div class="gitem"><b>Stakeholder Register</b><span>ทะเบียนบันทึกข้อมูลและความคาดหวังของผู้มีส่วนได้ส่วนเสีย</span></div>
    <div class="gitem"><b>Power–Interest Grid</b><span>เครื่องมือจัดกลุ่มผู้มีส่วนได้ส่วนเสียตามอำนาจและความสนใจ (4 กลยุทธ์)</span></div>
    <div class="gitem"><b>Salience Model</b><span>จำแนกผู้เกี่ยวข้องด้วย 3 มิติ: อำนาจ ความชอบธรรม ความเร่งด่วน (7 ประเภท)</span></div>
    <div class="gitem"><b>Engagement Assessment Matrix</b><span>ตารางประเมินระดับการมีส่วนร่วม (Unaware→Leading) ปัจจุบันเทียบเป้าหมาย</span></div>
    <div class="gitem"><b>การบริหารความคาดหวัง</b><span>การจัดการความต้องการและความกังวลของผู้มีส่วนได้ส่วนเสีย</span></div>
    <div class="gitem"><b>Project Portfolio Management</b><span>การบริหารกลุ่มโครงการเพื่อเลือกลงทุนให้เกิดคุณค่าสูงสุด</span></div>
    <div class="gitem"><b>การจัดลำดับความสำคัญ</b><span>การเรียงลำดับโครงการตามคุณค่าและเกณฑ์ที่กำหนด</span></div>
  </div>
  <h3>เอกสารอ้างอิงประจำบท</h3>
  <div class="callout info" style="font-size:13.5px">วิสูตร จิระดำเกิง. <i>การบริหารโครงการ แนวทางปฏิบัติจริง.</i> · บรรจง อมรชีวิน. <i>การวางแผนและการบริหารโครงการ.</i> · Kloppenborg, T. J. <i>Contemporary Project Management.</i> · Pinto, J. K. <i>Project Management.</i> · PMI. <i>PMBOK Guide.</i></div>
`},
